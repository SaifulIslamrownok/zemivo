<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Zemivo Audio → Living 3D</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#05070c;
  color:#fff;
}

.page{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.header{
  height:64px;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(10,15,25,.94);
  border-bottom:1px solid rgba(255,255,255,.12);
}

.logo{
  font-size:24px;
  font-weight:800;
  color:#60a5fa;
}

.badge{
  font-size:12px;
  padding:7px 11px;
  border-radius:20px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  color:#cbd5e1;
}

.main{
  flex:1;
  display:grid;
  grid-template-columns:340px 1fr;
  min-height:0;
}

.panel{
  padding:18px;
  background:rgba(10,15,25,.97);
  border-right:1px solid rgba(255,255,255,.1);
  overflow-y:auto;
}

.title{
  font-size:22px;
  font-weight:800;
  margin-bottom:7px;
}

.subtitle{
  color:#94a3b8;
  font-size:13px;
  line-height:1.5;
  margin-bottom:18px;
}

.upload-box{
  border:1px dashed rgba(255,255,255,.25);
  border-radius:16px;
  padding:18px;
  background:rgba(255,255,255,.04);
}

.upload-box input{
  width:100%;
  color:#cbd5e1;
  font-size:13px;
}

.audio-player{
  width:100%;
  margin-top:15px;
  display:none;
}

.description{
  margin-top:15px;
}

.description label{
  display:block;
  font-size:13px;
  color:#cbd5e1;
  margin-bottom:7px;
}

.description textarea{
  width:100%;
  min-height:90px;
  resize:vertical;
  border:1px solid rgba(255,255,255,.14);
  border-radius:12px;
  background:#0f172a;
  color:#fff;
  padding:11px;
  outline:none;
}

.description textarea:focus{
  border-color:#60a5fa;
}

.react-button{
  width:100%;
  margin-top:15px;
  padding:13px;
  border:0;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

.react-button:hover{
  background:#1d4ed8;
}

.react-button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.results{
  margin-top:18px;
  display:grid;
  gap:9px;
}

.result{
  padding:12px;
  border-radius:12px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
}

.result-label{
  font-size:11px;
  color:#94a3b8;
  margin-bottom:4px;
}

.result-value{
  font-size:15px;
  font-weight:800;
  text-transform:capitalize;
}

.colors{
  display:flex;
  gap:7px;
  margin-top:8px;
}

.color{
  width:28px;
  height:28px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.3);
}

.world{
  position:relative;
  min-width:0;
  min-height:0;
  background:#000;
}

.world iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
}

.status{
  position:absolute;
  left:18px;
  bottom:18px;
  z-index:5;
  padding:9px 13px;
  border-radius:20px;
  background:rgba(0,0,0,.52);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(10px);
  font-size:12px;
  color:#cbd5e1;
}

@media(max-width:800px){

  .main{
    grid-template-columns:1fr;
  }

  .panel{
    border-right:0;
    border-bottom:1px solid rgba(255,255,255,.1);
  }

  .world{
    height:65vh;
    min-height:450px;
  }

}

</style>

</head>


<body>

<div class="page">


<header class="header">

  <div class="logo">
    Zemivo
  </div>

  <div class="badge">
    Audio → Living 3D
  </div>

</header>


<main class="main">


<section class="panel">

  <div class="title">
    Audio → Living 3D
  </div>

  <div class="subtitle">
    Upload music or audio. Zemivo will analyze
    audio energy and tempo, then make the
    3D environment react.
  </div>


  <div class="upload-box">

    <input
      id="audioInput"
      type="file"
      accept="audio/*"
    >

    <audio
      id="audioPlayer"
      class="audio-player"
      controls
    >
    </audio>

  </div>


  <div class="description">

    <label for="description">
      Optional description
    </label>

    <textarea
      id="description"
      placeholder="Example: cinematic music, peaceful piano, energetic electronic music..."
    ></textarea>

  </div>


  <button
    id="reactButton"
    class="react-button"
    type="button"
    disabled
  >
    ✨ Make Zemivo React
  </button>


  <div class="results">


    <div class="result">

      <div class="result-label">
        WORLD
      </div>

      <div
        id="worldResult"
        class="result-value"
      >
        Waiting...
      </div>

    </div>


    <div class="result">

      <div class="result-label">
        MOOD
      </div>

      <div
        id="moodResult"
        class="result-value"
      >
        Waiting...
      </div>

    </div>


    <div class="result">

      <div class="result-label">
        MOTION
      </div>

      <div
        id="motionResult"
        class="result-value"
      >
        Waiting...
      </div>

    </div>


    <div class="result">

      <div class="result-label">
        AUDIO ENERGY
      </div>

      <div
        id="energyResult"
        class="result-value"
      >
        Waiting...
      </div>

    </div>


    <div class="result">

      <div class="result-label">
        TEMPO
      </div>

      <div
        id="tempoResult"
        class="result-value"
      >
        Waiting...
      </div>

    </div>


  </div>

</section>


<section class="world">

  <iframe
    id="worldFrame"
    src="zemivo-living-world.html"
    title="Zemivo Living 3D World"
  ></iframe>


  <div
    id="status"
    class="status"
  >
    Waiting for audio...
  </div>

</section>


</main>

</div>


<script>

const audioInput =
  document.getElementById(
    "audioInput"
  );

const audioPlayer =
  document.getElementById(
    "audioPlayer"
  );

const reactButton =
  document.getElementById(
    "reactButton"
  );

const description =
  document.getElementById(
    "description"
  );

const worldResult =
  document.getElementById(
    "worldResult"
  );

const moodResult =
  document.getElementById(
    "moodResult"
  );

const motionResult =
  document.getElementById(
    "motionResult"
  );

const energyResult =
  document.getElementById(
    "energyResult"
  );

const tempoResult =
  document.getElementById(
    "tempoResult"
  );

const status =
  document.getElementById(
    "status"
  );

const worldFrame =
  document.getElementById(
    "worldFrame"
  );


let selectedAudio = null;

let audioEnergy = 0;

let audioTempo = 0;


/* AUDIO SELECT */

audioInput.addEventListener(
  "change",
  function(){

    const file =
      audioInput.files[0];

    if(!file){

      selectedAudio = null;

      audioPlayer.style.display =
        "none";

      reactButton.disabled =
        true;

      status.textContent =
        "Waiting for audio...";

      return;

    }


    if(
      !file.type.startsWith(
        "audio/"
      )
    ){

      alert(
        "Please select an audio file."
      );

      audioInput.value = "";

      return;

    }


    selectedAudio =
      file;


    const audioURL =
      URL.createObjectURL(
        file
      );


    audioPlayer.src =
      audioURL;


    audioPlayer.style.display =
      "block";


    reactButton.disabled =
      false;


    status.textContent =
      "Audio loaded. Ready to analyze.";

  }
);


/* ANALYZE AUDIO */

async function analyzeAudio(){

  if(!selectedAudio){

    return;

  }


  status.textContent =
    "Analyzing audio...";


  const AudioContextClass =
    window.AudioContext ||
    window.webkitAudioContext;


  if(!AudioContextClass){

    status.textContent =
      "Audio analysis is not supported in this browser.";

    return;

  }


  try{

    const context =
      new AudioContextClass();


    const arrayBuffer =
      await selectedAudio.arrayBuffer();


    const audioBuffer =
      await context.decodeAudioData(
        arrayBuffer
      );


    audioEnergy =
      calculateEnergy(
        audioBuffer
      );


    audioTempo =
      estimateTempo(
        audioBuffer
      );


    energyResult.textContent =
      Math.round(
        audioEnergy * 100
      ) +
      "%";


    tempoResult.textContent =
      Math.round(
        audioTempo
      ) +
      " BPM";


    status.textContent =
      "Audio analyzed. Ready.";


    await context.close();

  }
  catch(error){

    console.error(
      "Audio analysis error:",
      error
    );


    audioEnergy =
      0.5;


    audioTempo =
      100;


    energyResult.textContent =
      "50%";


    tempoResult.textContent =
      "100 BPM";


    status.textContent =
      "Basic audio analysis ready.";

  }

}


/* ENERGY */

function calculateEnergy(
  audioBuffer
){

  let total =
    0;

  let count =
    0;


  const channels =
    audioBuffer.numberOfChannels;


  const length =
    audioBuffer.length;


  const step =
    Math.max(
      1,
      Math.floor(
        length / 100000
      )
    );


  for(
    let channel = 0;
    channel < channels;
    channel++
  ){

    const data =
      audioBuffer.getChannelData(
        channel
      );


    for(
      let i = 0;
      i < length;
      i += step
    ){

      const value =
        data[i] || 0;


      total +=
        value * value;


      count++;

    }

  }


  const rms =
    Math.sqrt(
      total /
      Math.max(
        1,
        count
      )
    );


  return Math.min(
    1,
    rms * 4
  );

}


/* SIMPLE TEMPO ESTIMATION */

function estimateTempo(
  audioBuffer
){

  const sampleRate =
    audioBuffer.sampleRate;


  const data =
    audioBuffer.getChannelData(
      0
    );


  const duration =
    audioBuffer.duration;


  const maxSeconds =
    Math.min(
      30,
      duration
    );


  const sampleLength =
    Math.floor(
      sampleRate *
      maxSeconds
    );


  const step =
    Math.max(
      1,
      Math.floor(
        sampleLength /
        200000
      )
    );


  let previous =
    0;


  const peaks = [];


  for(
    let i = 0;
    i < sampleLength;
    i += step
  ){

    const value =
      Math.abs(
        data[i] || 0
      );


    if(
      value > 0.65 &&
      value > previous * 1.25
    ){

      peaks.push(
        i /
        sampleRate
      );

    }


    previous =
      value;

  }


  if(
    peaks.length < 2
  ){

    return 90;

  }


  const intervals = [];


  for(
    let i = 1;
    i < peaks.length;
    i++
  ){

    const interval =
      peaks[i] -
      peaks[i - 1];


    if(
      interval > 0.2 &&
      interval < 2
    ){

      intervals.push(
        interval
      );

    }

  }


  if(
    intervals.length === 0
  ){

    return 90;

  }


  const average =
    intervals.reduce(
      function(sum,value){

        return sum + value;

      },
      0
    ) /
    intervals.length;


  let bpm =
    60 /
    average;


  while(
    bpm < 60
  ){

    bpm *= 2;

  }


  while(
    bpm > 180
  ){

    bpm /= 2;

  }


  return bpm;

}


/* MAKE ZEMIVO REACT */

async function makeZemivoReact(){

  if(!selectedAudio){

    return;

  }


  reactButton.disabled =
    true;


  await analyzeAudio();


  status.textContent =
    "Making Zemivo react...";


  const waitForEngine =
    setInterval(
      function(){

        try{

          const engine =
            worldFrame
              .contentWindow
              .ZemivoLivingWorld;


          if(
            !engine ||
            typeof
            engine.analyzeContent
            !==
            "function"
          ){

            return;

          }


          clearInterval(
            waitForEngine
          );


          const profile =
            engine.analyzeContent({

              text:
                description.value.trim(),

              contentType:
                "audio",

              audioEnergy:
                audioEnergy,

              audioTempo:
                audioTempo,

              tags:
                [],

              context:
                "uploaded audio"

            });


          engine.applyContentVisualProfile(
            profile
          );


          worldResult.textContent =
            profile.mode ||
            "personal";


          moodResult.textContent =
            profile.mood ||
            "calm";


          motionResult.textContent =
            profile.motion ||
            "soft";


          status.textContent =
            "Zemivo is reacting to the audio.";


          reactButton.disabled =
            false;

        }
        catch(error){

          console.error(
            error
          );

        }

      },
      100
    );


  setTimeout(
    function(){

      clearInterval(
        waitForEngine
      );


      reactButton.disabled =
        false;

    },
    7000
  );

}


/* BUTTON */

reactButton.addEventListener(
  "click",
  makeZemivoReact
);


</script>

</body>

</html>
