<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zemivo - Accessibility</title>
<style>
body{font-family:Arial;background:#f4f6f8}.card{background:white;max-width:700px;margin:30px auto;padding:25px;border-radius:15px}.item{padding:18px;border-bottom:1px solid #eee}button{padding:9px 15px;border:0;border-radius:20px;background:#2563eb;color:white}
</style>
</head>
<body>
<div class="card">
<h1>♿ Accessibility</h1>
<div class="item">🔤 Larger Text <button onclick="alert('Text option opened')">Manage</button></div>
<div class="item">🌙 High Contrast <button onclick="alert('Contrast option opened')">Manage</button></div>
<div class="item">🔊 Screen Reader <button onclick="alert('Reader option opened')">Manage</button></div>
</div>
</body>
</html>
