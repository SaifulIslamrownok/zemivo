<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zemivo - Ad Center</title>
<style>
body{margin:0;font-family:Arial;background:#f4f6f8;color:#222}
.topbar{background:white;padding:18px;display:flex;justify-content:space-between;box-shadow:0 2px 8px #ddd}
.logo{font-size:28px;font-weight:bold;color:#2563eb}
.topbar a{color:#2563eb;text-decoration:none;font-weight:bold}
.container{max-width:850px;margin:25px auto;padding:15px}
.card{background:white;padding:22px;border-radius:15px;margin-bottom:18px;box-shadow:0 2px 8px #ddd}
.option{padding:18px;border:1px solid #eee;border-radius:12px;margin-top:12px}
button{background:#2563eb;color:white;border:0;padding:10px 18px;border-radius:22px;font-weight:bold;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:15px}
.stat{text-align:center;background:#f8fafc;padding:18px;border-radius:10px}
.stat h2{color:#2563eb}
@media(max-width:600px){
.stats{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="topbar">
<div class="logo">Zemivo</div>
<a href="index.html">🏠 Home</a>
</header>

<main class="container">

<div class="card">
<h1>📣 Ad Center</h1>
<p>Create and manage advertisements on Zemivo.</p>
</div>

<div class="card">

<div class="option">
<h3>📢 Create Advertisement</h3>
<p>Promote your product, service or page.</p>
<button onclick="createAd()">Create Ad</button>
</div>

<div class="option">
<h3>📊 Ad Performance</h3>
<p>Track your advertisement results.</p>
</div>

<div class="stats">

<div class="stat">
<h2>0</h2>
<p>Reach</p>
</div>

<div class="stat">
<h2>0</h2>
<p>Clicks</p>
</div>

<div class="stat">
<h2>$0</h2>
<p>Spent</p>
</div>

</div>

</div>

</main>

<script>
function createAd(){
alert("Ad creation system will be connected to the Zemivo advertising backend later.");
}
</script>

</body>
</html>
