<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Zemivo - Creator Dashboard</title>

<style>

*{
  box-sizing:border-box;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6f8;
  margin:0;
  color:#17202a;
}

/* PAGE */

.zemivo-creator-page{
  min-height:100vh;
  padding:1px 15px 30px;
  position:relative;
  overflow:hidden;
}

/* LIVING WORLD FOUNDATION */

#zemivoWorld{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  overflow:hidden;
}

#zemivoWorld::before{
  content:"";
  position:absolute;
  width:420px;
  height:420px;
  top:-180px;
  right:-120px;
  border-radius:50%;
  background:
    radial-gradient(
      circle,
      rgba(37,99,235,.10) 0%,
      rgba(37,99,235,.04) 40%,
      transparent 70%
    );
  animation:zemivoWorldFloat 10s ease-in-out infinite;
}

#zemivoWorld::after{
  content:"";
  position:absolute;
  width:360px;
  height:360px;
  bottom:-180px;
  left:-130px;
  border-radius:50%;
  background:
    radial-gradient(
      circle,
      rgba(59,130,246,.08) 0%,
      rgba(59,130,246,.03) 45%,
      transparent 70%
    );
  animation:zemivoWorldFloat 13s ease-in-out infinite reverse;
}

@keyframes zemivoWorldFloat{

  0%{
    transform:translate3d(0,0,0) scale(1);
  }

  50%{
    transform:translate3d(0,18px,0) scale(1.04);
  }

  100%{
    transform:translate3d(0,0,0) scale(1);
  }

}


/* MAIN CARD */

.card{
  position:relative;
  z-index:1;

  background:rgba(255,255,255,.96);

  max-width:850px;

  margin:30px auto;

  padding:25px;

  border-radius:15px;

  box-shadow:
    0 8px 30px rgba(15,23,42,.08);
}


/* TITLE */

h1{
  margin-top:0;
  color:#2563eb;
}

.card > p{
  color:#555;
}


/* GRID */

.grid{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:12px;

  margin-top:22px;
}


/* BOX */

.box{
  padding:20px;

  background:#f8fafc;

  border-radius:12px;

  text-align:center;

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

.box:hover{
  transform:translateY(-3px);

  background:#f1f5f9;

  box-shadow:
    0 6px 18px rgba(15,23,42,.08);
}

.box h2{
  color:#2563eb;

  margin:
    0 0 8px;

  font-size:28px;
}

.box p{
  margin:0;

  color:#555;
}


/* SECURITY STATUS */

.security-status{
  margin-top:22px;

  padding:11px 14px;

  border-radius:10px;

  background:#f0fdf4;

  border:1px solid #bbf7d0;

  color:#166534;

  font-size:13px;
}


/* RESPONSIVE */

@media(max-width:600px){

  .zemivo-creator-page{
    padding:
      1px 10px 20px;
  }

  .card{
    margin:
      15px auto;

    padding:
      20px 15px;
  }

  .grid{
    grid-template-columns:1fr;
  }

}

</style>

</head>


<body>

<!-- ZEMIVO LIVING WORLD FOUNDATION -->

<div
  id="zemivoWorld"
  data-living-world="ready"
  data-world-version="1.0.0"
  aria-hidden="true"
></div>


<!-- PAGE ISOLATION -->

<main
  class="zemivo-creator-page"
  data-page="creator-dashboard"
>


  <div class="card">

    <h1>
      🏆 Creator Dashboard
    </h1>

    <p>
      Manage your Zemivo creator activity.
    </p>


    <div class="grid">


      <div class="box">

        <h2>
          0
        </h2>

        <p>
          Followers
        </p>

      </div>


      <div class="box">

        <h2>
          0
        </h2>

        <p>
          Posts
        </p>

      </div>


      <div class="box">

        <h2>
          0
        </h2>

        <p>
          Views
        </p>

      </div>


      <div class="box">

        <h2>
          0
        </h2>

        <p>
          Likes
        </p>

      </div>


      <div class="box">

        <h2>
          0
        </h2>

        <p>
          Comments
        </p>

      </div>


      <div class="box">

        <h2>
          $0
        </h2>

        <p>
          Earnings
        </p>

      </div>


    </div>


    <!-- SECURITY FOUNDATION STATUS -->

    <div
      id="securityStatus"
      class="security-status"
    >
      🔐 Zemivo Security Foundation loading...
    </div>


  </div>


</main>


<script type="module">

/*
  ZEMIVO CREATOR DASHBOARD

  Foundations:
  1. Security Foundation
  2. Page Isolation
  3. Existing Content Preservation
  4. Living World Foundation
*/


import {
  auth
} from "./zemivo-security.js";


/* PAGE ISOLATION */

const ZemivoCreatorDashboardPage = {

  version:
    "1.0.0",

  page:
    "creator-dashboard",

  livingWorld:
    "1.0.0",

  initialize(){

    this.updateSecurityStatus();

  },


  updateSecurityStatus(){

    const status =
      document.getElementById(
        "securityStatus"
      );

    if(!status){

      return;

    }


    if(auth.currentUser){

      status.textContent =
        "🔐 Zemivo Security Foundation active • Creator session protected.";

    }
    else{

      status.textContent =
        "🔐 Zemivo Security Foundation active • Sign in to access creator features.";

    }

  }

};


/* START PAGE */

ZemivoCreatorDashboardPage.initialize();


/*
  AUTH STATE

  No sensitive creator or earnings
  data is written here yet.

  The current dashboard values remain
  placeholders until the final creator
  data architecture is connected.
*/

auth.onAuthStateChanged(
  function(){

    ZemivoCreatorDashboardPage
      .updateSecurityStatus();

  }
);

</script>

</body>
</html>
