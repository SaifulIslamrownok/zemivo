<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Zemivo - Creator Dashboard</title>
<style>
body{font-family:Arial;background:#f4f6f8;margin:0}
.card{background:white;max-width:850px;margin:30px auto;padding:25px;border-radius:15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.box{padding:20px;background:#f8fafc;border-radius:12px;text-align:center}
.box h2{color:#2563eb}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="card">
<h1>🏆 Creator Dashboard</h1>
<p>Manage your Zemivo creator activity.</p>

<div class="grid">
<div class="box"><h2>0</h2><p>Followers</p></div>
<div class="box"><h2>0</h2><p>Posts</p></div>
<div class="box"><h2>0</h2><p>Views</p></div>
<div class="box"><h2>0</h2><p>Likes</p></div>
<div class="box"><h2>0</h2><p>Comments</p></div>
<div class="box"><h2>$0</h2><p>Earnings</p></div>
</div>
</div>
</body>
</html>
