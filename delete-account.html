<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zemivo - Delete Account</title>
<style>
body{font-family:Arial;background:#f4f6f8}
.card{background:white;max-width:650px;margin:30px auto;padding:25px;border-radius:15px}
button{background:#dc2626;color:white;border:0;padding:11px 18px;border-radius:20px}
</style>
</head>
<body>
<div class="card">
<h1>🗑️ Delete Account</h1>
<p>Account deletion is permanent and should require confirmation.</p>
<button onclick="confirmDelete()">Delete Account</button>
</div>
<script>
function confirmDelete(){
if(confirm("Are you sure you want to delete your account?")){
alert("Deletion request submitted");
}
}
</script>
</body>
</html>
