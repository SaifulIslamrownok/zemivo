<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>Zemivo Living World 3.0</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#020617;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  color:#fff;
}

#zemivoWorld3{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 50% 45%,
      #172554 0%,
      #020617 55%,
      #000 100%
    );
}

#worldCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

.world-ui{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:10;
}

.topbar{
  position:absolute;
  top:0;
  left:0;
  right:0;

  min-height:68px;

  padding:
    12px
    16px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:
    linear-gradient(
      to bottom,
      rgba(2,6,23,.82),
      rgba(2,6,23,0)
    );

  pointer-events:none;
}

.brand{
  font-size:24px;
  font-weight:800;
  letter-spacing:-.5px;
}

.brand span{
  color:#60a5fa;
}

.status{
  display:flex;
  align-items:center;
  gap:7px;

  padding:8px 12px;

  border:
    1px solid
    rgba(255,255,255,.12);

  border-radius:20px;

  background:
    rgba(15,23,42,.65);

  backdrop-filter:blur(12px);

  font-size:12px;
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#22c55e;
  box-shadow:
    0 0 12px
    rgba(34,197,94,.9);
}

.bottom-panel{
  position:absolute;
  left:50%;
  bottom:18px;

  transform:
    translateX(-50%);

  width:
    min(680px,calc(100% - 28px));

  padding:12px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;

  border:
    1px solid
    rgba(255,255,255,.12);

  border-radius:20px;

  background:
    rgba(2,6,23,.72);

  backdrop-filter:blur(18px);

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.35);

  pointer-events:auto;
}

.world-info{
  min-width:0;
}

.world-title{
  font-size:14px;
  font-weight:700;
}

.world-subtitle{
  margin-top:3px;
  color:#94a3b8;
  font-size:11px;
}

.controls{
  display:flex;
  gap:7px;
}

.world-button{
  border:0;

  min-width:42px;
  height:42px;

  border-radius:12px;

  background:
    rgba(255,255,255,.08);

  color:#fff;

  font-size:16px;

  cursor:pointer;

  transition:
    transform .18s ease,
    background .18s ease;
}

.world-button:hover{
  background:
    rgba(96,165,250,.22);

  transform:
    translateY(-1px);
}

.world-button:active{
  transform:
    scale(.96);
}

.loading{
  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#020617;

  z-index:30;

  transition:
    opacity .5s ease;
}

.loading.hide{
  opacity:0;
  pointer-events:none;
}

.loading-box{
  text-align:center;
}

.loading-logo{
  font-size:34px;
  font-weight:800;
}

.loading-text{
  margin-top:8px;
  color:#94a3b8;
  font-size:13px;
}

.error-box{
  position:absolute;
  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  width:
    min(420px,calc(100% - 32px));

  padding:24px;

  border-radius:18px;

  background:
    rgba(15,23,42,.95);

  border:
    1px solid
    rgba(248,113,113,.3);

  text-align:center;

  z-index:50;

  display:none;
}

.error-box.show{
  display:block;
}

.error-title{
  font-size:18px;
  font-weight:bold;
  color:#fca5a5;
}

.error-text{
  margin-top:8px;
  color:#cbd5e1;
  font-size:13px;
  line-height:1.5;
}

@media(max-width:600px){

  .brand{
    font-size:21px;
  }

  .status{
    font-size:10px;
    padding:7px 9px;
  }

  .bottom-panel{
    bottom:
      calc(12px + env(safe-area-inset-bottom));

    border-radius:17px;
  }

  .world-title{
    font-size:12px;
  }

  .world-subtitle{
    font-size:10px;
  }

}

@media(prefers-reduced-motion:reduce){

  *{
    scroll-behavior:auto !important;
  }

}

</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>
</head>

<body>

<div id="zemivoWorld3">

  <canvas id="worldCanvas"></canvas>

  <div class="world-ui">

    <header class="topbar">

      <div class="brand">
        <span>Zemivo</span>
        Living World
      </div>

      <div class="status">

        <span class="status-dot"></span>

        <span id="securityStatus">
          Starting...
        </span>

      </div>

    </header>


    <div class="bottom-panel">

      <div class="world-info">

        <div
          id="worldTitle"
          class="world-title"
        >
          Zemivo Living World
        </div>

        <div
          id="worldSubtitle"
          class="world-subtitle"
        >
          3D foundation • Future-ready
        </div>

      </div>


      <div class="controls">

        <button
          id="pauseButton"
          class="world-button"
          type="button"
          title="Pause"
        >
          ⏸
        </button>

        <button
          id="resetButton"
          class="world-button"
          type="button"
          title="Reset camera"
        >
          ↻
        </button>

      </div>

    </div>

  </div>


  <div
    id="loading"
    class="loading"
  >

    <div class="loading-box">

      <div class="loading-logo">
        Zemivo
      </div>

      <div class="loading-text">
        Building Living World...
      </div>

    </div>

  </div>


  <div
    id="errorBox"
    class="error-box"
  >

    <div class="error-title">
      Living World could not start
    </div>

    <div
      id="errorText"
      class="error-text"
    >
      Please check your browser and internet connection.
    </div>

  </div>

</div>


<script type="module">

/*
==========================================================
ZEMIVO LIVING WORLD 3.0
REAL 3D FOUNDATION
==========================================================

Architecture goals:

1. WebGL 3D rendering
2. Modular world
3. Future avatar system
4. Future content system
5. Future AI system
6. Future social interaction
7. Future commerce
8. Future gaming
9. Future GLB/GLTF assets
10. Mobile-ready rendering
11. Security foundation
12. Page isolation

This page does NOT modify index.html.
*/


/* ======================================================
   SECURITY FOUNDATION
====================================================== */

let ZemivoSecurity = null;

try{

  const security =
    await import("./zemivo-security.js");

  ZemivoSecurity =
    security.ZemivoSecurity;

}
catch(error){

  console.warn(
    "Zemivo Security Foundation unavailable.",
    error
  );

}


/* ======================================================
   THREE.JS
====================================================== */

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import {
  OrbitControls
}
from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";


/* ======================================================
   PAGE ISOLATION
====================================================== */

const ZemivoLivingWorld3 =
{

  version:
    "3.0.0",

  page:
    "zemivo-living-world-3",

  engine:
    "Three.js WebGL",

  future:
    true

};


/* ======================================================
   ELEMENTS
====================================================== */

const root =
  document.getElementById(
    "zemivoWorld3"
  );

const canvas =
  document.getElementById(
    "worldCanvas"
  );

const loading =
  document.getElementById(
    "loading"
  );

const errorBox =
  document.getElementById(
    "errorBox"
  );

const errorText =
  document.getElementById(
    "errorText"
  );

const securityStatus =
  document.getElementById(
    "securityStatus"
  );

const pauseButton =
  document.getElementById(
    "pauseButton"
  );

const resetButton =
  document.getElementById(
    "resetButton"
  );

const worldTitle =
  document.getElementById(
    "worldTitle"
  );

const worldSubtitle =
  document.getElementById(
    "worldSubtitle"
  );


/* ======================================================
   REDUCED MOTION
====================================================== */

const reducedMotion =
  window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;


/* ======================================================
   SECURITY STATUS
====================================================== */

if(
  ZemivoSecurity &&
  ZemivoSecurity.app &&
  ZemivoSecurity.appCheck
){

  securityStatus.textContent =
    "Security foundation ready";

}
else{

  securityStatus.textContent =
    "3D world ready";

}


/* ======================================================
   RENDERER
====================================================== */

let renderer;

try{

  renderer =
    new THREE.WebGLRenderer({

      canvas,

      antialias:
        true,

      alpha:
        true,

      powerPreference:
        "high-performance"

    });

}
catch(error){

  showError(
    "WebGL is not available in this browser."
  );

  throw error;

}


renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio || 1,
    1.75
  )
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.shadowMap.enabled =
  true;

renderer.shadowMap.type =
  THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
  THREE.SRGBColorSpace;


/* ======================================================
   SCENE
====================================================== */

const scene =
  new THREE.Scene();

scene.background =
  new THREE.Color(
    0x020617
  );

scene.fog =
  new THREE.FogExp2(
    0x020617,
    0.018
  );


/* ======================================================
   CAMERA
====================================================== */

const camera =
  new THREE.PerspectiveCamera(

    55,

    window.innerWidth /
      window.innerHeight,

    0.1,

    1000

  );

camera.position.set(
  18,
  13,
  22
);


/* ======================================================
   CAMERA CONTROLS
====================================================== */

const controls =
  new OrbitControls(
    camera,
    canvas
  );

controls.enableDamping =
  true;

controls.dampingFactor =
  0.055;

controls.minDistance =
  8;

controls.maxDistance =
  55;

controls.maxPolarAngle =
  Math.PI * 0.47;

controls.target.set(
  0,
  2,
  0
);


/* ======================================================
   ZEMIVO WORLD HIERARCHY
====================================================== */

/*
   World
      ↓
   Region
      ↓
   City
      ↓
   Area
      ↓
   Building
      ↓
   Room / Space

   This structure is designed for future:
   Social
   Creator
   Commerce
   AI
   Gaming
   Education
   Business
   Content
   Avatars
*/


/* ======================================================
   WORLD ROOT
====================================================== */

const worldRoot =
  new THREE.Group();

worldRoot.name =
  "ZemivoWorld";

scene.add(
  worldRoot
);


/* ======================================================
   WORLD HIERARCHY ROOTS
====================================================== */

const regionRoot =
  new THREE.Group();

regionRoot.name =
  "Regions";

worldRoot.add(
  regionRoot
);


const cityRoot =
  new THREE.Group();

cityRoot.name =
  "Cities";

regionRoot.add(
  cityRoot
);


const areaRoot =
  new THREE.Group();

areaRoot.name =
  "Areas";

cityRoot.add(
  areaRoot
);


const buildingRoot =
  new THREE.Group();

buildingRoot.name =
  "Buildings";

areaRoot.add(
  buildingRoot
);


const roomRoot =
  new THREE.Group();

roomRoot.name =
  "RoomsAndSpaces";

buildingRoot.add(
  roomRoot
);


/* ======================================================
   ENVIRONMENT ROOT
====================================================== */

const environmentRoot =
  new THREE.Group();

environmentRoot.name =
  "Environment";

worldRoot.add(
  environmentRoot
);


/* ======================================================
   CONTENT ROOT
====================================================== */

const contentRoot =
  new THREE.Group();

contentRoot.name =
  "ContentWorld";

worldRoot.add(
  contentRoot
);


/* ======================================================
   AVATAR ROOT
====================================================== */

const avatarRoot =
  new THREE.Group();

avatarRoot.name =
  "AvatarWorld";

worldRoot.add(
  avatarRoot
);


/* ======================================================
   AI ROOT
====================================================== */

const aiRoot =
  new THREE.Group();

aiRoot.name =
  "AIWorld";

worldRoot.add(
  aiRoot
);


/* ======================================================
   COMMERCE ROOT
====================================================== */

const commerceRoot =
  new THREE.Group();

commerceRoot.name =
  "CommerceWorld";

worldRoot.add(
  commerceRoot
);


/* ======================================================
   GAMING ROOT
====================================================== */

const gamingRoot =
  new THREE.Group();

gamingRoot.name =
  "GamingWorld";

worldRoot.add(
  gamingRoot
);


/* ======================================================
   FUTURE WORLD DATA MODEL
====================================================== */

const WorldStructure =
  Object.freeze({

    world: {
      id:
        "zemivo-global-world",

      name:
        "Zemivo World",

      type:
        "world"
    },

    regions: [],

    cities: [],

    areas: [],

    buildings: [],

    rooms: []

  });


/* ======================================================
   WORLD NODE CREATOR
====================================================== */

function createWorldLevel(
  parent,
  id,
  name,
  type
){

  const group =
    new THREE.Group();

  group.name =
    name;

  group.userData = {

    id,

    name,

    type,

    parentId:
      parent?.userData?.id ||
      "zemivo-global-world"

  };

  parent.add(
    group
  );

  return group;

}


/* ======================================================
   INITIAL GLOBAL REGION
====================================================== */

const globalRegion =
  createWorldLevel(
    regionRoot,
    "global-region",
    "Global",
    "region"
  );


/* ======================================================
   INITIAL WORLD CITY
====================================================== */

const globalCity =
  createWorldLevel(
    cityRoot,
    "global-city",
    "Global City",
    "city"
  );


/* ======================================================
   INITIAL WORLD AREA
====================================================== */

const centralArea =
  createWorldLevel(
    areaRoot,
    "central-area",
    "Central Area",
    "area"
  );


/* ======================================================
   INITIAL WORLD BUILDING
====================================================== */

const centralBuilding =
  createWorldLevel(
    buildingRoot,
    "central-building",
    "Zemivo Central Building",
    "building"
  );


/* ======================================================
   INITIAL WORLD SPACE
====================================================== */

const centralSpace =
  createWorldLevel(
    roomRoot,
    "central-space",
    "Zemivo Central Space",
    "room"
  );


/* ======================================================
   WORLD STRUCTURE API
====================================================== */

const WorldSystem = {

  version:
    "3.0.0",

  structure:
    WorldStructure,

  roots: {

    world:
      worldRoot,

    regions:
      regionRoot,

    cities:
      cityRoot,

    areas:
      areaRoot,

    buildings:
      buildingRoot,

    rooms:
      roomRoot

  },

  createRegion(
    id,
    name
  ){

    return createWorldLevel(
      regionRoot,
      id,
      name,
      "region"
    );

  },

  createCity(
    id,
    name
  ){

    return createWorldLevel(
      cityRoot,
      id,
      name,
      "city"
    );

  },

  createArea(
    id,
    name
  ){

    return createWorldLevel(
      areaRoot,
      id,
      name,
      "area"
    );

  },

  createBuilding(
    id,
    name
  ){

    return createWorldLevel(
      buildingRoot,
      id,
      name,
      "building"
    );

  },

  createRoom(
    id,
    name
  ){

    return createWorldLevel(
      roomRoot,
      id,
      name,
      "room"
    );

  }

};


/* ======================================================
   LIGHTING
====================================================== */

const ambientLight =
  new THREE.HemisphereLight(

    0x9cc7ff,

    0x020617,

    1.25

  );

scene.add(
  ambientLight
);


const sunLight =
  new THREE.DirectionalLight(

    0xffffff,

    2.4

  );

sunLight.position.set(
  12,
  25,
  12
);

sunLight.castShadow =
  true;

sunLight.shadow.mapSize.set(
  2048,
  2048
);

sunLight.shadow.camera.left =
  -35;

sunLight.shadow.camera.right =
  35;

sunLight.shadow.camera.top =
  35;

sunLight.shadow.camera.bottom =
  -35;

scene.add(
  sunLight
);


const rimLight =
  new THREE.PointLight(

    0x3b82f6,

    25,

    55

  );

rimLight.position.set(
  -15,
  8,
  -10
);

scene.add(
  rimLight
);


/* ======================================================
   GROUND
====================================================== */

const groundGeometry =
  new THREE.PlaneGeometry(
    180,
    180,
    1,
    1
  );

const groundMaterial =
  new THREE.MeshStandardMaterial({

    color:
      0x07111f,

    roughness:
      0.86,

    metalness:
      0.12

  });

const ground =
  new THREE.Mesh(
    groundGeometry,
    groundMaterial
  );

ground.rotation.x =
  -Math.PI / 2;

ground.receiveShadow =
  true;

ground.name =
  "WorldGround";

environmentRoot.add(
  ground
);


/* ======================================================
   GRID
====================================================== */

const grid =
  new THREE.GridHelper(
    120,
    60,
    0x1d4ed8,
    0x172554
  );

grid.position.y =
  0.02;

grid.material.transparent =
  true;

grid.material.opacity =
  0.18;

environmentRoot.add(
  grid
);


/* ======================================================
   WORLD CORE
====================================================== */

const coreGroup =
  new THREE.Group();

coreGroup.name =
  "ZemivoCore";

contentRoot.add(
  coreGroup
);


const coreGeometry =
  new THREE.IcosahedronGeometry(
    2.6,
    4
  );

const coreMaterial =
  new THREE.MeshPhysicalMaterial({

    color:
      0x2563eb,

    emissive:
      0x0b2a78,

    emissiveIntensity:
      1.5,

    roughness:
      0.18,

    metalness:
      0.65,

    transparent:
      true,

    opacity:
      0.94

  });

const core =
  new THREE.Mesh(
    coreGeometry,
    coreMaterial
  );

core.position.y =
  4;

core.castShadow =
  true;

core.receiveShadow =
  true;

coreGroup.add(
  core
);


/* ======================================================
   CORE GLOW
====================================================== */

const glowGeometry =
  new THREE.SphereGeometry(
    3.6,
    32,
    32
  );

const glowMaterial =
  new THREE.MeshBasicMaterial({

    color:
      0x2563eb,

    transparent:
      true,

    opacity:
      0.09,

    depthWrite:
      false

  });

const glow =
  new THREE.Mesh(
    glowGeometry,
    glowMaterial
  );

glow.position.copy(
  core.position
);

coreGroup.add(
  glow
);


/* ======================================================
   WORLD NODES
====================================================== */

const nodes = [];


function createWorldNode(
  name,
  position,
  color,
  label
){

  const group =
    new THREE.Group();

  group.name =
    name;

  group.position.set(
    position.x,
    position.y,
    position.z
  );


  const geometry =
    new THREE.CylinderGeometry(
      1.25,
      1.25,
      3.5,
      32
    );


  const material =
    new THREE.MeshStandardMaterial({

      color,

      emissive:
        color,

      emissiveIntensity:
        0.35,

      roughness:
        0.38,

      metalness:
        0.5

    });


  const mesh =
    new THREE.Mesh(
      geometry,
      material
    );

  mesh.castShadow =
    true;

  mesh.receiveShadow =
    true;

  group.add(
    mesh
  );


  const ringGeometry =
    new THREE.TorusGeometry(
      2,
      0.045,
      12,
      64
    );

  const ringMaterial =
    new THREE.MeshBasicMaterial({

      color,

      transparent:
        true,

      opacity:
        0.55

    });


  const ring =
    new THREE.Mesh(
      ringGeometry,
      ringMaterial
    );

  ring.rotation.x =
    Math.PI / 2;

  ring.position.y =
    -1.6;

  group.add(
    ring
  );


  group.userData = {

    type:
      "world-node",

    name,

    label,

    interactive:
      true

  };


  contentRoot.add(
    group
  );

  nodes.push(
    group
  );

  return group;

}


createWorldNode(
  "SocialWorld",
  {
    x:-9,
    y:2,
    z:-4
  },
  0x3b82f6,
  "Social"
);


createWorldNode(
  "CreatorWorld",
  {
    x:9,
    y:2,
    z:-4
  },
  0xa855f7,
  "Creator"
);


createWorldNode(
  "CommerceWorld",
  {
    x:-8,
    y:2,
    z:7
  },
  0x22c55e,
  "Commerce"
);


createWorldNode(
  "AIWorld",
  {
    x:8,
    y:2,
    z:7
  },
  0x06b6d4,
  "AI"
);


createWorldNode(
  "GamingWorld",
  {
    x:0,
    y:2,
    z:12
  },
  0xf59e0b,
  "Gaming"
);


/* ======================================================
   CONNECTING ORBITS
====================================================== */

const orbitMaterial =
  new THREE.MeshBasicMaterial({

    color:
      0x60a5fa,

    transparent:
      true,

    opacity:
      0.28

  });


const orbit1 =
  new THREE.Mesh(

    new THREE.TorusGeometry(
      10,
      0.035,
      10,
      128
    ),

    orbitMaterial

  );

orbit1.rotation.x =
  Math.PI / 2;

orbit1.position.y =
  4;

contentRoot.add(
  orbit1
);


const orbit2 =
  new THREE.Mesh(

    new THREE.TorusGeometry(
      15,
      0.025,
      10,
      128
    ),

    new THREE.MeshBasicMaterial({

      color:
        0x818cf8,

      transparent:
        true,

      opacity:
        0.18

    })

  );

orbit2.rotation.x =
  Math.PI / 2;

orbit2.rotation.z =
  0.25;

orbit2.position.y =
  4;

contentRoot.add(
  orbit2
);


/* ======================================================
   STARS
====================================================== */

const starCount =
  1300;

const starPositions =
  new Float32Array(
    starCount * 3
  );


for(
  let i = 0;
  i < starCount;
  i++
){

  const radius =
    35 +
    Math.random() * 80;

  const theta =
    Math.random() *
    Math.PI *
    2;

  const phi =
    Math.acos(
      2 * Math.random() - 1
    );

  starPositions[
    i * 3
  ] =
    radius *
    Math.sin(phi) *
    Math.cos(theta);

  starPositions[
    i * 3 + 1
  ] =
    radius *
    Math.cos(phi);

  starPositions[
    i * 3 + 2
  ] =
    radius *
    Math.sin(phi) *
    Math.sin(theta);

}


const starGeometry =
  new THREE.BufferGeometry();

starGeometry.setAttribute(

  "position",

  new THREE.BufferAttribute(
    starPositions,
    3
  )

);


const starMaterial =
  new THREE.PointsMaterial({

    color:
      0xffffff,

    size:
      0.09,

    transparent:
      true,

    opacity:
      0.8,

    sizeAttenuation:
      true

  });


const stars =
  new THREE.Points(
    starGeometry,
    starMaterial
  );

scene.add(
  stars
);


/* ======================================================
   FUTURE CONTENT SYSTEM
====================================================== */

const ContentSystem = {

  supportedTypes: [

    "text",
    "image",
    "video",
    "audio",
    "document",
    "live",
    "avatar",
    "3d-model",
    "interactive",
    "ai-content"

  ],

  languages:
    "global",

  translationReady:
    true,

  addContent(data){

    if(!data){
      return false;
    }

    /*
      Future connection point:

      Text
      Image
      Video
      Audio
      Document
      Translation
      AI
      Social
      3D

      will connect here.
    */

    return true;

  }

};


/* ======================================================
   FUTURE AVATAR SYSTEM
====================================================== */

const AvatarSystem = {

  ready:
    true,

  models:
    [],

  addAvatar(avatar){

    if(!avatar){
      return false;
    }

    avatarRoot.add(
      avatar
    );

    return true;

  }

};


/* ======================================================
   FUTURE AI SYSTEM
====================================================== */

const AIWorldSystem = {

  ready:
    true,

  agents:
    [],

  register(agent){

    if(!agent){
      return false;
    }

    aiRoot.add(
      agent
    );

    this.agents.push(
      agent
    );

    return true;

  }

};


/* ======================================================
   FUTURE ASSET SYSTEM
====================================================== */

const AssetSystem = {

  supported:

    [
      "glb",
      "gltf",
      "texture",
      "audio",
      "video"
    ],

  loaded:
    new Map(),

  register(
    id,
    asset
  ){

    if(
      !id ||
      !asset
    ){

      return false;

    }

    this.loaded.set(
      id,
      asset
    );

    return true;

  }

};


/* ======================================================
   INTERACTION
====================================================== */

const raycaster =
  new THREE.Raycaster();

const pointer =
  new THREE.Vector2();

let hoveredNode =
  null;


function updatePointer(
  clientX,
  clientY
){

  pointer.x =
    (
      clientX /
      window.innerWidth
    ) *
    2 -
    1;

  pointer.y =
    -(
      clientY /
      window.innerHeight
    ) *
    2 +
    1;

}


function checkInteraction(){

  raycaster.setFromCamera(
    pointer,
    camera
  );

  const objects =
    nodes.flatMap(
      node =>
        node.children.filter(
          child =>
            child.isMesh
        )
    );

  const hits =
    raycaster.intersectObjects(
      objects,
      false
    );

  if(hits.length){

    const object =
      hits[0].object;

    const parent =
      object.parent;

    if(
      parent &&
      parent.userData
    ){

      hoveredNode =
        parent;

      worldTitle.textContent =
        parent.userData.label;

      worldSubtitle.textContent =
        "Zemivo Living World • Interactive";

      return;

    }

  }

  hoveredNode =
    null;

  worldTitle.textContent =
    "Zemivo Living World";

  worldSubtitle.textContent =
    "3D foundation • Future-ready";

}


/* ======================================================
   POINTER EVENTS
====================================================== */

window.addEventListener(
  "pointermove",
  function(event){

    updatePointer(
      event.clientX,
      event.clientY
    );

    checkInteraction();

  },
  {
    passive:true
  }
);


window.addEventListener(
  "pointerdown",
  function(){

    if(
      hoveredNode
    ){

      const label =
        hoveredNode.userData.label;

      worldSubtitle.textContent =
        label +
        " world selected";

    }

  },
  {
    passive:true
  }
);


/* ======================================================
   RESIZE
====================================================== */

window.addEventListener(
  "resize",
  function(){

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio || 1,
        1.75
      )
    );

  },
  {
    passive:true
  }
);


/* ======================================================
   PAUSE
====================================================== */

let paused =
  reducedMotion;

pauseButton.addEventListener(
  "click",
  function(){

    paused =
      !paused;

    pauseButton.textContent =
      paused
      ?
      "▶"
      :
      "⏸";

  }
);


/* ======================================================
   RESET CAMERA
====================================================== */

resetButton.addEventListener(
  "click",
  function(){

    camera.position.set(
      18,
      13,
      22
    );

    controls.target.set(
      0,
      2,
      0
    );

    controls.update();

  }
);


/* ======================================================
   ANIMATION
====================================================== */

const clock =
  new THREE.Clock();


function animate(){

  requestAnimationFrame(
    animate
  );

  const elapsed =
    clock.getElapsedTime();


  if(!paused){

    controls.update();


    /*
      Core animation
    */

    core.rotation.y =
      elapsed *
      0.22;

    core.rotation.x =
      Math.sin(
        elapsed * 0.35
      ) *
      0.12;


    glow.scale.setScalar(

      1 +

      Math.sin(
        elapsed * 1.2
      ) *
      0.035

    );


    /*
      World node animation
    */

    nodes.forEach(
      function(node,index){

        const baseY =
          2;

        node.position.y =
          baseY +

          Math.sin(
            elapsed *
            0.7 +

            index
          ) *
          0.12;

        node.rotation.y =
          elapsed *
          (
            0.12 +
            index *
            0.015
          );

      }
    );


    /*
      Orbit animation
    */

    orbit1.rotation.z =
      elapsed *
      0.08;

    orbit2.rotation.z =
      -elapsed *
      0.045;


    /*
      Stars

    */

    stars.rotation.y =
      elapsed *
      0.003;

  }


  renderer.render(
    scene,
    camera
  );

}


/* ======================================================
   START
====================================================== */

function startWorld(){

  animate();

  setTimeout(
    function(){

      loading.classList.add(
        "hide"
      );

    },
    700
  );

}


/* ======================================================
   ERROR
====================================================== */

function showError(
  message
){

  errorText.textContent =
    message;

  errorBox.classList.add(
    "show"
  );

  loading.classList.add(
    "hide"
  );

}


/* ======================================================
   GLOBAL FUTURE API
====================================================== */

Object.defineProperty(
  window,
  "ZemivoLivingWorld3",
  {

    value:
      Object.freeze({

        ...ZemivoLivingWorld3,

        ContentSystem,

        AvatarSystem,

        AIWorldSystem,

        AssetSystem,

        scene,

        camera,

        renderer,

        worldRoot

      }),

    writable:
      false,

    configurable:
      false,

    enumerable:
      false

  }
);


/* ======================================================
   START ENGINE
====================================================== */

startWorld();

</script>
