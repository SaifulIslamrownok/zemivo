<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Zemivo - Contacts</title>

<style>

/* =========================
   ZEMIVO CONTACTS
   Security + Isolation + Living World
   ========================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6f8;
  color:#17202a;
  overflow-x:hidden;
}

button{
  font-family:inherit;
  cursor:pointer;
}


/* =========================
   LIVING 3D WORLD FOUNDATION
   ========================= */

.zemivo-world{
  min-height:100vh;
  position:relative;
  isolation:isolate;
  overflow:hidden;
}

.zemivo-world::before{
  content:"";
  position:fixed;
  width:420px;
  height:420px;
  border-radius:50%;
  background:radial-gradient(
    circle,
    rgba(37,99,235,.12),
    transparent 70%
  );
  top:-180px;
  right:-120px;
  transform:translateZ(0);
  pointer-events:none;
  z-index:-1;
}

.zemivo-world::after{
  content:"";
  position:fixed;
  width:360px;
  height:360px;
  border-radius:50%;
  background:radial-gradient(
    circle,
    rgba(14,165,233,.08),
    transparent 70%
  );
  bottom:-170px;
  left:-120px;
  pointer-events:none;
  z-index:-1;
}

.living-depth{
  perspective:1000px;
}

.living-card{
  transform:translateZ(0);
  transition:
    transform .25s ease,
    box-shadow .25s ease;
}

.living-card:hover{
  transform:
    translateY(-2px)
    rotateX(.4deg);
}


/* =========================
   HEADER
   ========================= */

.topbar{
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #e5e7eb;
  box-shadow:0 2px 12px rgba(0,0,0,.06);
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:28px;
  font-weight:800;
  color:#2563eb;
  letter-spacing:-.5px;
}

.security-indicator{
  font-size:12px;
  color:#16a34a;
  font-weight:bold;
}


/* =========================
   MAIN
   ========================= */

.container{
  width:100%;
  max-width:700px;
  margin:30px auto;
  padding:0 15px;
}

.card{
  background:rgba(255,255,255,.96);
  padding:25px;
  border-radius:18px;
  margin-bottom:18px;
  border:1px solid rgba(229,231,235,.9);
  box-shadow:
    0 8px 25px rgba(15,23,42,.08);
}

.card h1{
  margin-top:0;
  color:#2563eb;
}

.card p{
  color:#667085;
  line-height:1.5;
}


/* =========================
   CONTACTS
   ========================= */

.contact{
  padding:15px 0;
  border-bottom:1px solid #eee;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.contact:last-child{
  border-bottom:0;
}

.contact-info{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.contact-avatar{
  width:44px;
  height:44px;
  flex-shrink:0;
  border-radius:50%;
  background:#2563eb;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:16px;
}

.contact-name{
  font-weight:bold;
  color:#17202a;
}

.contact-status{
  font-size:12px;
  color:#777;
  margin-top:3px;
}


/* =========================
   BUTTON
   ========================= */

.view-button{
  background:#2563eb;
  color:white;
  border:0;
  padding:9px 15px;
  border-radius:20px;
  font-weight:bold;
  flex-shrink:0;
}

.view-button:hover{
  background:#1d4ed8;
}

.view-button:active{
  transform:scale(.97);
}


/* =========================
   SECURITY STATUS
   ========================= */

.security-card{
  background:#f8fafc;
  border:1px solid #e2e8f0;
  padding:14px;
  border-radius:12px;
  margin-bottom:18px;
}

.security-title{
  font-weight:bold;
  color:#17202a;
}

.security-text{
  font-size:12px;
  color:#64748b;
  margin-top:4px;
}


/* =========================
   TOAST
   ========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  background:#111827;
  color:#fff;
  padding:12px 18px;
  border-radius:10px;
  display:none;
  z-index:500;
  max-width:90%;
  text-align:center;
}

.toast.show{
  display:block;
}


/* =========================
   MOBILE
   ========================= */

@media(max-width:600px){

  .topbar{
    padding:14px 15px;
  }

  .logo{
    font-size:24px;
  }

  .container{
    margin:20px auto;
    padding:0 12px;
  }

  .card{
    padding:20px;
    border-radius:16px;
  }

  .contact{
    align-items:center;
  }

  .contact-avatar{
    width:42px;
    height:42px;
  }

  .view-button{
    padding:8px 13px;
  }

}

</style>

</head>


<body>

<div
  id="zemivoWorld"
  class="zemivo-world living-depth"
>


  <!-- HEADER -->

  <header class="topbar">

    <div class="logo">
      Zemivo
    </div>

    <div
      id="securityIndicator"
      class="security-indicator"
    >
      ● Secure
    </div>

  </header>


  <!-- MAIN -->

  <main class="container">


    <!-- SECURITY FOUNDATION -->

    <section class="security-card living-card">

      <div class="security-title">
        🔒 Zemivo Security Foundation
      </div>

      <div
        id="securityText"
        class="security-text"
      >
        Initializing secure connection...
      </div>

    </section>


    <!-- CONTACTS -->

    <section class="card living-card">

      <h1>
        📇 Contacts
      </h1>

      <p>
        Manage people connected to your Zemivo account.
      </p>


      <div class="contact">

        <div class="contact-info">

          <div class="contact-avatar">
            Z
          </div>

          <div>

            <div class="contact-name">
              Zemivo User 1
            </div>

            <div class="contact-status">
              Zemivo connection
            </div>

          </div>

        </div>

        <button
          class="view-button"
          type="button"
          data-user="Zemivo User 1"
        >
          View
        </button>

      </div>


      <div class="contact">

        <div class="contact-info">

          <div class="contact-avatar">
            Z
          </div>

          <div>

            <div class="contact-name">
              Zemivo User 2
            </div>

            <div class="contact-status">
              Zemivo connection
            </div>

          </div>

        </div>

        <button
          class="view-button"
          type="button"
          data-user="Zemivo User 2"
        >
          View
        </button>

      </div>


      <div class="contact">

        <div class="contact-info">

          <div class="contact-avatar">
            Z
          </div>

          <div>

            <div class="contact-name">
              Zemivo User 3
            </div>

            <div class="contact-status">
              Zemivo connection
            </div>

          </div>

        </div>

        <button
          class="view-button"
          type="button"
          data-user="Zemivo User 3"
        >
          View
        </button>

      </div>

    </section>


  </main>


  <div
    id="toast"
    class="toast"
  ></div>


</div>


<!-- =========================
     ZEMIVO PAGE FOUNDATION
     ========================= -->

<script type="module">

import {
  auth
} from "./zemivo-security.js";


/* =========================
   PAGE ISOLATION
   ========================= */

const ZemivoContactsPage = {

  version: "1.0.0",

  init(){

    this.setupSecurity();

    this.setupContacts();

    this.setupLivingWorld();

  },


  /* =========================
     SECURITY
     ========================= */

  setupSecurity(){

    const securityText =
      document.getElementById(
        "securityText"
      );

    const indicator =
      document.getElementById(
        "securityIndicator"
      );


    if(
      auth &&
      auth.app
    ){

      securityText.textContent =
        "Zemivo Security Foundation is active.";

      indicator.textContent =
        "● Secure";

    }
    else{

      securityText.textContent =
        "Security foundation could not be initialized.";

      indicator.textContent =
        "● Check";

    }

  },


  /* =========================
     CONTACT ACTIONS
     ========================= */

  setupContacts(){

    const buttons =
      document.querySelectorAll(
        ".view-button"
      );


    buttons.forEach(
      function(button){

        button.addEventListener(
          "click",
          function(){

            const user =
              button.dataset.user ||
              "Zemivo User";

            ZemivoContactsPage.showToast(
              "Profile opened: " + user
            );

          }
        );

      }
    );

  },


  /* =========================
     LIVING 3D FOUNDATION
     ========================= */

  setupLivingWorld(){

    const world =
      document.getElementById(
        "zemivoWorld"
      );


    if(!world){
      return;
    }


    /*
      Lightweight 3D foundation.

      The page uses an isolated world container
      so future Zemivo Living World engine
      can be connected here without rewriting
      the Contacts page.
    */

    world.dataset.livingWorld =
      "ready";

    world.dataset.worldVersion =
      "1.0.0";

  },


  /* =========================
     TOAST
     ========================= */

  showToast(message){

    const toast =
      document.getElementById(
        "toast"
      );

    if(!toast){
      return;
    }

    toast.textContent =
      message;

    toast.classList.add(
      "show"
    );


    setTimeout(
      function(){

        toast.classList.remove(
          "show"
        );

      },
      2200
    );

  }

};


/* =========================
   START PAGE
   ========================= */

ZemivoContactsPage.init();


</script>

</body>

</html>
