<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Zemivo Living 3D — Content Connected</title>

<style>

*{
  box-sizing:border-box;
}

body{

  margin:0;

  min-height:100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:#020617;

  color:#fff;

}

.page{

  min-height:100vh;

  display:flex;

  flex-direction:column;

}

.top{

  padding:16px;

  background:
    rgba(2,6,23,.96);

  border-bottom:
    1px solid
    rgba(255,255,255,.12);

  position:relative;

  z-index:10;

}

.title{

  font-size:22px;

  font-weight:800;

}

.subtitle{

  margin-top:4px;

  color:#94a3b8;

  font-size:13px;

}

.world{

  flex:1;

  min-height:420px;

  position:relative;

  overflow:hidden;

}

#worldFrame{

  width:100%;

  height:100%;

  min-height:520px;

  border:0;

  display:block;

}

.control{

  position:relative;

  z-index:20;

  padding:16px;

  background:
    rgba(2,6,23,.96);

  border-top:
    1px solid
    rgba(255,255,255,.12);

}

textarea{

  width:100%;

  min-height:100px;

  padding:14px;

  border-radius:14px;

  border:1px solid
    rgba(255,255,255,.15);

  background:#0f172a;

  color:#fff;

  outline:none;

  resize:vertical;

  font-size:16px;

}

textarea::placeholder{

  color:#64748b;

}

.analyze{

  width:100%;

  margin-top:10px;

  padding:13px;

  border:0;

  border-radius:13px;

  background:#2563eb;

  color:#fff;

  font-weight:bold;

  font-size:16px;

  cursor:pointer;

}

.analyze:hover{

  background:#1d4ed8;

}

.result{

  margin-top:12px;

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:8px;

}

.card{

  padding:10px;

  border-radius:10px;

  background:
    rgba(255,255,255,.06);

  border:
    1px solid
    rgba(255,255,255,.08);

  text-align:center;

}

.label{

  display:block;

  color:#94a3b8;

  font-size:11px;

  margin-bottom:4px;

}

.value{

  font-weight:bold;

  text-transform:capitalize;

}

.status{

  margin-top:10px;

  text-align:center;

  color:#94a3b8;

  font-size:12px;

}

@media(max-width:600px){

  .result{

    grid-template-columns:
      1fr 1fr 1fr;

  }

}

</style>

</head>


<body>


<div class="page">


  <div class="top">

    <div class="title">
      🌍 Zemivo Living 3D
    </div>

    <div class="subtitle">
      Content → Understanding → Living Environment
    </div>

  </div>


  <div class="world">

    <iframe
      id="worldFrame"
      src="zemivo-living-world.html"
      title="Zemivo Living 3D World"
    ></iframe>

  </div>


  <div class="control">

    <textarea
      id="contentInput"
      placeholder="Write something...

Example:
I am walking beside the beautiful ocean and watching the waves."
    ></textarea>


    <button
      id="analyzeButton"
      class="analyze"
      type="button"
    >
      ✨ Make Zemivo React
    </button>


    <div class="result">


      <div class="card">

        <span class="label">
          World
        </span>

        <span
          id="world"
          class="value"
        >
          —
        </span>

      </div>


      <div class="card">

        <span class="label">
          Mood
        </span>

        <span
          id="mood"
          class="value"
        >
          —
        </span>

      </div>


      <div class="card">

        <span class="label">
          Motion
        </span>

        <span
          id="motion"
          class="value"
        >
          —
        </span>

      </div>


    </div>


    <div
      id="status"
      class="status"
    >
      Write content and press the button.
    </div>

  </div>


</div>


<script>

const worldFrame =
  document.getElementById(
    "worldFrame"
  );

const contentInput =
  document.getElementById(
    "contentInput"
  );

const analyzeButton =
  document.getElementById(
    "analyzeButton"
  );

const world =
  document.getElementById(
    "world"
  );

const mood =
  document.getElementById(
    "mood"
  );

const motion =
  document.getElementById(
    "motion"
  );

const status =
  document.getElementById(
    "status"
  );


function getLivingWorld(){

  try{

    return worldFrame
      .contentWindow
      .ZemivoLivingWorld || null;

  }
  catch(error){

    return null;

  }

}


function analyzeContent(){

  const text =
    contentInput.value.trim();


  if(!text){

    status.textContent =
      "Please write some content first.";

    return;

  }


  const engine =
    getLivingWorld();


  if(!engine){

    status.textContent =
      "3D World is still loading. Please try again.";

    return;

  }


  try{

    const result =
      engine.applyContentVisualProfile({

        text:
          text,

        contentType:
          "text"

      });


    const profile =
      result.profile;


    world.textContent =
      profile.mode;

    mood.textContent =
      profile.mood;

    motion.textContent =
      profile.motion;


    status.textContent =
      "✓ Zemivo World reacted to your content.";

  }
  catch(error){

    console.error(error);

    status.textContent =
      "Could not analyze this content.";

  }

}


analyzeButton.addEventListener(
  "click",
  analyzeContent
);


contentInput.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      event.ctrlKey
    ){

      analyzeContent();

    }

  }
);


worldFrame.addEventListener(
  "load",
  function(){

    status.textContent =
      "✓ Living 3D World connected.";

  }
);

</script>


</body>

</html>
