<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zemivo - Trash</title>
<style>
body{font-family:Arial;background:#f4f6f8}
.card{background:white;max-width:700px;margin:30px auto;padding:25px;border-radius:15px}
.item{padding:18px;border-bottom:1px solid #eee}
button{background:#2563eb;color:white;border:0;padding:9px 15px;border-radius:20px}
</style>
</head>
<body>
<div class="card">
<h1>🗑️ Trash</h1>
<p>Deleted content stays here temporarily.</p>
<div class="item">📝 Deleted Post <button onclick="alert('Post restored')">Restore</button></div>
<div class="item">📷 Deleted Photo <button onclick="alert('Photo restored')">Restore</button></div>
</div>
</body>
</html>
