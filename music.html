<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07152f">
<title>Zemivo Living — 3D World</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,"Segoe UI",sans-serif}
body{overflow:hidden;background:#07152f;color:#fff}
.world{height:100svh;min-height:520px;position:relative;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 13%,#f4dfbd 0,#aab9b2 13%,transparent 39%),linear-gradient(#718d99 0%,#345966 48%,#173c3d 75%,#081e29)}
.glow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 15%,#fff3d477,transparent 42%);animation:glow 10s ease-in-out infinite alternate;z-index:-4}
.sun{position:absolute;top:12%;left:50%;width:145px;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,#fffbe5 0 20%,#ffe8b5 43%,#ffe4b333 70%,transparent 72%);z-index:-3}
.mountains{position:absolute;inset:0;z-index:-2}
.m{position:absolute;bottom:27%;width:0;height:0;border-left:16vw solid transparent;border-right:16vw solid transparent;border-bottom:var(--h) solid var(--c);filter:drop-shadow(0 16px 16px #102b3344)}
.m:after{content:"";position:absolute;left:-5vw;top:0;border-left:5vw solid transparent;border-right:5vw solid transparent;border-bottom:var(--snow) solid #edf1e9}
.m1{left:-8%;--h:42vh;--c:#536e76;--snow:95px}.m2{left:17%;--h:57vh;--c:#405e69;--snow:135px;bottom:29%}.m3{left:43%;--h:66vh;--c:#344f5d;--snow:155px;bottom:29%}.m4{left:70%;--h:52vh;--c:#49666d;--snow:125px}.m5{left:88%;--h:40vh;--c:#536e70;--snow:90px}
.ridge{position:absolute;left:-10%;right:-10%;bottom:12%;height:38%;border-radius:50% 50% 0 0;background:linear-gradient(#456d59,#1b493e 55%,#102e30);transform:rotate(-3deg);z-index:-1}
.ridge.back{bottom:20%;height:25%;background:linear-gradient(#718b76,#315b4d);transform:rotate(4deg);opacity:.8}
.water{position:absolute;left:27%;bottom:-15%;width:48%;height:48%;border-radius:50%;background:radial-gradient(ellipse at 50% 0,#a0d9cb,#438e88 36%,#174d50 72%,#0b292f);transform:rotate(-8deg);box-shadow:0 0 65px #79d8cf44;animation:water 8s ease-in-out infinite alternate;z-index:0}
.shimmer{position:absolute;left:34%;bottom:10%;width:33%;height:9%;border-radius:50%;background:repeating-linear-gradient(175deg,transparent 0 9px,#d9fff044 10px 12px,transparent 13px 22px);filter:blur(2px);transform:rotate(-8deg);animation:shine 5s linear infinite;z-index:1}
.tree{position:absolute;bottom:var(--b);left:var(--l);width:var(--w);height:var(--h);transform-origin:50% 100%;animation:sway var(--s,5s) ease-in-out infinite alternate;filter:drop-shadow(8px 12px 8px #0007);z-index:2}
.tree:before{content:"";position:absolute;left:46%;bottom:0;width:9%;height:46%;background:linear-gradient(90deg,#35291f,#806047,#35291f);border-radius:8px}
.tree:after{content:"";position:absolute;inset:0 0 24%;background:linear-gradient(125deg,#12382e,#3c7b4c 50%,#102d29);clip-path:polygon(50% 0,66% 27%,61% 27%,82% 53%,70% 52%,100% 83%,59% 78%,50% 100%,39% 78%,0 83%,30% 52%,18% 53%,39% 27%,34% 27%)}
.t2:after,.t5:after{background:linear-gradient(125deg,#244b35,#659456 50%,#1b422f)}
.fog{position:absolute;left:-20%;width:140%;height:14%;border-radius:50%;background:#e4f0e533;filter:blur(28px);animation:fog 18s ease-in-out infinite alternate;z-index:3}.f1{top:38%}.f2{top:57%;animation-delay:-8s}
.foreground{position:absolute;z-index:4;left:-5%;right:-5%;bottom:-15%;height:36%;background:linear-gradient(#1b4435,#071c20);clip-path:polygon(0 26%,9% 13%,19% 34%,29% 8%,40% 30%,51% 4%,62% 25%,72% 10%,83% 32%,93% 8%,100% 24%,100% 100%,0 100%)}
.top{position:absolute;z-index:6;top:23px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;font-weight:850;letter-spacing:.28em;text-shadow:0 2px 12px #000}
.copy{position:absolute;z-index:7;left:50%;top:49%;transform:translate(-50%,-50%);width:min(760px,calc(100% - 32px));padding:clamp(26px,4vw,48px) 20px;text-align:center;border:1px solid #fff2c477;background:linear-gradient(135deg,#081426bb,#0c1d2d88);box-shadow:0 24px 80px #0007,inset 0 1px #ffffff22;backdrop-filter:blur(9px);border-radius:8px}
.kicker{font-size:clamp(10px,1.5vw,14px);font-weight:800;letter-spacing:.25em;color:#d8eae5}
h1{margin:14px 0 10px;font-size:clamp(34px,7vw,72px);line-height:1.05;letter-spacing:.08em;text-shadow:0 4px 24px #000b}
.sub{font-size:clamp(11px,1.7vw,16px);letter-spacing:.13em;color:#f4e7c9;font-weight:700}
p{margin:18px auto 0;max-width:560px;color:#e5eeea;font-size:clamp(13px,1.6vw,16px);line-height:1.8}
.bottom{position:absolute;z-index:6;bottom:19px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;letter-spacing:.2em;color:#ffffffcc}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
@keyframes water{from{transform:rotate(-8deg) scaleX(.96)}to{transform:rotate(-5deg) scaleX(1.04)}}
@keyframes shine{from{background-position:0 0}to{background-position:90px 0}}
@keyframes fog{from{transform:translateX(-8%)}to{transform:translateX(8%) translateY(12px)}}
@keyframes glow{from{opacity:.5}to{opacity:1}}
@media(max-width:600px){.m{bottom:31%}.ridge{bottom:17%;height:33%}.ridge.back{bottom:23%;height:22%}.copy{top:48%;padding:26px 15px}.top{top:18px;font-size:9px;letter-spacing:.17em}.bottom{font-size:8px;letter-spacing:.12em}.tree{transform:scale(.78);transform-origin:bottom center}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<main class="world" aria-label="Zemivo Living animated landscape">
<div class="glow"></div><div class="sun"></div>
<div class="mountains"><i class="m m1"></i><i class="m m2"></i><i class="m m3"></i><i class="m m4"></i><i class="m m5"></i></div>
<div class="ridge back"></div><div class="ridge"></div><div class="water"></div><div class="shimmer"></div>
<div class="tree" style="--l:2%;--b:7%;--w:150px;--h:290px;--s:5.4s"></div>
<div class="tree t2" style="--l:14%;--b:8%;--w:95px;--h:205px;--s:4.4s"></div>
<div class="tree" style="--l:25%;--b:6%;--w:65px;--h:145px;--s:5s"></div>
<div class="tree" style="--l:81%;--b:7%;--w:145px;--h:280px;--s:4.8s"></div>
<div class="tree t2" style="--l:71%;--b:7%;--w:85px;--h:185px;--s:5.2s"></div>
<div class="tree t2" style="--l:92%;--b:9%;--w:75px;--h:160px;--s:4.6s"></div>
<div class="fog f1"></div><div class="fog f2"></div><div class="foreground"></div>
<div class="top">ZEMIVO • A WORLD OF YOUR OWN</div>
<section class="copy">
<div class="kicker">WELCOME TO A LIVING WORLD</div>
<h1>ZEMIVO LIVING</h1>
<div class="sub">YOUR WORLD • YOUR MOMENTS • YOUR LIFE</div>
<p>একটি জীবন্ত পৃথিবী, যেখানে প্রতিটি দৃশ্যের নিজস্ব গল্প আছে।</p>
</section>
<div class="bottom">EXPLORE • IMAGINE • CONNECT</div>
</main>
</body>
</html>
