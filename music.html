<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07152e">
  <title>Zemivo | Music</title>

  <style>
    #zemivoMusic {
      --bg: #07152e;
      --panel: rgba(18, 38, 75, .72);
      --line: rgba(142, 208, 255, .2);
      --cyan: #63eaff;
      --purple: #a78bfa;
      --pink: #fb7bd5;
      --text: #eff8ff;
      --muted: #a9bdd7;
      min-height: 100vh;
      padding: 20px;
      color: var(--text);
      font-family: system-ui, Arial, sans-serif;
      background:
        radial-gradient(ellipse at 15% 10%, #164e8b 0, transparent 35%),
        radial-gradient(ellipse at 85% 20%, #542c91 0, transparent 34%),
        linear-gradient(145deg, #061329, #101d48 55%, #07152e);
      overflow: hidden;
      isolation: isolate;
    }

    #zemivoMusic * { box-sizing: border-box; }
    #zemivoMusic button,
    #zemivoMusic select,
    #zemivoMusic input { font: inherit; }

    #zemivoMusic .music-wrap {
      max-width: 1120px;
      margin: auto;
    }

    #zemivoMusic .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    #zemivoMusic .brand {
      font-size: 27px;
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(90deg, #fff, var(--cyan), var(--purple));
      color: transparent;
      background-clip: text;
    }

    #zemivoMusic .sub {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 1px;
    }

    #zemivoMusic .glass {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 15px 45px rgba(0,0,0,.25);
    }

    #zemivoMusic .language {
      color: var(--text);
      background: #142b51;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 13px;
      max-width: 100%;
    }

    #zemivoMusic .hero {
      text-align: center;
      padding: 12px 10px 22px;
    }

    #zemivoMusic h1 {
      margin: 0 0 8px;
      font-size: clamp(27px, 5vw, 43px);
      letter-spacing: 1px;
    }

    #zemivoMusic .hero p {
      color: var(--muted);
      margin: 0;
    }

    #zemivoMusic .scene {
      position: relative;
      height: 330px;
      margin: 8px auto 22px;
      max-width: 760px;
      overflow: hidden;
      perspective: 900px;
      border-radius: 25px;
      background:
        radial-gradient(ellipse at center, rgba(65, 163, 255, .2), transparent 55%),
        linear-gradient(145deg, rgba(9, 30, 66, .7), rgba(24, 17, 70, .65));
      border: 1px solid var(--line);
    }

    #zemivoMusic .orbit {
      position: absolute;
      left: 50%;
      top: 47%;
      width: 230px;
      height: 230px;
      border: 1px solid rgba(99,234,255,.5);
      border-radius: 50%;
      transform: translate(-50%, -50%) rotateX(68deg);
      box-shadow: 0 0 22px rgba(99,234,255,.2);
      animation: zmOrbit 12s linear infinite;
    }

    #zemivoMusic .orbit.two {
      width: 300px;
      height: 300px;
      border-color: rgba(167,139,250,.4);
      animation-duration: 18s;
      animation-direction: reverse;
    }

    #zemivoMusic .orbit.three {
      width: 370px;
      height: 370px;
      border-color: rgba(251,123,213,.22);
      animation-duration: 24s;
    }

    @keyframes zmOrbit {
      to { transform: translate(-50%, -50%) rotateX(68deg) rotateZ(360deg); }
    }

    #zemivoMusic .music-core {
      position: absolute;
      left: 50%;
      top: 44%;
      width: 112px;
      height: 112px;
      display: grid;
      place-items: center;
      transform: translate(-50%, -50%);
      border-radius: 35px;
      font-size: 48px;
      font-weight: 900;
      color: white;
      background: linear-gradient(145deg, #38bdf8, #6d5dfc 60%, #ec4899);
      box-shadow: 0 0 35px rgba(99,234,255,.45), inset 0 2px 15px #ffffff55;
      animation: zmFloat 3s ease-in-out infinite;
    }

    @keyframes zmFloat {
      50% { transform: translate(-50%, -57%) rotateY(12deg); }
    }

    #zemivoMusic .orb {
      position: absolute;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 20px var(--cyan);
      animation: zmFloat 3s ease-in-out infinite;
    }

    #zemivoMusic .orb.a { left: 18%; top: 25%; }
    #zemivoMusic .orb.b { right: 18%; top: 30%; background: var(--pink); }
    #zemivoMusic .orb.c { left: 25%; bottom: 20%; background: var(--purple); }

    #zemivoMusic .hud {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 12px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: #cceaff;
      font-size: 11px;
      flex-wrap: wrap;
    }

    #zemivoMusic .visualizer {
      height: 70px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      overflow: hidden;
      margin: 12px 0;
    }

    #zemivoMusic .bar {
      width: 5px;
      min-height: 5px;
      height: 8px;
      border-radius: 10px;
      background: linear-gradient(to top, #6385ff, #61eaff, #f58ae0);
      box-shadow: 0 0 10px #61eaff55;
      transition: height .09s linear;
    }

    #zemivoMusic .player {
      padding: 22px;
    }

    #zemivoMusic .track-info {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    #zemivoMusic .cover {
      width: 62px;
      height: 62px;
      flex: 0 0 62px;
      display: grid;
      place-items: center;
      border-radius: 17px;
      font-size: 27px;
      background: linear-gradient(135deg, #0ea5e9, #7c3aed, #ec4899);
    }

    #zemivoMusic .track-info h2 {
      margin: 0 0 5px;
      font-size: 17px;
      overflow-wrap: anywhere;
    }

    #zemivoMusic .track-info p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    #zemivoMusic .seek-area { margin: 22px 0 12px; }

    #zemivoMusic input[type="range"] {
      width: 100%;
      accent-color: var(--cyan);
      cursor: pointer;
    }

    #zemivoMusic .time {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
    }

    #zemivoMusic .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 13px;
      flex-wrap: wrap;
      margin: 18px 0;
    }

    #zemivoMusic .control {
      width: 43px;
      height: 43px;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: white;
      background: rgba(255,255,255,.07);
      cursor: pointer;
      transition: .2s;
    }

    #zemivoMusic .control:hover {
      transform: translateY(-3px);
      background: rgba(99,234,255,.18);
      box-shadow: 0 0 18px #63eaff55;
    }

    #zemivoMusic .control.main {
      width: 61px;
      height: 61px;
      font-size: 22px;
      border: 0;
      color: #07152e;
      background: linear-gradient(135deg, var(--cyan), #a78bfa);
    }

    #zemivoMusic .active { color: var(--cyan); }

    #zemivoMusic .tools {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    #zemivoMusic .action {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 14px;
      color: var(--text);
      background: rgba(255,255,255,.07);
      cursor: pointer;
    }

    #zemivoMusic .action.primary {
      background: linear-gradient(110deg, #087fbd, #6949cf);
      border: 0;
    }

    #zemivoMusic .library {
      margin-top: 20px;
      padding: 20px;
    }

    #zemivoMusic .library-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    #zemivoMusic .library h2 {
      margin: 0;
      font-size: 19px;
    }

    #zemivoMusic .song-list {
      display: grid;
      gap: 9px;
    }

    #zemivoMusic .song {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 12px;
      border: 1px solid transparent;
      border-radius: 14px;
      background: rgba(255,255,255,.045);
      min-width: 0;
    }

    #zemivoMusic .song.current {
      border-color: rgba(99,234,255,.5);
      background: rgba(99,234,255,.1);
    }

    #zemivoMusic .song-play {
      width: 35px;
      height: 35px;
      flex: 0 0 35px;
      border: 0;
      border-radius: 50%;
      color: white;
      background: #31517c;
      cursor: pointer;
    }

    #zemivoMusic .song-name {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 13px;
    }

    #zemivoMusic .song small {
      display: block;
      color: var(--muted);
      margin-top: 3px;
    }

    #zemivoMusic .remove {
      border: 0;
      color: #ff9aaa;
      background: transparent;
      cursor: pointer;
      padding: 8px;
    }

    #zemivoMusic .empty {
      text-align: center;
      color: var(--muted);
      padding: 25px 10px;
      font-size: 13px;
    }

    #zemivoMusic .status {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      margin-top: 13px;
    }

    #zemivoMusic button:focus-visible,
    #zemivoMusic select:focus-visible,
    #zemivoMusic input:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
    }

    @media (max-width: 600px) {
      #zemivoMusic { padding: 12px; }
      #zemivoMusic .scene { height: 275px; }
      #zemivoMusic .player,
      #zemivoMusic .library { padding: 15px; }
      #zemivoMusic .orbit.three { width: 310px; height: 310px; }
      #zemivoMusic .tools { justify-content: center; }
      #zemivoMusic .tools > * { flex: 1 1 auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      #zemivoMusic *,
      #zemivoMusic *::before,
      #zemivoMusic *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }

<body style="margin:0;background:#07152e">
<div id="zemivoMusic">
  <div class="music-wrap">

    <header class="topbar">
      <div>
        <div class="brand">ZEMIVO</div>
        <div class="sub">MUSIC • FEEL THE WORLD</div>
      </div>

      <select class="language" id="zmLanguage" aria-label="Select language">
        <option value="bn">বাংলা</option>
        <option value="en">English</option>
        <option value="hi">हिन्दी</option>
        <option value="ur">اردو</option>
        <option value="ar">العربية</option>
        <option value="zh">中文</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="es">Español</option>
        <option value="pt">Português</option>
        <option value="ru">Русский</option>
        <option value="tr">Türkçe</option>
        <option value="id">Bahasa Indonesia</option>
        <option value="ms">Bahasa Melayu</option>
      </select>
    </header>

    <section class="hero">
      <h1 data-i18n="title">তোমার সংগীতের পৃথিবী</h1>
      <p data-i18n="subtitle">শোনো, অনুভব করো, নিজের মতো করে উপভোগ করো।</p>
    </section>

    <section class="scene" aria-label="3D music visualizer">
      <div class="orbit"></div>
      <div class="orbit two"></div>
      <div class="orbit three"></div>
      <div class="orb a"></div>
      <div class="orb b"></div>
      <div class="orb c"></div>
      <div class="music-core">Z</div>
      <div class="hud">
        <span id="zmAudioState">● READY</span>
        <span id="zmSensorState">3D MUSIC SPACE</span>
        <span id="zmBeat">BPM --</span>
      </div>
    </section>

    <div class="visualizer" id="zmVisualizer" aria-hidden="true"></div>

    <main class="player glass">
      <div class="track-info">
        <div class="cover">♫</div>
        <div style="min-width:0">
          <h2 id="zmTrackTitle">কোনো গান নির্বাচন করা হয়নি</h2>
          <p id="zmTrackArtist">Zemivo Music Player</p>
        </div>
      </div>

      <div class="seek-area">
        <input id="zmSeek" type="range" min="0" max="1000" value="0"
               aria-label="Song progress">
        <div class="time">
          <span id="zmCurrentTime">0:00</span>
          <span id="zmDuration">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="control" id="zmShuffle" title="Shuffle">⤨</button>
        <button class="control" id="zmPrevious" title="Previous">|◀</button>
        <button class="control main" id="zmPlay" title="Play">▶</button>
        <button class="control" id="zmNext" title="Next">▶|</button>
        <button class="control" id="zmRepeat" title="Repeat">↻</button>
      </div>

      <div class="tools">
        <button class="action primary" id="zmUpload" data-i18n="addMusic">
          ＋ গান যোগ করো
        </button>
        <input id="zmFiles" type="file" accept="audio/*" multiple hidden>

        <button class="action" id="zmFavorite" data-i18n="favorite">
          ♡ পছন্দের গান
        </button>

        <label style="color:var(--muted);font-size:12px">
          🔊
          <input id="zmVolume" type="range" min="0" max="1"
                 step=".01" value=".8" style="width:90px">
        </label>

  let language = "bn";

  function t(key) {
    return (translations[language] || translations.bn)[key]
      || translations.bn[key] || key;
  }

  function setStatus(message) {
    $("zmStatus").textContent = message;
  }

  function formatTime(seconds) {
    if (!Number.isFinite(seconds)) return "0:00";
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return mins + ":" + String(secs).padStart(2, "0");
  }

  function renderLanguage() {
    const dict = translations[language] || translations.bn;

    root.querySelectorAll("[data-i18n]").forEach(element => {
      const key = element.dataset.i18n;
      if (dict[key]) element.textContent = dict[key];
    });

    root.dir = ["ar", "ur"].includes(language) ? "rtl" : "ltr";
    renderSongs();
  }

  $("zmLanguage").addEventListener("change", event => {
    language = event.target.value;
    renderLanguage();
  });

  function makeVisualizer() {
    const visualizer = $("zmVisualizer");
    for (let i = 0; i < 48; i++) {
      const bar = document.createElement("div");
      bar.className = "bar";
      visualizer.appendChild(bar);
    }
  }

  function loadSong(index, autoplay = true) {
    if (!songs.length || index < 0 || index >= songs.length) return;

    currentIndex = index;
    const song = songs[index];

    if (currentURL) URL.revokeObjectURL(currentURL);
    currentURL = URL.createObjectURL(song.file);
    audio.src = currentURL;

    $("zmTrackTitle").textContent = song.name;
    $("zmTrackArtist").textContent = "Zemivo Music • " + song.size;
    $("zmFavorite").textContent = favorites.has(song.id)
      ? "♥ পছন্দের গান" : "♡ পছন্দের গান";

    renderSongs();

    if (autoplay) {
      audio.play().then(() => {
        isPlaying = true;
        updatePlayButton();
        setStatus(t("playing") + ": " + song.name);
      }).catch(() => {
        isPlaying = false;
        updatePlayButton();
        setStatus("Play চাপ দিয়ে গান চালু করো।");
      });
    } else {
      isPlaying = false;
      updatePlayButton();
    }
  }

  function addFiles(files) {
    const audioFiles = Array.from(files).filter(file =>
      file.type.startsWith("audio/")
    );

    if (!audioFiles.length) {
      setStatus("সমর্থিত অডিও ফাইল নির্বাচন করো।");
      return;
    }

    audioFiles.forEach(file => {
      songs.push({
        id: Date.now() + Math.random(),
        name: file.name.replace(/\.[^/.]+$/, ""),
        file,
        size: (file.size / (1024 * 1024)).toFixed(1) + " MB"
      });
    });

    renderSongs();

    if (currentIndex === -1) loadSong(0, false);
    setStatus(audioFiles.length + "টি অডিও ফাইল যোগ হয়েছে।");
  }

  function renderSongs() {
    const visibleSongs = songs
      .map((song, index) => ({ song, index }))
      .filter(item => !showFavorites || favorites.has(item.song.id));

    $("zmSongCount").textContent = visibleSongs.length + " গান";
    songList.replaceChildren();

    if (!visibleSongs.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = showFavorites ? t("noFavorite") : t("empty");
      songList.appendChild(empty);
      return;
    }

    visibleSongs.forEach(({ song, index }) => {
      const row = document.createElement("div");
      row.className = "song" + (index === currentIndex ? " current" : "");

      const play = document.createElement("button");
      play.className = "song-play";
      play.textContent = index === currentIndex && isPlaying ? "Ⅱ" : "▶";
      play.setAttribute("aria-label", "Play " + song.name);
      play.addEventListener("click", () => loadSong(index, true));

      const name = document.createElement("div");
      name.className = "song-name";

      const title = document.createElement("strong");
      title.textContent = song.name;

      const detail = document.createElement("small");
      detail.textContent = song.size;

      name.append(title, detail);

      const remove = document.createElement("button");
      remove.className = "remove";
      remove.textContent = "✕";
      remove.title = "Remove song";
      remove.addEventListener("click", () => removeSong(index));

      row.append(play, name, remove);
      songList.appendChild(row);
    });
  }

  function removeSong(index) {
    const removed = songs[index];
    if (!removed) return;

    const wasCurrent = index === currentIndex;

    if (wasCurrent) {
      audio.pause();
      audio.removeAttribute("src");
      audio.load();
      if (currentURL) URL.revokeObjectURL(currentURL);
      currentURL = null;
      currentIndex = -1;
      isPlaying = false;
      updatePlayButton();
      $("zmTrackTitle").textContent = t("choose");
      $("zmTrackArtist").textContent = "Zemivo Music Player";
    }

    favorites.delete(removed.id);
    songs.splice(index, 1);

    if (index < currentIndex) currentIndex--;
    renderSongs();

    if (wasCurrent && songs.length) {
      loadSong(Math.min(index, songs.length - 1), false);
    }
  }

  function updatePlayButton() {
    playButton.textContent = isPlaying ? "Ⅱ" : "▶";
    $("zmAudioState").textContent = isPlaying ? "● PLAYING" : "● READY";
    renderSongs();
  }

  function togglePlay() {
    if (currentIndex === -1) {
      if (songs.length) loadSong(0, true);
      else setStatus(t("ready"));
      return;
    }

    if (audio.paused) {
      audio.play().then(() => {
        isPlaying = true;
        updatePlayButton();
        setStatus(t("playing"));
      }).catch(() => setStatus("এই অডিও ফাইলটি চালানো যাচ্ছে না।"));
    } else {
      audio.pause();
      isPlaying = false;
      updatePlayButton();
      setStatus(t("paused"));
    }
  }

  function nextSong() {
    if (!songs.length) return;

    let next = currentIndex + 1;

    if (shuffle && songs.length > 1) {
      do {
        next = Math.floor(Math.random() * songs.length);
      } while (next === currentIndex);
    } else if (next >= songs.length) {
      next = 0;
    }

    loadSong(next, true);
  }

  function previousSong() {
    if (!songs.length) return;

    if (audio.currentTime > 3) {
      audio.currentTime = 0;
      return;
    }

    loadSong((currentIndex - 1 + songs.length) % songs.length, true);
  }

  $("zmUpload").addEventListener("click", () => fileInput.click());

  fileInput.addEventListener("change", event => {
    addFiles(event.target.files);
    fileInput.value = "";
  });

  playButton.addEventListener("click", togglePlay);
  $("zmNext").addEventListener("click", nextSong);
  $("zmPrevious").addEventListener("click", previousSong);

  $("zmShuffle").addEventListener("click", () => {
    shuffle = !shuffle;
    $("zmShuffle").classList.toggle("active", shuffle);
  });

  $("zmRepeat").addEventListener("click", () => {
    repeat = !repeat;
    audio.loop = repeat;
    $("zmRepeat").classList.toggle("active", repeat);
  });

  $("zmFavorite").addEventListener("click", () => {
    if (currentIndex < 0) return;

    const id = songs[currentIndex].id;
    if (favorites.has(id)) favorites.delete(id);
    else favorites.add(id);

    $("zmFavorite").textContent = favorites.has(id)
      ? "♥ পছন্দের গান" : "♡ পছন্দের গান";

    renderSongs();
  });

  $("zmFavorite").addEventListener("contextmenu", event => {
    event.preventDefault();
    showFavorites = !showFavorites;
    renderSongs();
  });

  $("zmVolume").addEventListener("input", event => {
    audio.volume = Number(event.target.value);
  });

  seek.addEventListener("input", () => {
    if (Number.isFinite(audio.duration) && audio.duration > 0) {
      audio.currentTime = (Number(seek.value) / 1000) * audio.duration;
    }
  });

  audio.addEventListener("timeupdate", () => {
    if (!Number.isFinite(audio.duration) || audio.duration <= 0) return;

    seek.value = String((audio.currentTime / audio.duration) * 1000);
    $("zmCurrentTime").textContent = formatTime(audio.currentTime);
    $("zmDuration").textContent = formatTime(audio.duration);
  });

  audio.addEventListener("loadedmetadata", () => {
    $("zmDuration").textContent = formatTime(audio.duration);
  });

  audio.addEventListener("play", () => {
    isPlaying = true;
    updatePlayButton();
    startAudioAnalysis();
  });

  audio.addEventListener("pause", () => {
    isPlaying = false;
    updatePlayButton();
  });

  audio.addEventListener("ended", () => {
    if (!repeat) nextSong();
  });

  audio.addEventListener("error", () => {
    setStatus("অডিও ফাইলটি পড়তে সমস্যা হয়েছে। অন্য ফাইল চেষ্টা করো।");
  });

  function startAudioAnalysis() {
    if (!audioContext) {
      const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

      if (!AudioContextClass) {
        $("zmSensorState").textContent = "VISUAL MODE";
        return;
      }

      try {
        audioContext = new AudioContextClass();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 128;
        sourceNode = audioContext.createMediaElementSource(audio);
        sourceNode.connect(analyser);
        analyser.connect(audioContext.destination);
      } catch (error) {
        $("zmSensorState").textContent = "VISUAL MODE";
        return;
      }
    }

    if (audioContext.state === "suspended") {
      audioContext.resume().catch(() => {});
    }

    if (!animationFrame) animateVisualizer();
  }

  function animateVisualizer() {
    const bars = root.querySelectorAll(".bar");
    const data = new Uint8Array(analyser ? analyser.frequencyBinCount : 0);

    function frame() {
      animationFrame = requestAnimationFrame(frame);

      if (analyser && isPlaying) {
        analyser.getByteFrequencyData(data);

        bars.forEach((bar, index) => {
          const value = data[index % data.length] || 0;
          bar.style.height = Math.max(5, (value / 255) * 64) + "px";
        });

        const peak = data.reduce((a, b) => a + b, 0) / (data.length || 1);

        if (peak > 105 && lastPeak <= 105) {
          const now = performance.now();
          beatTimes.push(now);
          beatTimes = beatTimes.filter(time => now - time < 10000);

          if (beatTimes.length > 2) {
            const intervals = [];
            for (let i = 1; i < beatTimes.length; i++) {
              intervals.push(beatTimes[i] - beatTimes[i - 1]);
            }
            const average = intervals.reduce((a, b) => a + b, 0) /
              intervals.length;

            const bpm = Math.round(60000 / average);
            $("zmBeat").textContent =
              bpm >= 40 && bpm <= 220 ? "BPM ~" + bpm : "BPM --";
          }
        }

        lastPeak = peak;
      } else {
        bars.forEach((bar, index) => {
          bar.style.height = (6 + Math.abs(Math.sin(
            performance.now() / 900 + index * .35
          )) * 8) + "px";
        });
      }
    }

    frame();
  }

  function setupMotion() {
    if (!("DeviceOrientationEvent" in window)) {
      $("zmSensorState").textContent = "3D VISUAL MODE";
      return;
    }

    const permissionRequired =
      typeof DeviceOrientationEvent.requestPermission === "function";

    if (permissionRequired) {
      $("zmSensorState").textContent = "MOTION: TAP TO ENABLE";
      $("zmSensorState").style.cursor = "pointer";

      $("zmSensorState").addEventListener("click", async () => {
        try {
          const permission =
            await DeviceOrientationEvent.requestPermission();

          $("zmSensorState").textContent =
            permission === "granted" ? "MOTION ENABLED" : "MOTION OFF";

          if (permission === "granted") enableMotion();
        } catch {
          $("zmSensorState").textContent = "MOTION UNAVAILABLE";
        }
      }, { once: true });
    } else {
      enableMotion();
    }
  }

  function enableMotion() {
    window.addEventListener("deviceorientation", event => {
      if (event.gamma == null || event.beta == null) return;

      const x = Math.max(-12, Math.min(12, event.gamma / 5));
      const y = Math.max(-12, Math.min(12, event.beta / 8));

      const core = $("zmVisualizer").previousElementSibling
        .querySelector(".music-core");

      if (core) {
        core.style.marginLeft = x + "px";
        core.style.marginTop = y + "px";
      }

      $("zmSensorState").textContent = "MOTION ACTIVE";
    });
  }

  function loadProfile() {
    try {
      const profile = JSON.parse(
        localStorage.getItem("zemivo_profile_demo_v2") || "{}"
      );

      const name = profile.fullName || profile.name ||
        profile.displayName;

      if (name) {
        $("zmTrackArtist").textContent =
          "Zemivo Music • " + String(name);
      }
    } catch {
      // Profile data is optional.
    }
  }

  makeVisualizer();
  renderLanguage();
  loadProfile();
  setupMotion();
  audio.volume = .8;

  if (document.hidden) {
    $("zmSensorState").textContent = "3D MUSIC SPACE";
  }

  window.addEventListener("pagehide", () => {
    if (animationFrame) cancelAnimationFrame(animationFrame);
    if (currentURL) URL.revokeObjectURL(currentURL);
    if (audioContext && audioContext.state !== "closed") {
      audioContext.close().catch(() => {});
    }
  });

})();
</script>
</body>
</html>
