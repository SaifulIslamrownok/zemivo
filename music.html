
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102b45">
  <title>Zemivo Music — Temple City</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
      background: #102b45;
    }

    /* পুরো পেজজুড়ে Temple City ছবি */
    .temple-world {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-image: url("./temple-city.png");
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      z-index: 0;
    }

    /* লেখার পেছনে হালকা ছায়া */
    .temple-world::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          180deg,
          rgba(5, 18, 35, 0.38),
          transparent 24%,
          transparent 76%,
          rgba(5, 18, 35, 0.18)
        );
      pointer-events: none;
    }

    /* উপরের লেখা */
    .top-heading {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 28px 16px 18px;
      text-align: center;
    }

    .brand {
      color: #fff7d8;
      font-size: clamp(30px, 6vw, 58px);
      font-weight: 900;
      letter-spacing: 5px;
      text-shadow:
        0 3px 5px #38200b,
        0 0 14px #ffd76a,
        0 0 30px rgba(255, 211, 100, 0.8);
    }

    .page-title {
      margin-top: 8px;
      color: #ffffff;
      font-size: clamp(19px, 3.5vw, 30px);
      font-weight: 800;
      letter-spacing: 4px;
      text-shadow:
        0 2px 5px #172536,
        0 0 14px rgba(255, 255, 255, 0.75);
    }

    .tagline {
      margin-top: 9px;
      color: #fff5d5;
      font-size: clamp(11px, 2vw, 15px);
      font-weight: 700;
      letter-spacing: 2px;
      text-shadow: 0 2px 7px #172536;
    }

    /* মোবাইলের জন্য */
    @media (max-width: 600px) {
      .top-heading {
        padding-top: 24px;
      }

      .brand {
        letter-spacing: 3px;
      }

      .page-title {
        letter-spacing: 2px;
      }
    }
  </style>
</head>

<body>

  <div class="temple-world"></div>

  <header class="top-heading">
    <div class="brand">ZEMIVO</div>
    <div class="page-title">MUSIC</div>
    <div class="tagline">
      LISTEN • FEEL • LIVE
    </div>
  </header>

</body>
</html>
