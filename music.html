<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07152f">
<title>Zemivo Living — Daily 3D Worlds</title>
<style>
:root{--sky1:#f6b96d;--sky2:#f28b79;--sky3:#7658a8;--far:#526a9a;--mid:#315b67;--near:#123e3b;--water:#42c5c0;--sun:#fff0b4;--leaf:#39865b;--leaf2:#76b85d;--glow:#ffe7a2;--ink:#fff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,"Noto Sans Bengali","Segoe UI",sans-serif}
body{overflow:hidden;background:#07152f;color:var(--ink)}
.world{height:100svh;min-height:560px;position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 35%,var(--sky3) 72%,#1d4654 100%);transition:background 1.8s ease}
.sky-glow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 24%,#fff9d488,transparent 39%),linear-gradient(180deg,#fff5d522,transparent 60%);z-index:-5}
.sun{position:absolute;top:13%;left:50%;width:clamp(115px,22vw,230px);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,#fffde9 0 24%,var(--sun) 42%,#fff0b344 68%,transparent 72%);filter:drop-shadow(0 0 40px var(--glow));z-index:-4;transition:all 1.5s}
.cloud{position:absolute;width:190px;height:42px;border-radius:50px;background:#fff8e8aa;filter:blur(7px);z-index:-3;animation:cloud 34s linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;bottom:10px;border-radius:50%;background:inherit}.cloud:before{width:75px;height:75px;left:30px}.cloud:after{width:95px;height:95px;left:78px}.c1{top:25%;left:-220px}.c2{top:39%;left:55%;transform:scale(.65);animation-duration:46s;animation-delay:-17s;opacity:.65}
.peaks{position:absolute;inset:0;z-index:-2}
.peak{position:absolute;bottom:28%;width:0;height:0;border-left:var(--w) solid transparent;border-right:var(--w) solid transparent;border-bottom:var(--h) solid var(--color);filter:drop-shadow(0 16px 14px #102b3344);transition:border-bottom-color 1.5s}
.peak:after{content:"";position:absolute;left:calc(var(--snoww)*-1);top:0;border-left:var(--snoww) solid transparent;border-right:var(--snoww) solid transparent;border-bottom:var(--snowh) solid #fff9e9}
.p1{left:-9%;--w:17vw;--h:40vh;--snoww:5vw;--snowh:10vh;--color:#687e9c}
.p2{left:16%;--w:18vw;--h:55vh;--snoww:6vw;--snowh:13vh;--color:#506b8c;bottom:29%}
.p3{left:42%;--w:20vw;--h:63vh;--snoww:7vw;--snowh:16vh;--color:#405a7e;bottom:29%}
.p4{left:72%;--w:17vw;--h:48vh;--snoww:5vw;--snowh:11vh;--color:#637c96}
.p5{left:91%;--w:14vw;--h:37vh;--snoww:4vw;--snowh:9vh;--color:#71879a}
.hill{position:absolute;left:-12%;right:-12%;bottom:12%;height:38%;border-radius:50% 50% 0 0;background:linear-gradient(165deg,var(--mid),var(--near) 80%);transform:rotate(-3deg);z-index:-1;transition:background 1.5s}
.hill.back{bottom:20%;height:25%;background:linear-gradient(165deg,#8ba878,var(--mid));transform:rotate(4deg);opacity:.9}
.water{position:absolute;left:24%;bottom:-16%;width:53%;height:49%;border-radius:50%;background:radial-gradient(ellipse at 48% 0%,#c3fff0,var(--water) 32%,#176b72 75%);transform:rotate(-8deg);box-shadow:0 0 75px color-mix(in srgb,var(--water),transparent 45%);animation:water 8s ease-in-out infinite alternate;z-index:0;transition:background 1.5s}
.ripples{position:absolute;left:31%;bottom:10%;width:42%;height:11%;border-radius:50%;background:repeating-linear-gradient(175deg,transparent 0 8px,#ffffff55 9px 11px,transparent 12px 21px);filter:blur(2px);transform:rotate(-8deg);animation:ripple 6s linear infinite;z-index:1}
.tree{position:absolute;bottom:var(--b);left:var(--l);width:var(--w);height:var(--h);transform-origin:50% 100%;animation:sway var(--s,5s) ease-in-out infinite alternate;filter:drop-shadow(8px 12px 8px #0006);z-index:2}
.tree:before{content:"";position:absolute;left:46%;bottom:0;width:9%;height:46%;background:linear-gradient(90deg,#4c3020,#a16c3e,#4c3020);border-radius:8px}
.tree:after{content:"";position:absolute;inset:0 0 24%;background:linear-gradient(125deg,var(--leaf),var(--leaf2) 50%,#1e593d);clip-path:polygon(50% 0,66% 27%,61% 27%,82% 53%,70% 52%,100% 83%,59% 78%,50% 100%,39% 78%,0 83%,30% 52%,18% 53%,39% 27%,34% 27%);transition:background 1.5s}
.tree.round:after{border-radius:48% 52% 35% 35%;clip-path:polygon(50% 0,83% 22%,100% 55%,78% 83%,50% 100%,20% 83%,0 53%,18% 22%)}
.fog{position:absolute;left:-20%;width:140%;height:13%;border-radius:50%;background:#fff9e555;filter:blur(28px);animation:fog 20s ease-in-out infinite alternate;z-index:3}.f1{top:40%}.f2{top:58%;animation-delay:-9s;opacity:.65}
.foreground{position:absolute;z-index:4;left:-5%;right:-5%;bottom:-15%;height:36%;background:linear-gradient(var(--near),#071f25);clip-path:polygon(0 26%,9% 13%,19% 34%,29% 8%,40% 30%,51% 4%,62% 25%,72% 10%,83% 32%,93% 8%,100% 24%,100% 100%,0 100%)}
.top{position:absolute;z-index:7;top:24px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:clamp(9px,1.2vw,12px);font-weight:900;letter-spacing:.25em;text-shadow:0 2px 14px #172238}
.copy{position:absolute;z-index:8;left:50%;top:49%;transform:translate(-50%,-50%);width:min(780px,calc(100% - 32px));padding:clamp(27px,4vw,48px) 20px;text-align:center;border:1px solid #fff9d988;background:linear-gradient(135deg,#07182cce,#102c39a8);box-shadow:0 24px 80px #07152277,inset 0 1px #ffffff44;backdrop-filter:blur(11px);border-radius:19px}
.kicker{font-size:clamp(10px,1.5vw,14px);font-weight:900;letter-spacing:.24em;color:#fff2d3}
h1{margin:14px 0 10px;font-size:clamp(34px,7vw,72px);line-height:1.05;letter-spacing:.07em;text-shadow:0 4px 24px #0009}
.sub{font-size:clamp(11px,1.7vw,16px);letter-spacing:.12em;color:#fff0c9;font-weight:850}
p{margin:19px auto 0;max-width:570px;color:#f5fffb;font-size:clamp(14px,1.7vw,17px);line-height:1.9;text-shadow:0 1px 5px #0008}
.bottom{position:absolute;z-index:7;bottom:19px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;font-weight:800;letter-spacing:.2em;color:#fff}
.scene-label{position:absolute;z-index:7;right:17px;top:22px;border:1px solid #ffffff66;border-radius:30px;background:#0a1d3577;padding:8px 12px;font-size:10px;letter-spacing:.12em;backdrop-filter:blur(8px)}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
@keyframes water{from{transform:rotate(-8deg) scaleX(.96)}to{transform:rotate(-5deg) scaleX(1.04)}}
@keyframes ripple{from{background-position:0 0}to{background-position:100px 0}}
@keyframes fog{from{transform:translateX(-8%)}to{transform:translateX(8%) translateY(12px)}}
@keyframes cloud{from{translate:-20vw 0}to{translate:120vw 0}}
@media(max-width:600px){.peak{bottom:31%}.hill{bottom:17%;height:33%}.hill.back{bottom:23%;height:22%}.copy{top:48%;padding:27px 15px;border-radius:16px}.top{top:18px;font-size:8px;letter-spacing:.15em}.scene-label{top:42px;right:10px;font-size:8px}.bottom{font-size:8px;letter-spacing:.12em}.tree{scale:.78;transform-origin:bottom center}.water{width:65%;left:18%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<main class="world" id="world" aria-label="Zemivo Living daily animated landscape">
<div class="sky-glow"></div><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div>
<div class="peaks"><i class="peak p1"></i><i class="peak p2"></i><i class="peak p3"></i><i class="peak p4"></i><i class="peak p5"></i></div>
<div class="hill back"></div><div class="hill"></div><div class="water"></div><div class="ripples"></div>
<div class="tree" style="--l:2%;--b:7%;--w:150px;--h:290px;--s:5.4s"></div>
<div class="tree round" style="--l:14%;--b:8%;--w:105px;--h:205px;--s:4.4s"></div>
<div class="tree" style="--l:25%;--b:6%;--w:65px;--h:145px;--s:5s"></div>
<div class="tree" style="--l:81%;--b:7%;--w:145px;--h:280px;--s:4.8s"></div>
<div class="tree round" style="--l:71%;--b:7%;--w:95px;--h:185px;--s:5.2s"></div>
<div class="tree round" style="--l:92%;--b:9%;--w:75px;--h:160px;--s:4.6s"></div>
<div class="fog f1"></div><div class="fog f2"></div><div class="foreground"></div>
<div class="top">ZEMIVO • A WORLD OF YOUR OWN</div><div class="scene-label" id="sceneLabel">DAILY WORLD</div>
<section class="copy">
<div class="kicker">WELCOME TO A LIVING WORLD</div>
<h1>ZEMIVO LIVING</h1>
<div class="sub">YOUR WORLD • YOUR MOMENTS • YOUR LIFE</div>
<p>প্রতিদিন নতুন দৃশ্য, নতুন রং—একটি জীবন্ত পৃথিবী, যেখানে প্রতিটি মুহূর্তের নিজস্ব গল্প আছে।</p>
</section>
<div class="bottom">EXPLORE • IMAGINE • CONNECT</div>
</main>
<script>
/* প্রতিদিন তারিখ অনুযায়ী একটি দৃশ্য বেছে নেয়; একই দিনে একই দৃশ্য থাকবে। */
const scenes=[
{label:"ALPINE SUNRISE",sky:["#f6c879","#e98e80","#8067ad"],far:"#627d9b",mid:"#47746a",near:"#17483c",water:"#54c9c2",sun:"#fff1bd",leaf:"#397b4d",leaf2:"#8cc86b",glow:"#ffe6a4"},
{label:"TROPICAL PARADISE",sky:["#71d7df","#39aeb8","#277d91"],far:"#477b91",mid:"#287d69",near:"#10483c",water:"#35d6cb",sun:"#fff5b8",leaf:"#167a50",leaf2:"#8cdb68",glow:"#b4fff0"},
{label:"GOLDEN DESERT",sky:["#ffd18a","#e99a6b","#a85d79"],far:"#98745f",mid:"#9b6748",near:"#593b35",water:"#d9a56a",sun:"#fff0bd",leaf:"#637b46",leaf2:"#b6a65b",glow:"#ffe2a0"},
{label:"MOONLIT FOREST",sky:["#354b78","#26365f","#171e48"],far:"#354b70",mid:"#244d50",near:"#0b252e",water:"#568dba",sun:"#e3e8ff",leaf:"#1d5a4b",leaf2:"#528c72",glow:"#c7d8ff"},
{label:"SPRING VALLEY",sky:["#a6e8d1","#78c9bb","#6c91b4"],far:"#829bb1",mid:"#528b69",near:"#24533e",water:"#67d9cb",sun:"#fff6c5",leaf:"#37834e",leaf2:"#a6d66e",glow:"#fff5bd"},
{label:"AUTUMN LAKE",sky:["#f3b66f","#d87965","#745c88"],far:"#786b78",mid:"#76513f",near:"#3b332d",water:"#bd8d68",sun:"#ffe5a8",leaf:"#a45d32",leaf2:"#e5a64d",glow:"#ffe0a0"},
{label:"AURORA HIGHLANDS",sky:["#315e78","#267d83","#493d83"],far:"#4c7187",mid:"#28665d",near:"#102e38",water:"#4ac6c0",sun:"#d7ffe8",leaf:"#236b51",leaf2:"#6fc49a",glow:"#a5ffe0"}
];
const now=new Date(),key=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()),scene=scenes[Math.floor(key/86400000)%scenes.length];
const root=document.documentElement;
root.style.setProperty("--sky1",scene.sky[0]);root.style.setProperty("--sky2",scene.sky[1]);root.style.setProperty("--sky3",scene.sky[2]);
["far","mid","near","water","sun","leaf","leaf2","glow"].forEach(k=>root.style.setProperty("--"+k,scene[k]));
document.getElementById("sceneLabel").textContent=scene.label;
</script>
</body>
</html>
