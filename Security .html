<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Zemivo - Security</title>
<style>
body{font-family:Arial;background:#f4f6f8;margin:0}
.card{background:white;max-width:700px;margin:30px auto;padding:25px;border-radius:15px}
.item{padding:18px;border-bottom:1px solid #eee}
button{background:#2563eb;color:white;border:0;padding:10px 16px;border-radius:20px}
</style>
</head>
<body>
<div class="card">
<h1>🛡️ Security</h1>
<p>Protect your Zemivo account.</p>

<div class="item">🔑 Password Security<br><button onclick="alert('Password settings opened')">Manage</button></div>
<div class="item">📱 Login Alerts<br><button onclick="alert('Login alerts enabled')">Enable</button></div>
<div class="item">🔐 Two-Factor Authentication<br><button onclick="alert('2FA setup opened')">Set Up</button></div>
<div class="item">💻 Active Sessions<br><button onclick="alert('No active sessions shown yet')">View</button></div>
</div>
</body>
</html>
