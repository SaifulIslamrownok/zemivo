<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Zemivo Video → Living 3D</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#05070c;
  color:#fff;
}

.page{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.header{
  height:64px;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(10,15,25,.94);
  border-bottom:1px solid rgba(255,255,255,.12);
}

.logo{
  font-size:24px;
  font-weight:800;
  color:#60a5fa;
}

.badge{
  font-size:12px;
  padding:7px 11px;
  border-radius:20px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  color:#cbd5e1;
}

.main{
  flex:1;
  display:grid;
  grid-template-columns:340px 1fr;
  min-height:0;
}

.panel{
  padding:18px;
  background:rgba(10,15,25,.97);
  border-right:1px solid rgba(255,255,255,.1);
  overflow-y:auto;
}

.title{
  font-size:22px;
  font-weight:800;
  margin-bottom:7px;
}

.subtitle{
  color:#94a3b8;
  font-size:13px;
  line-height:1.5;
  margin-bottom:18px;
}

.upload-box{
  border:1px dashed rgba(255,255,255,.25);
  border-radius:16px;
  padding:18px;
  background:rgba(255,255,255,.04);
}

.upload-box input{
  width:100%;
  color:#cbd5e1;
  font-size:13px;
}

.video-preview{
  width:100%;
  margin-top:15px;
  border-radius:14px;
  display:none;
  max-height:230px;
  object-fit:cover;
  background:#000;
  border:1px solid rgba(255,255,255,.12);
}

.description{
  margin-top:15px;
}

.description label{
  display:block;
  font-size:13px;
  color:#cbd5e1;
  margin-bottom:7px;
}

.description textarea{
  width:100%;
  min-height:90px;
  resize:vertical;
  border:1px solid rgba(255,255,255,.14);
  border-radius:12px;
  background:#0f172a;
  color:#fff;
  padding:11px;
  outline:none;
}

.description textarea:focus{
  border-color:#60a5fa;
}

.react-button{
  width:100%;
  margin-top:15px;
  padding:13px;
  border:0;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

.react-button:hover{
  background:#1d4ed8;
}

.react-button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.results{
  margin-top:18px;
  display:grid;
  gap:9px;
}

.result{
  padding:12px;
  border-radius:12px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
}

.result-label{
  font-size:11px;
  color:#94a3b8;
  margin-bottom:4px;
}

.result-value{
  font-size:15px;
  font-weight:800;
  text-transform:capitalize;
}

.colors{
  display:flex;
  gap:7px;
  margin-top:8px;
}

.color{
  width:28px;
  height:28px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.3);
}

.world{
  position:relative;
  min-width:0;
  min-height:0;
  background:#000;
}

.world iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
}

.status{
  position:absolute;
  left:18px;
  bottom:18px;
  z-index:5;
  padding:9px 13px;
  border-radius:20px;
  background:rgba(0,0,0,.52);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(10px);
  font-size:12px;
  color:#cbd5e1;
}

@media(max-width:800px){

  .main{
    grid-template-columns:1fr;
  }

  .panel{
    border-right:0;
    border-bottom:1px solid rgba(255,255,255,.1);
  }

  .world{
    height:65vh;
    min-height:450px;
  }

}

</style>

</head>


<body>

<div class="page">


<header class="header">

  <div class="logo">
    Zemivo
  </div>

  <div class="badge">
    Video → Living 3D
  </div>

</header>


<main class="main">


<section class="panel">

  <div class="title">
    Video → Living 3D
  </div>

  <div class="subtitle">
    Upload a video and Zemivo will analyze
    its visual colors and motion, then make
    the 3D environment react to the content.
  </div>


  <div class="upload-box">

    <input
      id="videoInput"
      type="file"
      accept="video/*"
    >


    <video
      id="videoPreview"
      class="video-preview"
      controls
      muted
      playsinline
    >
    </video>

  </div>


  <div class="description">

    <label for="description">
      Optional description
    </label>

    <textarea
      id="description"
      placeholder="Example: ocean waves, football match, futuristic gaming, music concert..."
    ></textarea>

  </div>


  <button
    id="reactButton"
    class="react-button"
    type="button"
    disabled
  >
    ✨ Make Zemivo React
  </button>


  <div class="results">


    <div class="result">

      <div class="result-label">
        WORLD
      </div>

      <div
        id="worldResult"
        class="result-value"
      >
        Waiting...
      </div>

    </div>


    <div class="result">

      <div class="result-label">
        MOOD
      </div>

      <div
        id="moodResult"
        class="result-value"
      >
        Waiting...
      </div>

    </div>


    <div class="result">

      <div class="result-label">
        MOTION
      </div>

      <div
        id="motionResult"
        class="result-value"
      >
        Waiting...
      </div>

    </div>


    <div class="result">

      <div class="result-label">
        VIDEO COLORS
      </div>

      <div
        id="colorsResult"
        class="colors"
      >
      </div>

    </div>


  </div>

</section>


<section class="world">

  <iframe
    id="worldFrame"
    src="zemivo-living-world.html"
    title="Zemivo Living 3D World"
  ></iframe>


  <div
    id="status"
    class="status"
  >
    Waiting for video...
  </div>

</section>


</main>

</div>


<script>


const videoInput =
  document.getElementById(
    "videoInput"
  );


const videoPreview =
  document.getElementById(
    "videoPreview"
  );


const reactButton =
  document.getElementById(
    "reactButton"
  );


const description =
  document.getElementById(
    "description"
  );


const worldResult =
  document.getElementById(
    "worldResult"
  );


const moodResult =
  document.getElementById(
    "moodResult"
  );


const motionResult =
  document.getElementById(
    "motionResult"
  );


const colorsResult =
  document.getElementById(
    "colorsResult"
  );


const status =
  document.getElementById(
    "status"
  );


const worldFrame =
  document.getElementById(
    "worldFrame"
  );


let selectedVideo = null;

let videoColors = [];

let videoMotion = 0;


/* VIDEO SELECT */

videoInput.addEventListener(
  "change",
  function(){

    const file =
      videoInput.files[0];


    if(!file){

      selectedVideo = null;

      videoPreview.style.display =
        "none";

      reactButton.disabled =
        true;

      status.textContent =
        "Waiting for video...";

      return;

    }


    if(
      !file.type.startsWith(
        "video/"
      )
    ){

      alert(
        "Please select a video file."
      );

      videoInput.value = "";

      return;

    }


    selectedVideo =
      file;


    const videoURL =
      URL.createObjectURL(
        file
      );


    videoPreview.src =
      videoURL;


    videoPreview.style.display =
      "block";


    reactButton.disabled =
      false;


    status.textContent =
      "Video loaded. Ready to analyze.";


    videoPreview.onloadedmetadata =
      function(){

        analyzeVideo();

      };

  }
);


/* VIDEO ANALYSIS */

async function analyzeVideo(){

  if(!selectedVideo){

    return;

  }


  status.textContent =
    "Analyzing video...";


  const duration =
    videoPreview.duration;


  const sampleCount =
    Math.min(
      6,
      Math.max(
        3,
        Math.floor(
          duration
        )
      )
    );


  const samples = [];


  for(
    let i = 0;
    i < sampleCount;
    i++
  ){

    const time =
      duration *
      (
        i /
        Math.max(
          1,
          sampleCount - 1
        )
      );


    const frame =
      await captureFrame(
        time
      );


    if(frame){

      samples.push(
        frame
      );

    }

  }


  videoColors =
    getAverageColors(
      samples
    );


  videoMotion =
    estimateMotion(
      samples
    );


  renderColors(
    videoColors
  );


  status.textContent =
    "Video analyzed. Ready.";

}


/* CAPTURE FRAME */

function captureFrame(
  time
){

  return new Promise(
    function(resolve){

      const video =
        videoPreview;


      function capture(){

        const canvas =
          document.createElement(
            "canvas"
          );


        const maxSize =
          120;


        const ratio =
          Math.min(
            maxSize /
              video.videoWidth,

            maxSize /
              video.videoHeight,

            1
          );


        canvas.width =
          Math.max(
            1,
            Math.floor(
              video.videoWidth *
              ratio
            )
          );


        canvas.height =
          Math.max(
            1,
            Math.floor(
              video.videoHeight *
              ratio
            )
          );


        const ctx =
          canvas.getContext(
            "2d",
            {
              willReadFrequently:true
            }
          );


        ctx.drawImage(
          video,
          0,
          0,
          canvas.width,
          canvas.height
        );


        resolve(
          canvas
        );

      }


      function seeked(){

        video.removeEventListener(
          "seeked",
          seeked
        );

        capture();

      }


      video.addEventListener(
        "seeked",
        seeked
      );


      video.currentTime =
        Math.min(
          time,
          Math.max(
            0,
            video.duration - 0.05
          )
        );

    }
  );

}


/* COLOR ANALYSIS */

function getAverageColors(
  canvases
){

  const buckets = {};


  canvases.forEach(
    function(canvas){

      const ctx =
        canvas.getContext(
          "2d",
          {
            willReadFrequently:true
          }
        );


      const data =
        ctx.getImageData(
          0,
          0,
          canvas.width,
          canvas.height
        ).data;


      for(
        let i = 0;
        i < data.length;
        i += 16
      ){

        const r =
          data[i];

        const g =
          data[i + 1];

        const b =
          data[i + 2];

        const a =
          data[i + 3];


        if(a < 150){

          continue;

        }


        const qr =
          Math.round(
            r / 32
          ) * 32;


        const qg =
          Math.round(
            g / 32
          ) * 32;


        const qb =
          Math.round(
            b / 32
          ) * 32;


        const key =
          qr +
          "," +
          qg +
          "," +
          qb;


        if(
          !buckets[key]
        ){

          buckets[key] =
            0;

        }


        buckets[key]++;

      }

    }
  );


  return Object.keys(
    buckets
  )
  .sort(
    function(a,b){

      return (
        buckets[b] -
        buckets[a]
      );

    }
  )
  .slice(0,5)
  .map(
    function(key){

      const parts =
        key
          .split(",")
          .map(Number);


      return {

        r:
          Math.min(
            255,
            parts[0]
          ),

        g:
          Math.min(
            255,
            parts[1]
          ),

        b:
          Math.min(
            255,
            parts[2]
          )

      };

    }
  );

}


/* MOTION ESTIMATION */

function estimateMotion(
  canvases
){

  if(
    canvases.length < 2
  ){

    return 0.25;

  }


  let difference =
    0;


  for(
    let n = 1;
    n < canvases.length;
    n++
  ){

    const first =
      canvases[n - 1]
        .getContext("2d")
        .getImageData(
          0,
          0,
          canvases[n - 1].width,
          canvases[n - 1].height
        ).data;


    const second =
      canvases[n]
        .getContext("2d")
        .getImageData(
          0,
          0,
          canvases[n].width,
          canvases[n].height
        ).data;


    const length =
      Math.min(
        first.length,
        second.length
      );


    let localDifference =
      0;


    for(
      let i = 0;
      i < length;
      i += 32
    ){

      localDifference +=
        Math.abs(
          first[i] -
          second[i]
        );

      localDifference +=
        Math.abs(
          first[i + 1] -
          second[i + 1]
        );

      localDifference +=
        Math.abs(
          first[i + 2] -
          second[i + 2]
        );

    }


    difference +=
      localDifference /
      (
        Math.max(
          1,
          length / 32
        ) *
        765
      );

  }


  difference /=
    (
      canvases.length - 1
    );


  return Math.min(
    1,
    Math.max(
      0,
      difference
    )
  );

}


/* COLORS UI */

function renderColors(
  colors
){

  colorsResult.innerHTML =
    "";


  colors.forEach(
    function(color){

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "color";


      item.style.background =
        "rgb(" +
        color.r +
        "," +
        color.g +
        "," +
        color.b +
        ")";


      colorsResult.appendChild(
        item
      );

    }
  );

}


/* MAKE ZEMIVO REACT */

function makeZemivoReact(){

  if(!selectedVideo){

    return;

  }


  reactButton.disabled =
    true;


  status.textContent =
    "Making Zemivo react...";


  const waitForEngine =
    setInterval(
      function(){

        try{

          const engine =
            worldFrame
              .contentWindow
              .ZemivoLivingWorld;


          if(
            !engine ||
            typeof
            engine.analyzeContent
            !==
            "function"
          ){

            return;

          }


          clearInterval(
            waitForEngine
          );


          const profile =
            engine.analyzeContent({

              text:
                description.value.trim(),

              contentType:
                "video",

              dominantColors:
                videoColors,

              motionLevel:
                videoMotion,

              tags:
                [],

              context:
                "uploaded video"

            });


          engine.applyContentVisualProfile(
            profile
          );


          worldResult.textContent =
            profile.mode ||
            "personal";


          moodResult.textContent =
            profile.mood ||
            "calm";


          motionResult.textContent =
            profile.motion ||
            "soft";


          status.textContent =
            "Zemivo is reacting to the video.";


          reactButton.disabled =
            false;

        }
        catch(error){

          console.error(
            error
          );

        }

      },
      100
    );


  setTimeout(
    function(){

      clearInterval(
        waitForEngine
      );


      reactButton.disabled =
        false;

    },
    5000
  );

}


/* BUTTON */

reactButton.addEventListener(
  "click",
  makeZemivoReact
);


</script>

</body>

</html>
