<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zemivo - Fundraisers</title>
<style>
body{margin:0;font-family:Arial;background:#f4f6f8;color:#222}
.topbar{background:white;padding:18px;display:flex;justify-content:space-between;box-shadow:0 2px 8px #ddd}
.logo{font-size:28px;font-weight:bold;color:#2563eb}
.topbar a{color:#2563eb;text-decoration:none;font-weight:bold}
.container{max-width:850px;margin:25px auto;padding:15px}
.card{background:white;padding:22px;border-radius:15px;margin-bottom:18px;box-shadow:0 2px 8px #ddd}
.fundraiser{padding:18px 0;border-bottom:1px solid #eee}
.progress{background:#e5e7eb;height:10px;border-radius:10px;margin:12px 0}
.bar{height:100%;background:#16a34a;border-radius:10px}
button{background:#16a34a;color:white;border:0;padding:10px 18px;border-radius:22px;font-weight:bold}
</style>
</head>
<body>

<header class="topbar">
<div class="logo">Zemivo</div>
<a href="index.html">🏠 Home</a>
</header>

<main class="container">

<div class="card">
<h1>❤️ Fundraisers</h1>
<p>Support important causes and communities.</p>
</div>

<div class="card">

<div class="fundraiser">
<h3>🏥 Medical Support</h3>
<p>Help a family with medical expenses.</p>

<div class="progress">
<div class="bar" style="width:60%"></div>
</div>

<p>$6,000 raised of $10,000</p>
<button onclick="donate(this)">Donate</button>
</div>

<div class="fundraiser">
<h3>🎓 Education Support</h3>
<p>Help students continue their education.</p>

<div class="progress">
<div class="bar" style="width:40%"></div>
</div>

<p>$4,000 raised of $10,000</p>
<button onclick="donate(this)">Donate</button>
</div>

</div>

</main>

<script>
function donate(button){
alert("Donation feature will be connected to a payment system later.");
}
</script>

</body>
</html>
