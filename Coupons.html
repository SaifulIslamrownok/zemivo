<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Zemivo - Coupons</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6f8;
  color:#17202a;
  overflow-x:hidden;
}


/* =========================
   ZEMIVO LIVING WORLD
   ========================= */

.zemivo-world{
  min-height:100vh;
  position:relative;
  isolation:isolate;
  overflow:hidden;
}

.zemivo-world::before{
  content:"";
  position:fixed;
  width:420px;
  height:420px;
  border-radius:50%;
  background:radial-gradient(
    circle,
    rgba(37,99,235,.12),
    transparent 70%
  );
  top:-180px;
  right:-120px;
  pointer-events:none;
  z-index:-1;
}

.zemivo-world::after{
  content:"";
  position:fixed;
  width:360px;
  height:360px;
  border-radius:50%;
  background:radial-gradient(
    circle,
    rgba(14,165,233,.08),
    transparent 70%
  );
  bottom:-170px;
  left:-120px;
  pointer-events:none;
  z-index:-1;
}

.living-card{
  transform:translateZ(0);
  transition:
    transform .25s ease,
    box-shadow .25s ease;
}

.living-card:hover{
  transform:translateY(-2px);
}


/* =========================
   HEADER
   ========================= */

.topbar{
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(12px);
  padding:15px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #e5e7eb;
  box-shadow:0 2px 10px rgba(0,0,0,.07);
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:27px;
  font-weight:800;
  color:#2563eb;
}

.security-indicator{
  font-size:12px;
  color:#16a34a;
  font-weight:bold;
}


/* =========================
   MAIN
   ========================= */

.container{
  width:100%;
  max-width:700px;
  margin:30px auto;
  padding:0 15px;
}

.card{
  background:rgba(255,255,255,.97);
  padding:25px;
  border-radius:18px;
  border:1px solid rgba(229,231,235,.9);
  box-shadow:
    0 8px 25px rgba(15,23,42,.08);
}

.card h1{
  margin-top:0;
  color:#2563eb;
}


/* =========================
   SECURITY
   ========================= */

.security-card{
  background:#f8fafc;
  border:1px solid #e2e8f0;
  padding:14px 16px;
  border-radius:12px;
  margin-bottom:18px;
}

.security-title{
  font-weight:bold;
}

.security-text{
  font-size:12px;
  color:#64748b;
  margin-top:4px;
}


/* =========================
   COUPONS
   ========================= */

.coupon{
  padding:18px;
  border:1px dashed #2563eb;
  margin:12px 0;
  border-radius:12px;
  background:#f8fbff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.coupon-info{
  min-width:0;
}

.coupon-code{
  font-weight:800;
  color:#1d4ed8;
  font-size:16px;
}

.coupon-description{
  margin-top:4px;
  color:#555;
  font-size:14px;
}

.copy-button{
  background:#2563eb;
  color:white;
  border:0;
  padding:9px 15px;
  border-radius:20px;
  font-weight:bold;
  flex-shrink:0;
  cursor:pointer;
}

.copy-button:hover{
  background:#1d4ed8;
}

.copy-button:active{
  transform:scale(.97);
}


/* =========================
   TOAST
   ========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  background:#111827;
  color:white;
  padding:12px 18px;
  border-radius:10px;
  display:none;
  z-index:500;
  max-width:90%;
  text-align:center;
}

.toast.show{
  display:block;
}


/* =========================
   MOBILE
   ========================= */

@media(max-width:600px){

  .topbar{
    padding:14px 15px;
  }

  .logo{
    font-size:24px;
  }

  .container{
    margin:20px auto;
    padding:0 12px;
  }

  .card{
    padding:20px;
    border-radius:16px;
  }

  .coupon{
    padding:15px;
  }

  .coupon-code{
    font-size:15px;
  }

  .coupon-description{
    font-size:13px;
  }

  .copy-button{
    padding:8px 13px;
  }

}

</style>

</head>


<body>

<div
  id="zemivoWorld"
  class="zemivo-world"
>


  <!-- HEADER -->

  <header class="topbar">

    <div class="logo">
      Zemivo
    </div>

    <div
      id="securityIndicator"
      class="security-indicator"
    >
      ● Secure
    </div>

  </header>


  <main class="container">


    <!-- SECURITY FOUNDATION -->

    <section class="security-card living-card">

      <div class="security-title">
        🔒 Zemivo Security Foundation
      </div>

      <div
        id="securityText"
        class="security-text"
      >
        Initializing secure connection...
      </div>

    </section>


    <!-- COUPONS -->

    <section class="card living-card">

      <h1>
        🎟️ Coupons
      </h1>


      <div class="coupon">

        <div class="coupon-info">

          <div class="coupon-code">
            ZEMIVO10
          </div>

          <div class="coupon-description">
            10% Off
          </div>

        </div>

        <button
          class="copy-button"
          type="button"
          data-code="ZEMIVO10"
        >
          Copy
        </button>

      </div>


      <div class="coupon">

        <div class="coupon-info">

          <div class="coupon-code">
            WELCOME
          </div>

          <div class="coupon-description">
            Welcome Offer
          </div>

        </div>

        <button
          class="copy-button"
          type="button"
          data-code="WELCOME"
        >
          Copy
        </button>

      </div>

    </section>


  </main>


  <div
    id="toast"
    class="toast"
  ></div>


</div>


<!-- =========================
     ZEMIVO PAGE FOUNDATION
     ========================= -->

<script type="module">

import {
  auth
} from "./zemivo-security.js";


/* =========================
   PAGE ISOLATION
   ========================= */

const ZemivoCouponsPage = {

  version:"1.0.0",


  init(){

    this.setupSecurity();

    this.setupCoupons();

    this.setupLivingWorld();

  },


  /* =========================
     SECURITY
     ========================= */

  setupSecurity(){

    const securityText =
      document.getElementById(
        "securityText"
      );

    const indicator =
      document.getElementById(
        "securityIndicator"
      );


    if(
      auth &&
      auth.app
    ){

      securityText.textContent =
        "Zemivo Security Foundation is active.";

      indicator.textContent =
        "● Secure";

    }
    else{

      securityText.textContent =
        "Security foundation could not be initialized.";

      indicator.textContent =
        "● Check";

    }

  },


  /* =========================
     COUPON COPY
     ========================= */

  setupCoupons(){

    const buttons =
      document.querySelectorAll(
        ".copy-button"
      );


    buttons.forEach(
      function(button){

        button.addEventListener(
          "click",
          async function(){

            const code =
              button.dataset.code;


            if(!code){
              return;
            }


            try{

              await navigator.clipboard.writeText(
                code
              );

              ZemivoCouponsPage.showToast(
                "Coupon copied: " + code
              );

            }
            catch(error){

              /*
                Fallback for browsers where
                Clipboard API is unavailable.
              */

              const temporaryInput =
                document.createElement(
                  "input"
                );

              temporaryInput.value =
                code;

              document.body.appendChild(
                temporaryInput
              );

              temporaryInput.select();

              let copied =
                false;

              try{

                copied =
                  document.execCommand(
                    "copy"
                  );

              }
              catch(fallbackError){

                copied =
                  false;

              }

              temporaryInput.remove();


              if(copied){

                ZemivoCouponsPage.showToast(
                  "Coupon copied: " + code
                );

              }
              else{

                ZemivoCouponsPage.showToast(
                  "Copy failed. Coupon: " + code
                );

              }

            }

          }
        );

      }
    );

  },


  /* =========================
     LIVING WORLD
     ========================= */

  setupLivingWorld(){

    const world =
      document.getElementById(
        "zemivoWorld"
      );


    if(!world){
      return;
    }


    /*
      Shared Living World foundation.

      The page is ready for the common
      Zemivo 3D engine without requiring
      this page to be rebuilt later.
    */

    world.dataset.livingWorld =
      "ready";

    world.dataset.worldVersion =
      "1.0.0";

  },


  /* =========================
     TOAST
     ========================= */

  showToast(message){

    const toast =
      document.getElementById(
        "toast"
      );


    if(!toast){
      return;
    }


    toast.textContent =
      message;

    toast.classList.add(
      "show"
    );


    setTimeout(
      function(){

        toast.classList.remove(
          "show"
        );

      },
      2200
    );

  }

};


/* =========================
   START PAGE
   ========================= */

ZemivoCouponsPage.init();

</script>


</body>

</html>
