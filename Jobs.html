<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zemivo - Jobs</title>
<style>
body{margin:0;font-family:Arial;background:#f4f6f8;color:#222}
.topbar{background:white;padding:18px;display:flex;justify-content:space-between;box-shadow:0 2px 8px #ddd}
.logo{font-size:28px;font-weight:bold;color:#2563eb}
.topbar a{color:#2563eb;text-decoration:none;font-weight:bold}
.container{max-width:850px;margin:25px auto;padding:15px}
.card{background:white;padding:22px;border-radius:15px;margin-bottom:18px;box-shadow:0 2px 8px #ddd}
.job{padding:18px 0;border-bottom:1px solid #eee}
.job h3{margin-bottom:7px}
.job p{color:#666}
button{background:#2563eb;color:white;border:0;padding:10px 18px;border-radius:22px;font-weight:bold}
</style>
</head>
<body>

<header class="topbar">
<div class="logo">Zemivo</div>
<a href="index.html">🏠 Home</a>
</header>

<main class="container">

<div class="card">
<h1>💼 Jobs</h1>
<p>Discover job opportunities from businesses and organizations.</p>
</div>

<div class="card">

<div class="job">
<h3>💻 Web Developer</h3>
<p>Remote • Full Time</p>
<button onclick="apply(this)">Apply</button>
</div>

<div class="job">
<h3>🎨 Graphic Designer</h3>
<p>Remote • Freelance</p>
<button onclick="apply(this)">Apply</button>
</div>

<div class="job">
<h3>📱 Social Media Manager</h3>
<p>Remote • Part Time</p>
<button onclick="apply(this)">Apply</button>
</div>

<div class="job">
<h3>✍️ Content Creator</h3>
<p>Remote • Freelance</p>
<button onclick="apply(this)">Apply</button>
</div>

</div>

</main>

<script>
function apply(button){
button.textContent="✓ Application Started";
button.disabled=true;
}
</script>

</body>
</html>
