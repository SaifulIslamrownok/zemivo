<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Zemivo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .signup-box {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 30px 25px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: bold;
      color: #2563eb;
      margin-bottom: 8px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    .info {
      font-size: 13px;
      color: #555;
      line-height: 1.5;
      margin-bottom: 15px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    .create {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 25px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .create:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #2563eb;
      text-decoration: none;
    }

    .login-link {
      text-align: center;
      margin-top: 18px;
    }

    .login-link a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      line-height: 1.5;
    }

    .success {
      color: #15803d;
    }

    .error {
      color: #dc2626;
    }

    .warning {
      color: #b45309;
    }
  </style>
</head>

<body>

  <div class="signup-box">

    <div class="logo">Zemivo</div>

    <h2>Create Your Account</h2>

    <div class="info">
      Zemivo currently requires users to be 18 years or older.
      Please provide your real date of birth.
    </div>

    <form id="signupForm">

      <input
        id="fullName"
        type="text"
        placeholder="Full Name"
        autocomplete="name"
        required
      >

      <input
        id="email"
        type="email"
        placeholder="Email Address"
        autocomplete="email"
        required
      >

      <input
        id="birthDate"
        type="date"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="new-password"
        minlength="6"
        required
      >

      <input
        id="confirmPassword"
        type="password"
        placeholder="Confirm Password"
        autocomplete="new-password"
        minlength="6"
        required
      >

      <button
        id="createButton"
        class="create"
        type="submit"
      >
        Create Account
      </button>

    </form>

    <div id="message"></div>

    <a class="back" href="index.html">
      ← Back to Zemivo
    </a>

    <div class="login-link">
      Already have an account?
      <a href="login.html">Log In</a>
    </div>

  </div>


  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      updateProfile,
      sendEmailVerification
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    const firebaseConfig = {

      apiKey: "AIzaSyAxJUFBWm2fa0g3oxUWWqdfSTEAc-bRgfI",

      authDomain: "zemivo.firebaseapp.com",

      projectId: "zemivo",

      storageBucket: "zemivo.firebasestorage.app",

      messagingSenderId: "195335939691",

      appId: "1:195335939691:web:5fa5c62c53d0c0aefe732e",

      measurementId: "G-GNHH5S4H09"

    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    const form =
      document.getElementById("signupForm");

    const message =
      document.getElementById("message");

    const createButton =
      document.getElementById("createButton");


    function showMessage(text, type) {

      message.textContent = text;

      message.className = type;

    }


    function calculateAge(birthDate) {

      const today = new Date();

      const birth = new Date(
        birthDate + "T00:00:00"
      );

      let age =
        today.getFullYear() -
        birth.getFullYear();

      const monthDifference =
        today.getMonth() -
        birth.getMonth();

      if (
        monthDifference < 0 ||
        (
          monthDifference === 0 &&
          today.getDate() < birth.getDate()
        )
      ) {

        age--;

      }

      return age;

    }


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        showMessage("", "");


        const name =
          document
            .getElementById("fullName")
            .value
            .trim();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const birthDate =
          document
            .getElementById("birthDate")
            .value;


        const password =
          document
            .getElementById("password")
            .value;


        const confirmPassword =
          document
            .getElementById("confirmPassword")
            .value;


        if (name.length < 2) {

          showMessage(
            "Please enter your full name.",
            "error"
          );

          return;

        }


        if (!birthDate) {

          showMessage(
            "Please enter your date of birth.",
            "error"
          );

          return;

        }


        const age =
          calculateAge(birthDate);


        if (age < 18) {

          showMessage(
            "Sorry. You must be 18 or older to create a Zemivo account.",
            "error"
          );

          return;

        }


        if (age > 120) {

          showMessage(
            "Please enter a valid date of birth.",
            "error"
          );

          return;

        }


        if (password !== confirmPassword) {

          showMessage(
            "Passwords do not match.",
            "error"
          );

          return;

        }


        if (password.length < 6) {

          showMessage(
            "Password must be at least 6 characters.",
            "error"
          );

          return;

        }


        createButton.disabled = true;

        createButton.textContent =
          "Creating Account...";


        try {

          const userCredential =
            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            userCredential.user;


          await updateProfile(
            user,
            {
              displayName: name
            }
          );


          await sendEmailVerification(user);


          showMessage(
            "Account created. A verification email has been sent to your email address. Please verify your email before continuing.",
            "success"
          );


          form.reset();

          createButton.disabled = false;

          createButton.textContent =
            "Create Account";


        } catch (error) {

          console.error(error);


          let errorMessage =
            "Account creation failed. Please try again.";


          if (
            error.code ===
            "auth/email-already-in-use"
          ) {

            errorMessage =
              "This email is already registered.";

          }

          else if (
            error.code ===
            "auth/invalid-email"
          ) {

            errorMessage =
              "Please enter a valid email address.";

          }

          else if (
            error.code ===
            "auth/weak-password"
          ) {

            errorMessage =
              "Please choose a stronger password.";

          }

          else if (
            error.code ===
            "auth/network-request-failed"
          ) {

            errorMessage =
              "Network problem. Please try again.";

          }


          showMessage(
            errorMessage,
            "error"
          );


          createButton.disabled = false;

          createButton.textContent =
            "Create Account";

        }

      }

    );

  </script>

</body>
</html>
