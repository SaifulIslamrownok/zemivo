<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Zemivo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .signup-box {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 30px 25px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: bold;
      color: #2563eb;
      margin-bottom: 8px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    .create {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 25px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #2563eb;
      text-decoration: none;
    }

    .login-link {
      text-align: center;
      margin-top: 18px;
    }

    .login-link a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="signup-box">

    <div class="logo">Zemivo</div>

    <h2>Create Your Account</h2>

    <form id="signupForm">

      <input
        id="fullName"
        type="text"
        placeholder="Full Name"
        required
      >

      <input
        id="email"
        type="email"
        placeholder="Email Address"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
        required
      >

      <input
        id="confirmPassword"
        type="password"
        placeholder="Confirm Password"
        required
      >

      <button
        class="create"
        type="submit"
      >
        Create Account
      </button>

    </form>

    <div id="message"></div>

    <a class="back" href="index.html">
      ← Back to Zemivo
    </a>

    <div class="login-link">
      Already have an account?
      <a href="login.html">Log In</a>
    </div>

  </div>

  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      updateProfile
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    const firebaseConfig = {

      apiKey: "AIzaSyAxJUFBWm2fa0g3oxUWWqdfSTEAc-bRgfI",

      authDomain: "zemivo.firebaseapp.com",

      projectId: "zemivo",

      storageBucket: "zemivo.firebasestorage.app",

      messagingSenderId: "195335939691",

      appId: "1:195335939691:web:5fa5c62c53d0c0aefe732e",

      measurementId: "G-GNHH5S4H09"

    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    const form =
      document.getElementById("signupForm");

    const message =
      document.getElementById("message");


    form.addEventListener("submit", async function(event) {

      event.preventDefault();


      const name =
        document.getElementById("fullName").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;


      if (password !== confirmPassword) {

        message.textContent =
          "Passwords do not match.";

        return;
      }


      if (password.length < 6) {

        message.textContent =
          "Password must be at least 6 characters.";

        return;
      }


      try {

        const userCredential =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        await updateProfile(
          userCredential.user,
          {
            displayName: name
          }
        );


        message.textContent =
          "Account created successfully!";


        setTimeout(function() {

          window.location.href =
            "profile.html";

        }, 1000);


      } catch (error) {

        console.error(error);

        message.textContent =
          error.message;

      }

    });

  </script>

</body>
</html>
