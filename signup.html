<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Sign Up - Zemivo</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }


    .signup-box {
      width: 100%;
      max-width: 440px;
      background: white;
      padding: 30px 25px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }


    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: bold;
      color: #2563eb;
      margin-bottom: 8px;
    }


    h2 {
      text-align: center;
      margin-bottom: 22px;
    }


    .step {
      font-size: 13px;
      color: #555;
      margin-bottom: 14px;
      text-align: center;
    }


    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }


    input:focus {
      border-color: #2563eb;
    }


    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 25px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
    }


    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }


    .secondary {
      background: #64748b;
    }


    .hidden {
      display: none;
    }


    #recaptcha-container {
      margin: 10px 0 15px;
      display: flex;
      justify-content: center;
      min-height: 0;
    }


    #message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      line-height: 1.5;
    }


    .success {
      color: #15803d;
    }


    .error {
      color: #dc2626;
    }


    .warning {
      color: #b45309;
    }


    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #2563eb;
      text-decoration: none;
    }


    .login-link {
      text-align: center;
      margin-top: 18px;
    }


    .login-link a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }


    .phone-help {
      font-size: 12px;
      color: #666;
      margin: 2px 0 12px;
      line-height: 1.4;
    }

  </style>

</head>


<body>


<div class="signup-box">


  <div class="logo">
    Zemivo
  </div>


  <h2>
    Create Your Account
  </h2>


  <!-- STEP 1 -->

  <div id="step1">


    <div class="step">
      Step 1 of 2 — Account information
    </div>


    <form id="signupForm">


      <input
        id="fullName"
        type="text"
        placeholder="Full Name"
        autocomplete="name"
        maxlength="100"
        required
      >


      <input
        id="email"
        type="email"
        placeholder="Email Address"
        autocomplete="email"
        maxlength="254"
        required
      >


      <input
        id="birthDate"
        type="date"
        required
      >


      <input
        id="phone"
        type="tel"
        placeholder="Phone Number (example: +8801XXXXXXXXX)"
        autocomplete="tel"
        maxlength="20"
        required
      >


      <div class="phone-help">

        Enter your phone number in international format.

        Example: +8801XXXXXXXXX

      </div>


      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="new-password"
        minlength="12"
        maxlength="128"
        required
      >


      <input
        id="confirmPassword"
        type="password"
        placeholder="Confirm Password"
        autocomplete="new-password"
        minlength="12"
        maxlength="128"
        required
      >


      <button
        id="createButton"
        type="submit"
      >
        Create Account
      </button>


    </form>

  </div>


  <!-- STEP 2 -->

  <div
    id="step2"
    class="hidden"
  >


    <div class="step">
      Step 2 of 2 — Mobile verification
    </div>


    <p style="text-align:center;">

      We sent a verification code to your phone.

    </p>


    <input
      id="otp"
      type="text"
      inputmode="numeric"
      autocomplete="one-time-code"
      placeholder="Enter 6-digit OTP"
      maxlength="6"
    >


    <button
      id="verifyButton"
      type="button"
    >
      Verify Phone
    </button>


    <button
      id="resendButton"
      class="secondary"
      type="button"
    >
      Send OTP Again
    </button>


  </div>


  <div id="recaptcha-container"></div>


  <div id="message"></div>


  <a
    class="back"
    href="index.html"
  >
    ← Back to Zemivo
  </a>


  <div class="login-link">

    Already have an account?

    <a href="login.html">
      Log In
    </a>

  </div>


</div>



<script type="module">


  /*
   * =====================================================
   * ZEMIVO SIGNUP
   * =====================================================
   *
   * SECURITY:
   * Firebase App Check is initialized inside
   * zemivo-security.js BEFORE Firebase services.
   *
   * PAGE ISOLATION:
   * This page only uses Auth + its required Firestore
   * documents.
   *
   * FINANCIAL ISOLATION:
   * No wallet.
   * No ZMV ledger.
   * No payment credentials.
   * No admin access.
   *
   * 3D:
   * No direct modification of the Living 3D engine.
   * This page remains independent and 3D-ready.
   */


  /* =====================================================
     SECURITY FOUNDATION
  ===================================================== */

  import {
    auth,
    db
  } from "./zemivo-security.js";


  /* =====================================================
     FIREBASE AUTH
  ===================================================== */

  import {
    createUserWithEmailAndPassword,
    updateProfile,
    sendEmailVerification,
    RecaptchaVerifier,
    linkWithPhoneNumber
  } from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


  /* =====================================================
     FIRESTORE
  ===================================================== */

  import {
    doc,
    setDoc,
    serverTimestamp
  } from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  /* =====================================================
     ELEMENTS
  ===================================================== */

  const form =
    document.getElementById(
      "signupForm"
    );


  const message =
    document.getElementById(
      "message"
    );


  const createButton =
    document.getElementById(
      "createButton"
    );


  const verifyButton =
    document.getElementById(
      "verifyButton"
    );


  const resendButton =
    document.getElementById(
      "resendButton"
    );


  const step1 =
    document.getElementById(
      "step1"
    );


  const step2 =
    document.getElementById(
      "step2"
    );


  /* =====================================================
     STATE
  ===================================================== */

  let confirmationResult =
    null;


  let recaptchaVerifier =
    null;


  let pendingUserData =
    null;


  /* =====================================================
     MESSAGE
  ===================================================== */

  function showMessage(
    text,
    type = ""
  ) {

    message.textContent =
      text;

    message.className =
      type;

  }


  /* =====================================================
     SAFE TEXT NORMALIZATION
  ===================================================== */

  function cleanText(
    value,
    maxLength
  ) {

    return String(
      value || ""
    )
      .trim()
      .replace(/\s+/g, " ")
      .slice(
        0,
        maxLength
      );

  }


  /* =====================================================
     EMAIL NORMALIZATION
  ===================================================== */

  function cleanEmail(
    value
  ) {

    return String(
      value || ""
    )
      .trim()
      .toLowerCase()
      .slice(
        0,
        254
      );

  }


  /* =====================================================
     PHONE NORMALIZATION
  ===================================================== */

  function cleanPhone(
    value
  ) {

    return String(
      value || ""
    )
      .trim()
      .replace(
        /[\s()-]/g,
        ""
      )
      .slice(
        0,
        20
      );

  }


  /* =====================================================
     AGE
  ===================================================== */

  function calculateAge(
    birthDate
  ) {

    const today =
      new Date();


    const birth =
      new Date(
        birthDate +
        "T00:00:00"
      );


    if (
      Number.isNaN(
        birth.getTime()
      )
    ) {

      return -1;

    }


    let age =
      today.getFullYear() -
      birth.getFullYear();


    const month =
      today.getMonth() -
      birth.getMonth();


    if (
      month < 0 ||
      (
        month === 0 &&
        today.getDate() <
        birth.getDate()
      )
    ) {

      age--;

    }


    return age;

  }


  /* =====================================================
     PASSWORD STRENGTH
  ===================================================== */

  function isStrongPassword(
    password
  ) {

    if (
      password.length < 12
    ) {

      return false;

    }


    if (
      password.length > 128
    ) {

      return false;

    }


    const hasUpper =
      /[A-Z]/.test(
        password
      );


    const hasLower =
      /[a-z]/.test(
        password
      );


    const hasNumber =
      /[0-9]/.test(
        password
      );


    const hasSymbol =
      /[^A-Za-z0-9]/.test(
        password
      );


    return (
      hasUpper &&
      hasLower &&
      hasNumber &&
      hasSymbol
    );

  }


  /* =====================================================
     RECAPTCHA VERIFIER
     Used specifically for phone verification.
  ===================================================== */

  function setupRecaptcha() {

    if (
      recaptchaVerifier
    ) {

      return;

    }


    recaptchaVerifier =
      new RecaptchaVerifier(

        auth,

        "recaptcha-container",

        {

          size:
            "normal",


          callback:
            function() {

              showMessage(
                ""
              );

            },


          "expired-callback":
            function() {

              showMessage(
                "reCAPTCHA expired. Please complete it again.",
                "warning"
              );

            }

        }

      );

  }


  /* =====================================================
     SEND PHONE OTP
  ===================================================== */

  async function sendPhoneOTP() {

    setupRecaptcha();


    if (
      !pendingUserData
    ) {

      throw new Error(
        "Signup session not found."
      );

    }


    const user =
      auth.currentUser;


    if (!user) {

      throw new Error(
        "Your account session has expired. Please start again."
      );

    }


    confirmationResult =
      await linkWithPhoneNumber(

        user,

        pendingUserData.phone,

        recaptchaVerifier

      );

  }


  /* =====================================================
     SIGN UP
  ===================================================== */

  form.addEventListener(

    "submit",

    async function(event) {


      event.preventDefault();


      showMessage(
        ""
      );


      /* ================================
         GET INPUT
      ================================= */

      const name =
        cleanText(

          document
            .getElementById(
              "fullName"
            )
            .value,

          100

        );


      const email =
        cleanEmail(

          document
            .getElementById(
              "email"
            )
            .value

        );


      const birthDate =
        document
          .getElementById(
            "birthDate"
          )
          .value;


      const phone =
        cleanPhone(

          document
            .getElementById(
              "phone"
            )
            .value

        );


      const password =
        document
          .getElementById(
            "password"
          )
          .value;


      const confirmPassword =
        document
          .getElementById(
            "confirmPassword"
          )
          .value;


      /* ================================
         NAME VALIDATION
      ================================= */

      if (
        name.length < 2
      ) {

        showMessage(
          "Please enter your full name.",
          "error"
        );

        return;

      }


      /* ================================
         EMAIL VALIDATION
      ================================= */

      if (
        !email ||
        !email.includes("@")
      ) {

        showMessage(
          "Please enter a valid email address.",
          "error"
        );

        return;

      }


      /* ================================
         BIRTH DATE
      ================================= */

      if (
        !birthDate
      ) {

        showMessage(
          "Please enter your date of birth.",
          "error"
        );

        return;

      }


      const age =
        calculateAge(
          birthDate
        );


      if (
        age < 18
      ) {

        showMessage(
          "Sorry. You must be 18 or older to create a Zemivo account.",
          "error"
        );

        return;

      }


      if (
        age > 120
      ) {

        showMessage(
          "Please enter a valid date of birth.",
          "error"
        );

        return;

      }


      /* ================================
         PHONE
      ================================= */

      if (
        !/^\+[1-9][0-9]{7,18}$/.test(
          phone
        )
      ) {

        showMessage(
          "Please enter a valid international phone number.",
          "error"
        );

        return;

      }


      /* ================================
         PASSWORD
      ================================= */

      if (
        !isStrongPassword(
          password
        )
      ) {

        showMessage(
          "Password must be 12+ characters and include uppercase, lowercase, number and symbol.",
          "error"
        );

        return;

      }


      if (
        password !==
        confirmPassword
      ) {

        showMessage(
          "Passwords do not match.",
          "error"
        );

        return;

      }


      /* ================================
         LOCK BUTTON
      ================================= */

      createButton.disabled =
        true;


      createButton.textContent =
        "Creating Account...";


      try {


        /* ================================
           CREATE AUTH ACCOUNT
        ================================= */

        const userCredential =
          await createUserWithEmailAndPassword(

            auth,

            email,

            password

          );


        const user =
          userCredential.user;


        /* ================================
           SAVE DISPLAY NAME
        ================================= */

        await updateProfile(

          user,

          {

            displayName:
              name

          }

        );


        /* ================================
           EMAIL VERIFICATION
        ================================= */

        await sendEmailVerification(
          user
        );


        /* ================================
           TEMPORARY SIGNUP STATE
        ================================= */

        pendingUserData = {

          uid:
            user.uid,

          name:
            name,

          email:
            email,

          phone:
            phone,

          birthDate:
            birthDate

        };


        /* ================================
           PHONE OTP
        ================================= */

        await sendPhoneOTP();


        /* ================================
           MOVE TO STEP 2
        ================================= */

        step1.classList.add(
          "hidden"
        );


        step2.classList.remove(
          "hidden"
        );


        showMessage(
          "Verification code sent. Please enter the OTP.",
          "success"
        );


      }
      catch(error) {


        console.error(
          "Zemivo signup error:",
          error
        );


        let errorMessage =
          "Account creation failed. Please try again.";


        switch (
          error.code
        ) {


          case
          "auth/email-already-in-use":

            errorMessage =
              "This email is already registered.";

            break;


          case
          "auth/invalid-email":

            errorMessage =
              "Please enter a valid email address.";

            break;


          case
          "auth/invalid-phone-number":

            errorMessage =
              "Please enter a valid international phone number.";

            break;


          case
          "auth/phone-number-already-in-use":

            errorMessage =
              "This phone number is already linked to another account.";

            break;


          case
          "auth/provider-already-linked":

            errorMessage =
              "This phone number is already linked to this account.";

            break;


          case
          "auth/too-many-requests":

            errorMessage =
              "Too many attempts. Please wait and try again.";

            break;


          case
          "auth/network-request-failed":

            errorMessage =
              "Network problem. Please try again.";

            break;


          case
          "auth/operation-not-allowed":

            errorMessage =
              "Phone authentication is not enabled in Firebase.";

            break;


          case
          "auth/quota-exceeded":

            errorMessage =
              "SMS verification limit has been reached. Please try again later.";

            break;


          default:

            /*
             * Do not expose sensitive internal details
             * to normal users.
             */

            errorMessage =
              "Account creation failed. Please check your information and try again.";

        }


        showMessage(
          errorMessage,
          "error"
        );


        createButton.disabled =
          false;


        createButton.textContent =
          "Create Account";

      }

    }

  );


  /* =====================================================
     VERIFY OTP
  ===================================================== */

  verifyButton.addEventListener(

    "click",

    async function() {


      const otp =
        document
          .getElementById(
            "otp"
          )
          .value
          .trim();


      if (
        !/^[0-9]{6}$/.test(
          otp
        )
      ) {

        showMessage(
          "Please enter the 6-digit OTP.",
          "error"
        );

        return;

      }


      verifyButton.disabled =
        true;


      verifyButton.textContent =
        "Verifying...";


      try {


        if (
          !confirmationResult
        ) {

          throw new Error(
            "No OTP verification session found."
          );

        }


        /* ================================
           CONFIRM PHONE
        ================================= */

        await confirmationResult.confirm(
          otp
        );


        const user =
          auth.currentUser;


        if (
          !user
        ) {

          throw new Error(
            "User session not found."
          );

        }


        await user.reload();


        const updatedUser =
          auth.currentUser;


        if (
          !updatedUser ||
          !updatedUser.phoneNumber
        ) {

          throw new Error(
            "Phone verification was not completed."
          );

        }


        /* ================================
           PUBLIC PROFILE
        ================================= */

        await setDoc(

          doc(
            db,
            "profiles",
            updatedUser.uid
          ),

          {

            uid:
              updatedUser.uid,

            displayName:
              pendingUserData.name,

            createdAt:
              serverTimestamp(),

            accountStatus:
              "active",

            role:
              "user"

          }

        );


        /* ================================
           PRIVATE ACCOUNT DATA
        ================================= */

        await setDoc(

          doc(
            db,
            "users",
            updatedUser.uid,
            "private",
            "account"
          ),

          {

            uid:
              updatedUser.uid,

            email:
              pendingUserData.email,

            phone:
              updatedUser.phoneNumber,

            birthDate:
              pendingUserData.birthDate,

            emailVerified:
              updatedUser.emailVerified,

            phoneVerified:
              true,

            createdAt:
              serverTimestamp()

          }

        );


        /* ================================
           SUCCESS
        ================================= */

        showMessage(
          "Account created and phone verified successfully.",
          "success"
        );


        setTimeout(

          function() {

            window.location.href =
              "profile.html";

          },

          1200

        );


      }
      catch(error) {


        console.error(
          "Zemivo OTP verification error:",
          error
        );


        let errorMessage =
          "OTP verification failed. Please try again.";


        switch (
          error.code
        ) {


          case
          "auth/invalid-verification-code":

            errorMessage =
              "The OTP is incorrect.";

            break;


          case
          "auth/code-expired":

            errorMessage =
              "The OTP has expired. Please request a new one.";

            break;


          case
          "auth/credential-already-in-use":

            errorMessage =
              "This phone number is already linked to another account.";

            break;


          case
          "permission-denied":

            errorMessage =
              "Account setup was blocked by security rules.";

            break;


          default:

            errorMessage =
              "OTP verification failed. Please check the code and try again.";

        }


        showMessage(
          errorMessage,
          "error"
        );


        verifyButton.disabled =
          false;


        verifyButton.textContent =
          "Verify Phone";

      }

    }

  );


  /* =====================================================
     RESEND OTP
  ===================================================== */

  resendButton.addEventListener(

    "click",

    async function() {


      resendButton.disabled =
        true;


      resendButton.textContent =
        "Sending...";


      try {


        if (
          !pendingUserData
        ) {

          throw new Error(
            "Signup session not found."
          );

        }


        confirmationResult =
          null;


        if (
          recaptchaVerifier
        ) {

          try {

            recaptchaVerifier.clear();

          }
          catch(e) {

            console.warn(
              "reCAPTCHA cleanup warning:",
              e
            );

          }


          recaptchaVerifier =
            null;

        }


        await sendPhoneOTP();


        showMessage(
          "A new OTP has been sent.",
          "success"
        );


      }
      catch(error) {


        console.error(
          "Zemivo OTP resend error:",
          error
        );


        showMessage(
          "Could not resend OTP. Please try again later.",
          "error"
        );

      }


      resendButton.disabled =
        false;


      resendButton.textContent =
        "Send OTP Again";

    }

  );


</script>


</body>

</html>
