<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Zemivo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .signup-box {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 30px 25px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: bold;
      color: #2563eb;
      margin-bottom: 8px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    .create {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 25px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #2563eb;
      text-decoration: none;
    }

    .note {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-top: 18px;
    }
  </style>
</head>

<body>

  <div class="signup-box">

    <div class="logo">Zemivo</div>

    <h2>Create Your Account</h2>

    <form>
      <input type="text" placeholder="Full Name">

      <input type="email" placeholder="Email Address">

      <input type="password" placeholder="Password">

      <input type="password" placeholder="Confirm Password">

      <button class="create" type="button">
        Create Account
      </button>
    </form>

    <a class="back" href="index.html">
      ← Back to Zemivo
    </a>

    <p class="note">
      Join Zemivo and start building your community.
    </p>

  </div>
<p>
  Already have an account?
  <a href="login.html">Log In</a>
</p>
</body>
</html>
