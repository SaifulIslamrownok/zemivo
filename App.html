<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zemivo App</title>
  <style>
    body{font-family:Arial;background:#f4f6f8;margin:0;color:#222}
    .topbar{background:white;padding:18px;text-align:center;box-shadow:0 2px 8px #ddd}
    .logo{font-size:28px;font-weight:bold;color:#2563eb}
    .container{max-width:700px;margin:25px auto;padding:15px}
    .card{background:white;padding:25px;border-radius:15px;margin-bottom:18px;box-shadow:0 2px 8px #ddd;text-align:center}
    h1{color:#2563eb}
    .button{display:inline-block;background:#2563eb;color:white;padding:12px 22px;border-radius:25px;text-decoration:none;font-weight:bold;margin-top:10px}
    .icon{font-size:60px}
  </style>
</head>
<body>

<header class="topbar">
  <div class="logo">Zemivo</div>
</header>

<main class="container">

  <div class="card">
    <div class="icon">📱</div>
    <h1>Zemivo App</h1>
    <p>Connect, create and earn from anywhere.</p>

    <a class="button" href="#">
      Download App
    </a>
  </div>

  <div class="card">
    <h2>🚀 Coming Soon</h2>
    <p>The official Zemivo Android app will be available here in the future.</p>
  </div>

</main>

</body>
</html>
