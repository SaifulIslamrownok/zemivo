<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff">
<title>Zemivo | Profile</title>
<style>
:root{--blue:#1877f2;--ink:#17191d;--muted:#65676b;--line:#e4e6eb;--page:#f0f2f5}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--page);color:var(--ink);font-family:Arial,Helvetica,sans-serif;padding-bottom:78px}
button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #8bbcff;outline-offset:2px}
.topbar{height:56px;position:sticky;top:0;z-index:30;background:#fff;display:flex;align-items:center;gap:12px;padding:0 max(12px,calc((100% - 1000px)/2));border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto;font-weight:800;font-size:22px;color:var(--blue)}.brand-mark{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#20c9ed,#1769ff 65%,#8057ff)}
.icon-btn{width:40px;height:40px;border:0;border-radius:50%;background:#f0f2f5;color:#30343b;font-size:21px;display:grid;place-items:center}
.page{max-width:1000px;margin:auto}.profile-shell{background:#fff;box-shadow:0 1px 2px #0001}
.cover{height:clamp(190px,34vw,350px);position:relative;background:linear-gradient(130deg,#17356e,#3188d8 50%,#8d78ed) center/cover}
.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,#0003)}
.cover-label{position:absolute;z-index:1;top:18px;left:20px;color:white;font-size:12px;letter-spacing:2px;font-weight:800;text-shadow:0 1px 5px #0008}
.cover-button{position:absolute;z-index:2;right:14px;bottom:14px;background:#fff;border:0;border-radius:9px;padding:9px 12px;font-weight:700}
.identity{padding:0 24px 15px;position:relative}.identity-row{display:flex;align-items:flex-end;gap:16px;margin-top:-68px;position:relative;z-index:3}
.avatar-wrap{position:relative;flex:0 0 auto}.avatar{width:148px;height:148px;border:5px solid white;border-radius:50%;background:linear-gradient(140deg,#5bd8f4,#4674ff 55%,#9d6dff) center/cover;display:grid;place-items:center;color:white;font-size:44px;font-weight:800;box-shadow:0 1px 3px #0002;overflow:hidden}
.camera{position:absolute;right:3px;bottom:6px;width:40px;height:40px;border:2px solid white;border-radius:50%;background:#e4e6eb;font-size:18px}
.note{position:absolute;z-index:4;left:110px;top:-47px;border:0;border-radius:24px;background:#fff;padding:12px 17px;box-shadow:0 1px 5px #0002;color:#606770}
.identity-main{min-width:0;flex:1;padding-bottom:4px}.name-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.profile-name{font-size:clamp(24px,4vw,34px);font-weight:800;line-height:1.15;margin:0;overflow-wrap:anywhere}
.verified{color:#fff;background:#1877f2;border-radius:50%;font-size:12px;width:21px;height:21px;display:grid;place-items:center}.follow-meta{font-size:15px;font-weight:700;color:var(--muted);margin-top:7px}.bio{margin:8px 0 0;color:#42464d;font-size:14px;line-height:1.45}
.identity-actions{display:flex;gap:9px;margin:16px 0 0}.btn{border:0;border-radius:9px;padding:10px 15px;min-height:42px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn-blue{background:var(--blue);color:#fff}.btn-grey{background:#e4e6eb;color:#17191d}.btn-icon{width:46px;padding:0;font-size:19px}
.profile-tabs{display:flex;gap:4px;overflow-x:auto;padding:9px 16px 0;border-top:1px solid var(--line);scrollbar-width:none}.profile-tabs::-webkit-scrollbar,.friends-strip::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:var(--muted);padding:13px 18px;font-weight:750;white-space:nowrap;border-bottom:3px solid transparent}.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.content{display:grid;grid-template-columns:minmax(250px,.82fr) minmax(0,1.45fr);gap:16px;padding:16px 0}.column{min-width:0}.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px #0001}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.card-head h2{font-size:20px;margin:0;font-weight:800}.link-btn{border:0;background:transparent;color:var(--blue);font-weight:700;padding:6px}
.details{display:grid;gap:14px}.detail{display:flex;align-items:center;gap:12px;font-size:15px;line-height:1.35}.detail-icon{width:38px;height:38px;border-radius:50%;background:#f0f2f5;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.friends-strip{display:flex;gap:12px;overflow-x:auto;padding:2px 0 8px}.friend{width:108px;flex:0 0 108px;text-align:center}.friend-photo{width:100%;aspect-ratio:1;border-radius:50%;background:linear-gradient(145deg,#d7f3ff,#c9d5ff,#eadbff) center/cover;display:grid;place-items:center;color:#4162ad;font-size:27px;border:1px solid var(--line)}
.friend-name{font-weight:700;font-size:14px;margin-top:7px;overflow-wrap:anywhere}.friend-mutual{font-size:12px;color:var(--muted);margin-top:4px}
.composer-row{display:flex;align-items:center;gap:10px}.mini-avatar{width:42px;height:42px;flex:0 0 42px;border-radius:50%;background:linear-gradient(140deg,#4dd9f4,#4a6dff,#a96bff) center/cover;display:grid;place-items:center;color:#fff;font-weight:800}
.composer-open{flex:1;text-align:left;border:0;border-radius:24px;background:#f0f2f5;padding:13px 16px;color:#65676b}.composer-tools{display:flex;gap:9px;border-top:1px solid var(--line);padding-top:12px;margin-top:12px;flex-wrap:wrap}
.tool-btn{flex:1;min-width:100px;border:1px solid var(--line);background:#fff;border-radius:22px;padding:9px 12px;font-weight:700;color:#34373c}.manage-btn{width:100%;margin-top:14px}
.post{padding:0;overflow:hidden}.post-head{display:flex;align-items:center;gap:10px;padding:14px 16px}.post-author{font-weight:800}.post-time{font-size:12px;color:var(--muted);margin-top:3px}.post-menu{margin-left:auto;border:0;background:transparent;font-size:22px;color:var(--muted)}
.post-text{padding:0 16px 14px;white-space:pre-wrap;overflow-wrap:anywhere}.post-image{display:block;width:100%;height:auto;max-height:650px;object-fit:contain;background:#f0f2f5}
.post-stats{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px;padding:9px 14px;border-bottom:1px solid var(--line)}.post-actions{display:flex;gap:4px;padding:6px 10px}.post-action{flex:1;border:0;background:#fff;border-radius:7px;padding:10px 4px;color:#606770;font-weight:700}.post-action.liked{color:var(--blue)}
.comment-preview{padding:8px 14px 12px}.comment-bubble{display:inline-block;background:#f0f2f5;border-radius:16px;padding:9px 12px;font-size:14px;margin:3px 0}.comment-compose{display:flex;gap:8px;align-items:center;margin-top:10px}.comment-input{flex:1;min-width:0;border:0;border-radius:20px;background:#f0f2f5;padding:11px 14px}
.empty{text-align:center;color:var(--muted);padding:25px 12px}.bottom-nav{position:fixed;z-index:40;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:7px max(6px,calc((100% - 1000px)/2)) calc(7px + env(safe-area-inset-bottom))}
.nav-btn{flex:1;max-width:150px;border:0;background:#fff;color:#34373c;border-radius:9px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:22px}.nav-btn span{font-size:10px;font-weight:700}.nav-btn.active{color:var(--blue)}
.toast{position:fixed;z-index:70;left:50%;bottom:90px;transform:translateX(-50%);background:#202124;color:#fff;padding:11px 15px;border-radius:10px;display:none;max-width:calc(100% - 28px);font-size:14px}.toast.show{display:block}
.modal-backdrop{position:fixed;inset:0;z-index:60;background:#0008;display:none;align-items:center;justify-content:center;padding:14px}.modal-backdrop.open{display:flex}.modal{width:min(540px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:14px;padding:18px;box-shadow:0 12px 40px #0004}
.modal-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px}.modal-head h2{margin:0;font-size:20px}.close{border:0;border-radius:50%;width:36px;height:36px;background:#f0f2f5;font-size:22px}
.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;font-weight:750}.field input,.field textarea{width:100%;border:1px solid #ccd0d5;border-radius:9px;padding:11px;background:#fff}.field textarea{min-height:90px;resize:vertical}.modal-actions{display:flex;gap:8px;margin-top:16px}.modal-actions .btn{flex:1}.menu-list{display:grid;gap:8px}.menu-item{border:0;background:#f0f2f5;border-radius:9px;padding:13px;text-align:left;font-weight:700}
@media(max-width:700px){
 body{background:#fff;padding-bottom:75px}.topbar{height:54px;padding:0 10px}.page{width:100%}.profile-shell{box-shadow:none}.cover{height:clamp(175px,54vw,245px)}
 .identity{padding:0 14px 14px}.identity-row{margin-top:-58px;gap:10px;align-items:flex-end}.avatar{width:116px;height:116px;font-size:36px}.note{left:80px;top:-43px;padding:10px 13px;font-size:13px}
 .profile-name{font-size:clamp(21px,6vw,28px)}.follow-meta{font-size:13px}.bio{font-size:13px}.identity-actions{margin-top:13px;gap:7px}.identity-actions .btn{flex:1;padding:9px 8px;font-size:14px;min-height:42px}.identity-actions .btn-icon{flex:0 0 44px}
 .profile-tabs{padding:7px 8px 0;gap:0}.tab{padding:12px 14px;font-size:15px}.content{display:flex;flex-direction:column;gap:0;padding:10px 0}.column{display:contents}.about-card{order:1}.friends-card{order:2}.posts-column{order:3}
 .card{border-radius:0;box-shadow:none;border-bottom:8px solid var(--page);margin:0;padding:15px}.card-head h2{font-size:19px}.friend{width:92px;flex-basis:92px}.friend-name{font-size:13px}.composer-tools{justify-content:flex-start}.tool-btn{flex:0 1 auto;min-width:105px}.post-image{max-height:none}
 .bottom-nav{justify-content:space-around;gap:2px;padding-left:4px;padding-right:4px}.nav-btn{max-width:none;font-size:22px}.nav-btn span{font-size:9px}
}
@media(max-width:370px){.identity-row{gap:7px}.avatar{width:100px;height:100px}.profile-name{font-size:20px}.follow-meta{font-size:12px}.identity-actions .btn{font-size:12px}.tab{padding-left:11px;padding-right:11px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="topbar">
 <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
 <div class="brand"><span class="brand-mark">Z</span><span>Zemivo</span></div>
 <button class="icon-btn" id="searchBtn" aria-label="Search">⌕</button>
 <button class="icon-btn" id="moreTopBtn" aria-label="More">•••</button>
</header>
<main class="page">
<section class="profile-shell">
 <div class="cover" id="cover"><div class="cover-label">YOUR WORLD. YOUR VOICE.</div><button class="cover-button" id="coverUploadBtn">📷 Change cover</button></div>
 <div class="identity">
  <div class="identity-row">
   <div class="avatar-wrap"><div class="avatar" id="avatar">Z</div><button class="camera" id="avatarUploadBtn" aria-label="Change profile picture">📷</button></div>
   <button class="note" id="noteBtn">Share a note...</button>
   <div class="identity-main"><div class="name-line"><h1 class="profile-name" id="profileName">Your Name</h1><span class="verified" title="Zemivo member">✓</span></div><div class="follow-meta" id="followMeta">0 followers · 0 following</div><p class="bio" id="bioText">Add a short introduction so people can get to know you.</p></div>
  </div>
  <div class="identity-actions"><button class="btn btn-blue" id="dashboardBtn">▥ Dashboard</button><button class="btn btn-grey" id="createBtn">＋ Create</button><button class="btn btn-grey btn-icon" id="editTopBtn" aria-label="Edit profile">✎</button></div>
 </div>
 <nav class="profile-tabs" aria-label="Profile sections"><button class="tab active" data-tab="all">All</button><button class="tab" data-tab="reels">Reels</button><button class="tab" data-tab="photos">Photos</button><button class="tab" id="moreTabBtn">More ▾</button></nav>
</section>
<div class="content">
 <aside class="column">
  <section class="card about-card"><div class="card-head"><h2>At a glance</h2><button class="link-btn" id="editDetailsBtn">Edit</button></div><div class="details" id="detailsList"><div class="empty">Add personal details to your profile.</div></div></section>
  <section class="card friends-card"><div class="card-head"><h2>Friends</h2><button class="link-btn" id="seeFriendsBtn">See all</button></div><div class="friends-strip" id="friendsList"><div class="empty">Your friends will appear here when connected.</div></div></section>
 </aside>
 <section class="column posts-column">
  <section class="card"><div class="card-head"><h2 id="postsHeading">All posts</h2><button class="link-btn" id="filterBtn">Filters</button></div>
   <div class="composer-row"><div class="mini-avatar" id="miniAvatar">Z</div><button class="composer-open" id="composerOpen">What's on your mind?</button><button class="link-btn" id="photoPostBtn" aria-label="Add photo">▧</button></div>
   <div class="composer-tools"><button class="tool-btn" id="reelBtn">▣ Reel</button><button class="tool-btn" id="liveBtn">◉ Live</button><button class="tool-btn" id="feelingBtn">☺ Feeling</button></div>
   <button class="btn btn-grey manage-btn" id="managePostsBtn">▤ Manage posts</button>
  </section>
  <section id="postsList"></section>
 </section>
</div>
</main>
<nav class="bottom-nav" aria-label="Main navigation">
 <button class="nav-btn" data-nav="Home">⌂<span>Home</span></button><button class="nav-btn" data-nav="Reels">▣<span>Reels</span></button><button class="nav-btn" data-nav="Friends">♧<span>Friends</span></button><button class="nav-btn" data-nav="Marketplace">▤<span>Market</span></button><button class="nav-btn" data-nav="Notifications">♧<span>Alerts</span></button><button class="nav-btn active" data-nav="Profile">◉<span>Profile</span></button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><div class="modal-head"><h2 id="modalTitle">Profile</h2><button class="close" id="closeModal" aria-label="Close">×</button></div><div id="modalBody"></div></div></div>
<input type="file" id="avatarFile" accept="image/*" hidden><input type="file" id="coverFile" accept="image/*" hidden><input type="file" id="postFile" accept="image/*" hidden>
<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id),KEY="zemivo_profile_demo_v3";
const defaults={name:"Your Name",bio:"Add a short introduction so people can get to know you.",location:"",occupation:"",relationship:"",website:"",followers:0,following:0,avatar:"",cover:"",posts:[],friends:[],activeTab:"all",note:""};
let state=load(),filter="all",timer;
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||"{}");return {...defaults,...x,posts:Array.isArray(x.posts)?x.posts:[],friends:Array.isArray(x.friends)?x.friends:[]}}catch(e){return {...defaults}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast("ব্রাউজারের জায়গা পূর্ণ। ছোট ছবি ব্যবহার করুন বা পুরোনো পোস্ট মুছুন।")}}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(s){$("toast").textContent=s;$("toast").classList.add("show");clearTimeout(timer);timer=setTimeout(()=>$("toast").classList.remove("show"),2600)}
function initials(s){const a=String(s||"Z").trim().split(/\s+/).filter(Boolean);return (a.length>1?a[0][0]+a[a.length-1][0]:a[0]?.[0]||"Z").toUpperCase()}
function setPic(el,url,fallback){el.style.backgroundImage=url?`url("${url}")`:"";el.textContent=url?"":fallback}
function safeURL(s){s=String(s||"").trim();if(/^https?:\/\//i.test(s))return s;if(/^[\w.-]+\.[a-z]{2,}/i.test(s))return "https://"+s;return ""}
function render(){
 $("profileName").textContent=state.name||"Your Name";$("bioText").textContent=state.bio||"";
 $("followMeta").textContent=`${Number(state.followers)||0} followers · ${Number(state.following)||0} following`;
 setPic($("avatar"),state.avatar,initials(state.name));setPic($("miniAvatar"),state.avatar,initials(state.name));
 $("cover").style.backgroundImage=state.cover?`url("${state.cover}")`:"";$("noteBtn").textContent=state.note||"Share a note...";
 const d=[["⌖","Lives in",state.location],["▣","Work",state.occupation],["♡","Relationship",state.relationship],["↗","Website",state.website]].filter(x=>x[2]);
 $("detailsList").innerHTML=d.length?d.map(([i,l,v])=>{const u=l==="Website"?safeURL(v):"";return `<div class="detail"><span class="detail-icon">${i}</span><div><strong>${esc(l)}</strong><br>${u?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(v)}</a>`:esc(v)}</div></div>`}).join(""):'<div class="empty">No personal details added yet.</div>';
 $("friendsList").innerHTML=state.friends.length?state.friends.map(f=>`<div class="friend"><div class="friend-photo" ${f.photo?`style="background-image:url('${f.photo}')"`:""}>${f.photo?"":esc(initials(f.name))}</div><div class="friend-name">${esc(f.name)}</div><div class="friend-mutual">${Number(f.mutual)||0} mutual friends</div></div>`).join(""):'<div class="empty">Your friends will appear here when connected.</div>';
 document.querySelectorAll(".tab[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===state.activeTab));
 $("postsHeading").textContent=state.activeTab==="reels"?"Reels":state.activeTab==="photos"?"Photos":"All posts";renderPosts();
}
function renderPosts(){
 let posts=state.posts.slice().reverse();if(state.activeTab==="reels")posts=posts.filter(p=>p.type==="reel");if(state.activeTab==="photos")posts=posts.filter(p=>p.image);if(filter==="withPhoto")posts=posts.filter(p=>p.image);if(filter==="textOnly")posts=posts.filter(p=>!p.image);
 $("postsList").innerHTML=posts.length?posts.map(p=>`<article class="card post">
 <div class="post-head"><div class="mini-avatar" ${state.avatar?`style="background-image:url('${state.avatar}')"`:""}>${state.avatar?"":esc(initials(state.name))}</div><div><div class="post-author">${esc(state.name||"Your Name")}${p.type==="reel"?" · Reel":""}</div><div class="post-time">${esc(new Date(p.createdAt).toLocaleString())} · 🌐 Public</div></div><button class="post-menu" data-menu="${esc(p.id)}">•••</button></div>
 ${p.text?`<div class="post-text">${esc(p.text)}</div>`:""}${p.image?`<img class="post-image" src="${p.image}" alt="Post image" loading="lazy">`:""}
 <div class="post-stats"><span>👍 ${Number(p.likes)||0} likes</span><span>${(p.comments||[]).length} comments · ${Number(p.views)||0} views</span></div>
 <div class="post-actions"><button class="post-action ${p.liked?"liked":""}" data-like="${esc(p.id)}">${p.liked?"👍 Liked":"♡ Like"}</button><button class="post-action" data-focus-comment="${esc(p.id)}">▢ Comment</button><button class="post-action" data-share="${esc(p.id)}">↗ Share</button></div>
 <div class="comment-preview">${(p.comments||[]).slice(-2).map(c=>`<div class="comment-bubble"><strong>${esc(c.name)}</strong> ${esc(c.text)}</div>`).join("")}<div class="comment-compose"><input class="comment-input" data-input="${esc(p.id)}" placeholder="Write a comment..."><button class="link-btn" data-send="${esc(p.id)}">➤</button></div></div></article>`).join(""):'<section class="card empty"><strong>No posts yet</strong><p>Your content will appear here after you create a post.</p><button class="btn btn-blue" id="firstPost">＋ Create your first post</button></section>';
 $("firstPost")?.addEventListener("click",()=>composer());
}
function modal(title,html){$("modalTitle").textContent=title;$("modalBody").innerHTML=html;$("modalBackdrop").classList.add("open");document.body.style.overflow="hidden"}
function close(){ $("modalBackdrop").classList.remove("open");document.body.style.overflow=""}
function field(label,id,value="",placeholder=""){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" value="${esc(value)}" placeholder="${esc(placeholder)}"></div>`}
function edit(){
 modal("Edit profile",`${field("Name","eName",state.name)}<div class="field"><label for="eBio">Bio</label><textarea id="eBio">${esc(state.bio)}</textarea></div>${field("Location","eLocation",state.location,"City, country")}${field("Work / Creator role","eWork",state.occupation,"Digital creator")}${field("Relationship","eRelationship",state.relationship,"Optional")}${field("Website","eWebsite",state.website,"https://example.com")}<div class="modal-actions"><button class="btn btn-grey" id="cancel">Cancel</button><button class="btn btn-blue" id="save">Save changes</button></div>`);
 $("cancel").onclick=close;$("save").onclick=()=>{const n=$("eName").value.trim();if(!n){toast("নাম লিখুন।");$("eName").focus();return}state.name=n;state.bio=$("eBio").value.trim();state.location=$("eLocation").value.trim();state.occupation=$("eWork").value.trim();state.relationship=$("eRelationship").value.trim();state.website=$("eWebsite").value.trim();save();render();close();toast("প্রোফাইল এই ব্রাউজারে সংরক্ষিত হয়েছে।")};
}
function compress(file,max,quality){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=reject;r.onload=()=>{const im=new Image();im.onerror=reject;im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const ctx=c.getContext("2d");if(!ctx){reject(Error("Canvas unavailable"));return}ctx.drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",quality))};im.src=r.result};r.readAsDataURL(file)})}
function pick(inputId,max,cb){const el=$(inputId);el.onchange=async()=>{const f=el.files?.[0];if(!f)return;if(!f.type.startsWith("image/")){toast("ছবির ফাইল নির্বাচন করুন।");el.value="";return}try{cb(await compress(f,max,.78));save();render();toast("ছবি এই ব্রাউজারে সংরক্ষিত হয়েছে।")}catch(e){toast("ছবি পড়া যায়নি। আবার চেষ্টা করুন।")}el.value=""};el.click()}
function composer(type="post"){
 let image="";modal(type==="reel"?"Create a Reel":type==="live"?"Go Live":type==="feeling"?"Share a feeling":"Create post",`<div class="field"><label for="pText">What's on your mind?</label><textarea id="pText" placeholder="Write something to share..."></textarea></div><div class="field"><label>Photo (optional)</label><button class="btn btn-grey" id="choosePhoto">▧ Choose photo</button><span id="photoStatus" class="post-time">No photo selected</span></div>${type==="live"?'<p class="post-time">Real live streaming needs a secure streaming service and backend.</p>':""}<div class="modal-actions"><button class="btn btn-grey" id="pCancel">Cancel</button><button class="btn btn-blue" id="pPublish">${type==="live"?"Continue":"Post"}</button></div>`);
 $("pCancel").onclick=close;$("choosePhoto").onclick=()=>$("postFile").click();$("postFile").onchange=async()=>{const f=$("postFile").files?.[0];if(!f)return;try{image=await compress(f,1400,.78);$("photoStatus").textContent="Photo selected"}catch(e){toast("ছবি পড়া যায়নি।")} $("postFile").value=""};
 $("pPublish").onclick=()=>{if(type==="live"){close();toast("Live-এর জন্য backend ও streaming service প্রয়োজন।");return}const text=$("pText").value.trim();if(!text&&!image){toast("পোস্টের লেখা বা ছবি যোগ করুন।");return}state.posts.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),text,image,type:type==="reel"?"reel":"post",createdAt:new Date().toISOString(),likes:0,liked:false,comments:[],views:0});save();state.activeTab=type==="reel"?"reels":"all";filter="all";render();close();toast("পোস্ট এই ব্রাউজারে সংরক্ষিত হয়েছে।")};
}
async function share(){const url=location.href;try{if(navigator.share)await navigator.share({title:`${state.name} on Zemivo`,text:state.bio,url});else if(navigator.clipboard){await navigator.clipboard.writeText(url);toast("প্রোফাইল লিংক কপি হয়েছে।")}else toast(url)}catch(e){if(e.name!=="AbortError")toast("শেয়ার করা যায়নি।")}}
function menu(title,items){modal(title,`<div class="menu-list">${items.map(([t,a])=>`<button class="menu-item" data-action="${esc(a)}">${t}</button>`).join("")}</div>`);$("modalBody").querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>{const a=b.dataset.action;close();action(a)})}
function action(a){
 if(a==="edit")edit();else if(a==="share")share();else if(a==="post")composer();else if(a==="reel")composer("reel");else if(a==="live")composer("live");else if(a==="feeling")composer("feeling");
 else if(a==="withPhoto"||a==="textOnly"||a==="clear"){filter=a==="clear"?"all":a;renderPosts()}
 else if(a==="saved"||a==="settings")toast("এই অংশটি মূল Zemivo অ্যাপের সঙ্গে যুক্ত করতে হবে।");
 else if(a.startsWith("delete:")){state.posts=state.posts.filter(p=>p.id!==a.slice(7));save();render();toast("পোস্ট মুছে ফেলা হয়েছে।")}
 else if(a.startsWith("nav:"))nav(a.slice(4));
}
function nav(name){if(name==="Profile")window.scrollTo({top:0,behavior:"smooth"});else toast(`${name} পেজটি মূল navigation-এর সঙ্গে যুক্ত করতে হবে।`)}
function dashboard(){modal("Creator Dashboard",`<div class="details"><div class="detail"><span class="detail-icon">♡</span><strong>${Number(state.followers)||0} followers</strong></div><div class="detail"><span class="detail-icon">▣</span><strong>${state.posts.length} posts</strong></div></div><p class="post-time">Creator earnings ও analytics-এর জন্য shared Zemivo backend প্রয়োজন।</p><div class="modal-actions"><button class="btn btn-blue" id="dashClose">Close</button></div>`);$("dashClose").onclick=close}
function comment(id){const input=document.querySelector(`[data-input="${CSS.escape(id)}"]`),text=input?.value.trim();if(!text){toast("কমেন্ট লিখুন।");return}const p=state.posts.find(x=>x.id===id);if(!p)return;p.comments=Array.isArray(p.comments)?p.comments:[];p.comments.push({name:state.name||"You",text});save();renderPosts();toast("কমেন্ট এই ব্রাউজারে সংরক্ষিত হয়েছে।")}
document.querySelectorAll(".tab[data-tab]").forEach(b=>b.onclick=()=>{state.activeTab=b.dataset.tab;filter="all";save();render()});
$("moreTabBtn").onclick=()=>menu("More profile sections",[["Posts with photos","withPhoto"],["Text-only posts","textOnly"],["Clear filters","clear"],["Saved items","saved"],["Settings","settings"]]);
$("editTopBtn").onclick=edit;$("editDetailsBtn").onclick=edit;$("avatarUploadBtn").onclick=()=>pick("avatarFile",900,v=>state.avatar=v);$("coverUploadBtn").onclick=()=>pick("coverFile",1800,v=>state.cover=v);
$("dashboardBtn").onclick=dashboard;$("createBtn").onclick=()=>menu("Create on Zemivo",[["Create post","post"],["Create Reel","reel"],["Live video","live"],["Feeling / activity","feeling"]]);
$("composerOpen").onclick=()=>composer();$("photoPostBtn").onclick=()=>composer();$("reelBtn").onclick=()=>composer("reel");$("liveBtn").onclick=()=>composer("live");$("feelingBtn").onclick=()=>composer("feeling");
$("managePostsBtn").onclick=()=>menu("Manage posts",[["All posts","clear"],["Posts with photos","withPhoto"],["Text-only posts","textOnly"]]);$("filterBtn").onclick=()=>menu("Filter posts",[["All posts","clear"],["Posts with photos","withPhoto"],["Text-only posts","textOnly"]]);
$("seeFriendsBtn").onclick=()=>toast(state.friends.length?`${state.friends.length} friends shown.`:"এখনো কোনো বন্ধু যুক্ত করা হয়নি।");
$("noteBtn").onclick=()=>{modal("Share a note",`<div class="field"><label for="noteText">Your note</label><input id="noteText" maxlength="80" value="${esc(state.note)}" placeholder="Share a short note..."></div><div class="modal-actions"><button class="btn btn-grey" id="noteCancel">Cancel</button><button class="btn btn-blue" id="noteSave">Save note</button></div>`);$("noteCancel").onclick=close;$("noteSave").onclick=()=>{state.note=$("noteText").value.trim();save();render();close()}};
$("moreTopBtn").onclick=()=>menu("More options",[["Edit profile","edit"],["Share profile","share"],["Saved items","saved"],["Settings","settings"]]);
$("menuBtn").onclick=()=>menu("Zemivo menu",[["Home","nav:Home"],["Friends","nav:Friends"],["Marketplace","nav:Marketplace"],["Notifications","nav:Notifications"],["Edit profile","edit"],["Settings","settings"]]);
$("searchBtn").onclick=()=>{modal("Search this profile",`<div class="field"><label for="searchText">Search posts</label><input id="searchText" placeholder="Type a keyword"></div><div class="modal-actions"><button class="btn btn-grey" id="sCancel">Cancel</button><button class="btn btn-blue" id="sRun">Search</button></div>`);$("sCancel").onclick=close;$("sRun").onclick=()=>{const q=$("searchText").value.trim().toLowerCase();close();if(!q){toast("সার্চের শব্দ লিখুন।");return}const n=state.posts.filter(p=>(p.text||"").toLowerCase().includes(q)).length;toast(`${n}টি পোস্ট পাওয়া গেছে।`)}};
$("closeModal").onclick=close;$("modalBackdrop").addEventListener("click",e=>{if(e.target===$("modalBackdrop"))close()});document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
$("postsList").addEventListener("click",e=>{
 const b=e.target.closest("[data-like]");if(b){const p=state.posts.find(x=>x.id===b.dataset.like);if(p){p.liked=!p.liked;p.likes=Math.max(0,(Number(p.likes)||0)+(p.liked?1:-1));save();renderPosts()}return}
 const f=e.target.closest("[data-focus-comment]");if(f){document.querySelector(`[data-input="${CSS.escape(f.dataset.focusComment)}"]`)?.focus();return}
 const s=e.target.closest("[data-send]");if(s){comment(s.dataset.send);return}
 const sh=e.target.closest("[data-share]");if(sh){share();return}
 const m=e.target.closest("[data-menu]");if(m)menu("Post options",[["Delete this post","delete:"+m.dataset.menu],["Share profile","share"]]);
});
document.querySelectorAll(".nav-btn").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav-btn").forEach(x=>x.classList.toggle("active",x===b));nav(b.dataset.nav)});
render();
})();
</script>
</body>
</html>
