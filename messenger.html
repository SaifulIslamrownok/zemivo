<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#8bd5ff">
<title>Zemivo Messages</title>

<style>
:root{
  --blue:#356dff;
  --purple:#6657e9;
  --ink:#172033;
  --muted:#64748b;
  --line:rgba(96,116,160,.2);
  --glass:rgba(255,255,255,.34);
  --shadow:0 20px 55px rgba(36,56,120,.18);
  --sky1:#8bd5ff;
  --sky2:#e7f7ff;
  --mountain:#799bb5;
  --forest:#244f49;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
body{
  overflow:hidden;
  background:linear-gradient(180deg,var(--sky1),var(--sky2) 65%,#b5d7c3);
}
button,input{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}

/* Nature world */
.world{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.sun{
  position:absolute;width:clamp(90px,15vw,170px);aspect-ratio:1;
  border-radius:50%;right:12%;top:10%;
  background:#fff2b0;filter:blur(2px);
  box-shadow:0 0 70px 25px #fff2b055;
}
.cloud{
  position:absolute;width:190px;height:48px;top:23%;
  left:-220px;border-radius:50%;
  background:#ffffff77;filter:blur(9px);
  animation:drift 42s linear infinite;
}
.cloud.two{top:36%;animation-delay:-20s;transform:scale(.7)}
@keyframes drift{to{translate:calc(100vw + 500px) 0}}
.mountains{
  position:absolute;inset:28% -5% 0;
  background:
    linear-gradient(145deg,transparent 0 22%,var(--mountain) 22.2% 43%,transparent 43.2%),
    linear-gradient(35deg,transparent 0 30%,#9bb7c2 30.2% 51%,transparent 51.2%),
    linear-gradient(145deg,transparent 0 42%,#426f70 42.2% 68%,transparent 68.2%);
  background-size:75% 100%,85% 100%,100% 100%;
  background-position:left bottom,center bottom,right bottom;
  background-repeat:no-repeat;
  opacity:.8;
}
.forest{
  position:absolute;bottom:-3%;left:-5%;right:-5%;height:34%;
  background:
    radial-gradient(ellipse at 8% 100%,#244b43 0 15%,transparent 15.5%),
    radial-gradient(ellipse at 22% 100%,#356b51 0 19%,transparent 19.5%),
    radial-gradient(ellipse at 39% 100%,#1f5144 0 17%,transparent 17.5%),
    radial-gradient(ellipse at 57% 100%,#39745a 0 20%,transparent 20.5%),
    radial-gradient(ellipse at 76% 100%,#245346 0 18%,transparent 18.5%),
    radial-gradient(ellipse at 94% 100%,#183f3b 0 20%,transparent 20.5%);
}
.haze{position:absolute;inset:30% 0 0;background:linear-gradient(transparent,#ffffff30)}

/* Header */
.header{
  height:64px;position:fixed;inset:0 0 auto;z-index:10;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;background:#ffffff50;
  border-bottom:1px solid #ffffff90;
  backdrop-filter:blur(18px);
}
.logo{
  font-size:27px;font-weight:900;letter-spacing:-1px;
  color:#2859df;text-shadow:0 3px 12px #356dff35;
}
.header-actions{display:flex;gap:9px}
.header-button{
  width:42px;height:42px;border:1px solid #ffffffaa;
  border-radius:15px;background:#ffffff80;
  box-shadow:5px 5px 12px #6078a322,-4px -4px 10px #ffffffb0;
}

/* Main app */
.app{
  position:fixed;z-index:2;top:78px;bottom:14px;
  left:50%;transform:translateX(-50%);
  width:min(1200px,calc(100% - 28px));
  display:flex;overflow:hidden;
  border:1px solid #ffffffbb;border-radius:25px;
  background:#ffffff30;backdrop-filter:blur(18px) saturate(145%);
  box-shadow:var(--shadow),inset 0 1px 0 #ffffff;
}
.users-panel{
  width:325px;min-width:280px;min-height:0;
  display:flex;flex-direction:column;
  border-right:1px solid #ffffffa0;
  background:#ffffff38;backdrop-filter:blur(16px);
}
.users-title{padding:20px 18px 14px;font-size:23px;font-weight:850}
.subtitle{font-size:12px;color:#526079;margin-top:5px;font-weight:500}
.search-box{padding:0 14px 14px}
.search-box input{
  width:100%;padding:12px 14px;border:1px solid #ffffffb0;
  border-radius:16px;outline:none;background:#ffffffa0;
  box-shadow:inset 2px 2px 6px #b9c5df25;
}
.search-box input:focus,.composer input:focus{
  border-color:#8ca8ff;box-shadow:0 0 0 3px #356dff20;
}
.users-list{flex:1;min-height:0;overflow:auto;padding:0 7px 12px}
.user-item{
  width:100%;border:1px solid transparent;border-radius:16px;
  background:#ffffff24;padding:11px 10px;
  display:flex;align-items:center;gap:11px;text-align:left;
  margin:3px 0;transition:.2s;
}
.user-item:hover{background:#ffffff90;transform:translateY(-2px)}
.user-item.active{background:#ffffffa8;border-color:#ffffff}
.user-avatar{
  width:46px;height:46px;flex-shrink:0;border-radius:15px;
  background:linear-gradient(145deg,#387bff,#7a52e8);
  color:white;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:17px;object-fit:cover;
  box-shadow:0 6px 15px #356dff35;
}
.user-meta{min-width:0;flex:1}
.user-name{font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-email{font-size:12px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Chat */
.chat-panel{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.chat-person{
  height:76px;min-height:76px;padding:12px 17px;
  border-bottom:1px solid #ffffffa0;
  display:flex;align-items:center;gap:11px;
  background:#ffffff50;backdrop-filter:blur(14px);
}
.chat-person-name{font-weight:850}
.chat-person-status{color:var(--muted);font-size:12px;margin-top:4px}
.back-button{
  display:none;width:38px;height:38px;flex-shrink:0;
  border:1px solid #ffffff;border-radius:13px;background:#ffffff90;
}
.messages{
  flex:1 1 auto;min-height:0;padding:20px;overflow-y:auto;
  overscroll-behavior:contain;background:#edf5ff24;
  -webkit-overflow-scrolling:touch;
}
.empty-chat{
  height:100%;min-height:160px;display:flex;align-items:center;
  justify-content:center;text-align:center;color:var(--muted);padding:30px;
}
.message-row{display:flex;margin-bottom:13px;animation:rise .18s ease-out}
.message-row.sent{justify-content:flex-end}
.message-row.received{justify-content:flex-start}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.message{
  max-width:min(78%,570px);padding:11px 13px;
  border-radius:18px;line-height:1.48;overflow-wrap:anywhere;
  box-shadow:0 6px 16px #263c6615;
}
.message-row.sent .message{
  background:linear-gradient(135deg,#356dff,#6657e9);
  color:white;border-bottom-right-radius:5px;
}
.message-row.received .message{
  background:#ffffffed;color:var(--ink);
  border:1px solid #e5eaf5;border-bottom-left-radius:5px;
}
.message-time{font-size:10px;opacity:.76;margin-top:6px;text-align:right}
.translation{margin-top:8px;padding-top:8px;border-top:1px solid #ffffff55;font-size:12px}
.translation-label{font-weight:800;margin-bottom:4px}
.reply-quote{
  font-size:12px;opacity:.85;border-left:3px solid currentColor;
  padding:4px 7px;margin-bottom:7px;background:#ffffff18;border-radius:3px;
}
.message-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;justify-content:flex-end}
.message-actions button{
  border:1px solid #ffffff60;background:#ffffff20;color:inherit;
  border-radius:8px;padding:4px 7px;font-size:11px;
}
.message-row.received .message-actions button{
  border-color:#dbe2f0;background:#f5f7fc;color:#334155;
}

/* Composer */
.composer{
  position:relative;min-height:76px;padding:13px;
  border-top:1px solid #ffffffa0;background:#ffffff60;
  display:flex;gap:9px;align-items:center;flex-shrink:0;
  backdrop-filter:blur(20px);z-index:12;
}
.attach{
  width:43px;height:43px;flex-shrink:0;border:1px solid #ffffff;
  border-radius:15px;background:#ffffff90;font-size:20px;
}
.composer input{
  flex:1;min-width:0;height:44px;padding:11px 16px;
  border:1px solid #ffffffb0;border-radius:16px;
  outline:none;font-size:16px;background:#ffffffbd;
}
.send{
  height:44px;flex-shrink:0;border:0;border-radius:15px;
  padding:0 20px;background:linear-gradient(135deg,#356dff,#624fe6);
  color:white;font-weight:800;box-shadow:0 7px 17px #356dff35;
}
.composer-menu{
  display:none;position:absolute;bottom:calc(100% + 10px);left:10px;
  z-index:100;width:180px;padding:9px;border-radius:18px;
  background:#ffffffed;box-shadow:0 12px 35px #263c6633;
}
.composer-menu.open{display:grid;gap:7px}
.composer-menu button{
  border:0;border-radius:12px;padding:12px;text-align:left;
  background:#edf2ff;color:#172033;font-weight:700;
}
.loading,.error{padding:24px;text-align:center;color:var(--muted);font-size:14px}
.error{color:#dc2626}
.toast{
  position:fixed;left:50%;bottom:25px;transform:translateX(-50%);
  background:#111827;color:white;padding:12px 18px;border-radius:12px;
  display:none;z-index:1000;max-width:90%;text-align:center;
}
.toast.show{display:block}
.bottom-nav{display:none}

/* Mobile */
@media(max-width:700px){
  .header{height:58px;padding:0 12px}
  .logo{font-size:24px}
  .app{
    top:58px;bottom:0;left:0;transform:none;
    width:100%;border-radius:0;border-left:0;border-right:0;
  }
  .users-panel{width:100%;min-width:100%;border-right:0}
  .chat-panel{width:100%;min-width:100%}
  .app.chat-open .users-panel{display:none}
  .app:not(.chat-open) .chat-panel{display:none}
  .chat-person{height:66px;min-height:66px;padding:9px 12px}
  .back-button{display:block}
  .messages{padding:14px 12px 18px}
  .message{max-width:88%}
  .composer{min-height:66px;padding:9px;gap:6px}
  .composer input{font-size:16px;padding:10px 12px}
  .send{padding:0 14px}
  .attach{width:39px;height:40px}
  .users-title{padding:15px 15px 12px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

<body>
<div class="world" aria-hidden="true">
  <div class="sun"></div>
  <div class="cloud"></div>
  <div class="cloud two"></div>
  <div class="mountains"></div>
  <div class="forest"></div>
  <div class="haze"></div>
</div>

<header class="header">
  <div class="logo">ZEMIVO</div>
  <div class="header-actions">
    <button class="header-button" type="button" title="Messages">💬</button>
  </div>
</header>

<main id="app" class="app">
  <section class="users-panel">
    <div class="users-title">
      Messages
      <div class="subtitle">Connect across languages 🌍</div>
    </div>
    <div class="search-box">
      <input id="userSearch" type="search" placeholder="Search people..." autocomplete="off" aria-label="Search people">
    </div>
    <div id="usersList" class="users-list">
      <div class="loading">Loading Zemivo users…</div>
    </div>
  </section>

  <section class="chat-panel">
    <div class="chat-person">
      <button id="backButton" class="back-button" type="button" aria-label="Back">←</button>
      <div id="chatAvatar" class="user-avatar">Z</div>
      <div style="min-width:0">
        <div id="chatName" class="chat-person-name">Select a person</div>
        <div id="chatStatus" class="chat-person-status">Choose someone to start messaging</div>
      </div>
    </div>

    <div id="messages" class="messages">
      <div class="empty-chat">
        <div>
          <div style="font-size:42px">💬</div>
          <div style="font-weight:800;margin-top:8px">Zemivo Messages</div>
          <div style="margin-top:5px">Select a person to start a conversation.</div>
        </div>
      </div>
    </div>

    <div class="composer">
      <button id="attachButton" class="attach" type="button" aria-label="Attachments">＋</button>

      <div id="composerMenu" class="composer-menu">
        <button type="button" id="photoButton">🖼️ Photo</button>
        <button type="button" id="cameraButton">📷 Camera</button>
        <button type="button" id="emojiButton">😊 Emoji</button>
        <button type="button" id="voiceButton">🎤 Voice</button>
      </div>

      <input id="photoInput" type="file" accept="image/*" hidden>
      <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>

      <input id="messageInput" type="text" placeholder="Type a message..." disabled maxlength="5000" autocomplete="off">
      <button id="sendButton" class="send" type="button" disabled>Send</button>
    </div>
  </section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {
  getFirestore, collection, query, orderBy, onSnapshot, addDoc,
  doc, getDoc, setDoc, updateDoc, deleteDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
import {
  getDatabase, ref, set, onValue, onDisconnect,
  serverTimestamp as databaseServerTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

/*
  Translation:
  Configure a secure authenticated HTTPS backend endpoint.
  Never place a paid translation API key in this public file.
*/
const TRANSLATION_ENDPOINT = "";

const firebaseConfig = {
  apiKey: "AIzaSyAxJUFBWm2fa0g3oxUWWqdfSTEAc-bRgfI",
  authDomain: "zemivo.firebaseapp.com",
  projectId: "zemivo",
  storageBucket: "zemivo.firebasestorage.app",
  messagingSenderId: "195335939691",
  appId: "1:195335939691:web:5fa5c62c53d0c0aefe732e",
  measurementId: "G-GNHH5S4H09"
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);
const rtdb = getDatabase(firebaseApp,"https://zemivo-default-rtdb.asia-southeast1.firebasedatabase.app");

const $ = id => document.getElementById(id);
const appElement = $("app");
const usersList = $("usersList");
const userSearch = $("userSearch");
const messagesElement = $("messages");
const messageInput = $("messageInput");
const sendButton = $("sendButton");
const chatName = $("chatName");
const chatStatus = $("chatStatus");
const chatAvatar = $("chatAvatar");
const backButton = $("backButton");
const toast = $("toast");
const composerMenu = $("composerMenu");
const photoInput = $("photoInput");
const cameraInput = $("cameraInput");

let currentUser = null;
let currentUserLanguage = "en";
let allUsers = [];
let selectedUser = null;
let currentChatId = null;
let pendingReply = null;

let unsubscribeUsers = null;
let unsubscribePresence = null;
let unsubscribeMessages = null;
let unsubscribeTyping = null;
let unsubscribeConnection = null;

let typingTimer = null;
let toastTimer = null;
let basePresenceStatus = "Offline";
let presenceSetupForUid = null;

/* Daily changing nature theme */
const natureThemes = [
  ["#8bd5ff","#e7f7ff","#799bb5","#244f49"],
  ["#ffb88c","#ffe8c8","#ad827b","#385548"],
  ["#8299d8","#d8e2ff","#7584a9","#263e49"],
  ["#a4d9c3","#e3f5df","#8cae9c","#285342"],
  ["#b9a6e8","#f0ddf8","#9986b5","#35445c"],
  ["#70b8c9","#d9f0ed","#6f9eaa","#20564c"],
  ["#f2c58e","#f8e9cf","#b59b80","#53634b"]
];

function updateDailyTheme(){
  const day = Math.floor((Date.now()-new Date(new Date().getFullYear(),0,0).getTime())/86400000);
  const theme = natureThemes[day % natureThemes.length];
  const root = document.documentElement;
  root.style.setProperty("--sky1",theme[0]);
  root.style.setProperty("--sky2",theme[1]);
  root.style.setProperty("--mountain",theme[2]);
  root.style.setProperty("--forest",theme[3]);
}
updateDailyTheme();

function showToast(message){
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toast.classList.remove("show"),2800);
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function localeBase(value){
  if(!value || typeof value !== "string") return "";
  try{
    const language = new Intl.Locale(value.trim().replaceAll("_","-")).language.toLowerCase();
    return /^[a-z]{2,3}$/.test(language) ? language : "";
  }catch{return "";}
}

function getUserLanguage(profile){
  return localeBase(profile?.preferredLanguage) ||
    localeBase(profile?.preferred_language) ||
    localeBase(profile?.language) ||
    localeBase(profile?.locale) || "en";
}

function initials(name){
  return (String(name || "Z").trim().charAt(0) || "Z").toLocaleUpperCase();
}

function createChatId(uid1,uid2){
  return [uid1,uid2].sort().join("_");
}

function formatTime(timestamp){
  if(!timestamp?.toDate) return "Sending…";
  try{return timestamp.toDate().toLocaleString();}
  catch{return "";}
}

function getViewerLanguage(){
  return currentUserLanguage || localeBase(navigator.language) || "en";
}

/* Authentication */
onAuthStateChanged(auth,async user=>{
  if(!user){
    currentUser = null;
    showToast("Please log in first.");
    setTimeout(()=>location.href="login.html",900);
    return;
  }

  currentUser = user;

  try{
    const profile = await getDoc(doc(db,"profiles",user.uid));
    if(profile.exists()) currentUserLanguage = getUserLanguage(profile.data());
  }catch(error){
    console.warn("Could not load language preference:",error);
  }

  setupPresence();
  await loadUsers();
});

/* Presence */
function setupPresence(){
  if(!currentUser || presenceSetupForUid === currentUser.uid) return;
  presenceSetupForUid = currentUser.uid;

  const connectedRef = ref(rtdb,".info/connected");
  const myStatusRef = ref(rtdb,"status/"+currentUser.uid);

  unsubscribeConnection = onValue(connectedRef,async snapshot=>{
    if(snapshot.val() !== true || !currentUser) return;

    try{
      await onDisconnect(myStatusRef).set({
        state:"offline",
        lastChanged:databaseServerTimestamp()
      });

      await set(myStatusRef,{
        state:"online",
        lastChanged:databaseServerTimestamp()
      });
    }catch(error){
      console.error("Presence setup error:",error);
    }
  });
}

/* Users */
async function loadUsers(){
  usersList.innerHTML = '<div class="loading">Loading users…</div>';

  try{
    const profilesQuery = query(collection(db,"profiles"));

    unsubscribeUsers = onSnapshot(profilesQuery,snapshot=>{
      allUsers = [];

      snapshot.forEach(profileSnapshot=>{
        const profile = profileSnapshot.data() || {};
        const uid = profileSnapshot.id;

        if(!currentUser || uid === currentUser.uid) return;

        allUsers.push({
          uid,
          displayName:profile.displayName || profile.fullName || profile.name || "Zemivo User",
          email:profile.email || "",
          photoURL:profile.photoURL || profile.photoUrl || "",
          language:getUserLanguage(profile),
          countryName:profile.countryName || ""
        });
      });

      allUsers.sort((a,b)=>a.displayName.localeCompare(b.displayName));
      filterAndRenderUsers();
    },error=>{
      console.error("Users listener error:",error);
      usersList.innerHTML = '<div class="error">Could not load users. Check Firestore permissions.</div>';
    });
  }catch(error){
    console.error(error);
    usersList.innerHTML = '<div class="error">Could not load users.</div>';
  }
}

function filterAndRenderUsers(){
  const term = userSearch.value.trim().toLocaleLowerCase();

  const filtered = !term ? allUsers : allUsers.filter(user=>
    user.displayName.toLocaleLowerCase().includes(term) ||
    user.countryName.toLocaleLowerCase().includes(term)
  );

  renderUsers(filtered);
}

function renderUsers(users){
  usersList.innerHTML = "";

  if(!users.length){
    usersList.innerHTML = '<div class="loading">No other Zemivo users found yet.</div>';
    return;
  }

  users.forEach(user=>{
    const button = document.createElement("button");
    button.type = "button";
    button.className = "user-item" + (selectedUser?.uid === user.uid ? " active" : "");

    const avatar = user.photoURL
      ? `<img src="${escapeHtml(user.photoURL)}" class="user-avatar" alt="" loading="lazy">`
      : `<div class="user-avatar">${escapeHtml(initials(user.displayName))}</div>`;

    button.innerHTML =
      `${avatar}<div class="user-meta">
        <div class="user-name">${escapeHtml(user.displayName)}</div>
        <div class="user-email">${escapeHtml(user.countryName || "Zemivo member")} · ${escapeHtml(user.language.toUpperCase())}</div>
      </div>`;

    button.addEventListener("click",()=>selectUser(user));
    usersList.appendChild(button);
  });
}

userSearch.addEventListener("input",filterAndRenderUsers);

/* Chat listeners */
function clearChatListeners(){
  if(unsubscribeMessages){unsubscribeMessages();unsubscribeMessages=null;}
  if(unsubscribePresence){unsubscribePresence();unsubscribePresence=null;}
  if(unsubscribeTyping){unsubscribeTyping();unsubscribeTyping=null;}
}

async function selectUser(user){
  if(!currentUser || !user?.uid) return;

  setTyping(false);
  clearTimeout(typingTimer);
  clearChatListeners();

  selectedUser = user;
  currentChatId = createChatId(currentUser.uid,user.uid);
  pendingReply = null;

  chatName.textContent = user.displayName;
  chatStatus.textContent = "Checking status…";
  chatStatus.dataset.typing = "false";

  chatAvatar.textContent = user.photoURL ? "" : initials(user.displayName);
  chatAvatar.style.backgroundImage = user.photoURL ? `url("${user.photoURL.replaceAll('"',"%22")}")` : "none";
  chatAvatar.style.backgroundSize = "cover";
  chatAvatar.style.backgroundPosition = "center";

  appElement.classList.add("chat-open");
  messageInput.disabled = true;
  sendButton.disabled = true;
  messageInput.value = "";
  messageInput.placeholder = "Type a message...";
  messagesElement.innerHTML = '<div class="loading">Opening conversation…</div>';

  filterAndRenderUsers();

  const statusRef = ref(rtdb,"status/"+user.uid);

  unsubscribePresence = onValue(statusRef,snapshot=>{
    const status = snapshot.val();

    if(status?.state === "online"){
      basePresenceStatus = "🟢 Online";
    }else if(status?.lastChanged){
      const ms = Number(status.lastChanged);
      basePresenceStatus = ms ? "Last seen "+new Date(ms).toLocaleString() : "Offline";
    }else{
      basePresenceStatus = "Offline";
    }

    if(chatStatus.dataset.typing !== "true"){
      chatStatus.textContent = basePresenceStatus;
    }
  },error=>{
    console.warn("Presence read error:",error);
    basePresenceStatus = "Status unavailable";
    if(chatStatus.dataset.typing !== "true") chatStatus.textContent = basePresenceStatus;
  });

  const typingRef = ref(rtdb,"typing/"+currentChatId+"/"+user.uid);

  unsubscribeTyping = onValue(typingRef,snapshot=>{
    const isTyping = snapshot.val()?.typing === true;
    chatStatus.dataset.typing = isTyping ? "true" : "false";
    chatStatus.textContent = isTyping ? "✍️ Typing…" : basePresenceStatus;
  },error=>console.warn("Typing listener error:",error));

  try{
    await setDoc(doc(db,"chats",currentChatId),{
      members:[currentUser.uid,user.uid],
      updatedAt:serverTimestamp()
    },{merge:true});

    if(selectedUser?.uid !== user.uid) return;

    messageInput.disabled = false;
    sendButton.disabled = false;
    startMessageListener();
    messageInput.focus();
  }catch(error){
    console.error("Chat setup error:",error);
    messagesElement.innerHTML = '<div class="error">Could not open this conversation. Check Firestore chat permissions.</div>';
    showToast("Could not open conversation.");
  }
}

function startMessageListener(){
  if(!selectedUser || !currentChatId) return;

  if(unsubscribeMessages) unsubscribeMessages();

  messagesElement.innerHTML = '<div class="loading">Loading messages…</div>';

  const messagesQuery = query(
    collection(db,"chats",currentChatId,"messages"),
    orderBy("createdAt","asc")
  );

  unsubscribeMessages = onSnapshot(messagesQuery,snapshot=>{
    if(!selectedUser || !currentChatId) return;

    messagesElement.innerHTML = "";

    if(snapshot.empty){
      messagesElement.innerHTML =
        `<div class="empty-chat"><div>
          <div style="font-size:38px">👋</div>
          <div style="font-weight:800;margin-top:7px">Start the conversation</div>
          <div style="margin-top:5px;color:#64748b">Send your first message to ${escapeHtml(selectedUser.displayName)}.</div>
        </div></div>`;
      return;
    }

    snapshot.forEach(messageSnapshot=>{
      renderMessage(messageSnapshot.data(),messageSnapshot.id);
    });

    messagesElement.scrollTop = messagesElement.scrollHeight;
    void updateMessageReceipts(snapshot);
  },error=>{
    console.error("Message listener error:",error);
    messagesElement.innerHTML = '<div class="error">Could not load messages. Check Firestore permissions.</div>';
  });
}

/* Message display */
function renderMessage(message,messageId){
  const isSent = message.senderId === currentUser?.uid;
  const row = document.createElement("div");
  row.className = "message-row "+(isSent ? "sent" : "received");

  const bubble = document.createElement("div");
  bubble.className = "message";

  if(message.replyText){
    const quote = document.createElement("div");
    quote.className = "reply-quote";
    quote.textContent = "↩ "+message.replyText;
    bubble.appendChild(quote);
  }

  const original = document.createElement("div");
  original.textContent = message.text || "";
  bubble.appendChild(original);

  if(message.translatedText && message.targetLanguage === getViewerLanguage()){
    const translation = document.createElement("div");
    translation.className = "translation";

    const label = document.createElement("div");
    label.className = "translation-label";
    label.textContent = "🌍 Translation · "+message.targetLanguage.toUpperCase();

    const translated = document.createElement("div");
    translated.textContent = message.translatedText;

    translation.append(label,translated);
    bubble.appendChild(translation);
  }

  const time = document.createElement("div");
  time.className = "message-time";
  time.textContent = formatTime(message.createdAt);

  if(isSent){
    const status = document.createElement("span");
    status.style.marginLeft = "5px";
    status.style.fontWeight = "800";
    status.textContent = message.readAt ? "✓✓ Read" : message.deliveredAt ? "✓✓ Delivered" : "✓ Sent";
    time.appendChild(status);
  }

  if(message.edited === true) time.append(" · edited");
  bubble.appendChild(time);

  const actions = document.createElement("div");
  actions.className = "message-actions";

  const replyButton = document.createElement("button");
  replyButton.type = "button";
  replyButton.textContent = "↩ Reply";
  replyButton.addEventListener("click",()=>replyToMessage(message));
  actions.appendChild(replyButton);

  if(isSent){
    const editButton = document.createElement("button");
    editButton.type = "button";
    editButton.textContent = "✏️ Edit";
    editButton.addEventListener("click",()=>editMessage(messageId,message.text || ""));

    const deleteButton = document.createElement("button");
    deleteButton.type = "button";
    deleteButton.textContent = "🗑 Delete";
    deleteButton.addEventListener("click",()=>deleteMessage(messageId));

    actions.append(editButton,deleteButton);
  }

  bubble.appendChild(actions);
  row.appendChild(bubble);
  messagesElement.appendChild(row);
}

/* Read receipts */
async function updateMessageReceipts(snapshot){
  if(!currentUser || !selectedUser || !currentChatId) return;

  const tasks = [];

  snapshot.forEach(messageSnapshot=>{
    const message = messageSnapshot.data();

    if(message.senderId === currentUser.uid) return;

    const patch = {};
    if(!message.deliveredAt) patch.deliveredAt = serverTimestamp();
    if(!message.readAt) patch.readAt = serverTimestamp();

    if(Object.keys(patch).length){
      tasks.push(updateDoc(
        doc(db,"chats",currentChatId,"messages",messageSnapshot.id),
        patch
      ));
    }
  });

  if(tasks.length){
    try{await Promise.all(tasks);}
    catch(error){console.warn("Receipt update failed:",error);}
  }
}

/* Edit and delete */
async function editMessage(messageId,oldText){
  if(!currentUser || !selectedUser || !currentChatId) return;

  const value = prompt("Edit your message:",oldText);
  if(value === null) return;

  const cleaned = value.trim();
  if(!cleaned) return showToast("Message cannot be empty.");
  if(cleaned === oldText) return;

  try{
    await updateDoc(doc(db,"chats",currentChatId,"messages",messageId),{
      text:cleaned,
      edited:true,
      editedAt:serverTimestamp(),
      translatedText:null,
      targetLanguage:null
    });
    showToast("Message edited.");
  }catch(error){
    console.error(error);
    showToast("Message could not be edited. Check Firestore rules.");
  }
}

async function deleteMessage(messageId){
  if(!currentUser || !selectedUser || !currentChatId) return;
  if(!confirm("Delete this message for everyone?")) return;

  try{
    await deleteDoc(doc(db,"chats",currentChatId,"messages",messageId));
    showToast("Message deleted.");
  }catch(error){
    console.error(error);
    showToast("Message could not be deleted. Check Firestore rules.");
  }
}

function replyToMessage(message){
  pendingReply = {text:String(message.text || "").slice(0,500)};
  messageInput.value = "";
  messageInput.placeholder = "Replying: "+pendingReply.text.slice(0,60)+" — type reply…";
  messageInput.focus();
  showToast("Reply selected. Type your reply and press Send.");
}

/* Typing status */
function setTyping(value){
  if(!currentUser || !selectedUser || !currentChatId) return;

  const typingRef = ref(rtdb,"typing/"+currentChatId+"/"+currentUser.uid);

  set(typingRef,{
    typing:value,
    updatedAt:databaseServerTimestamp()
  }).catch(error=>console.warn("Typing status update failed:",error));
}

messageInput.addEventListener("input",()=>{
  if(!selectedUser) return;

  setTyping(true);
  clearTimeout(typingTimer);
  typingTimer = setTimeout(()=>setTyping(false),1000);
});

/* Translation backend */
async function translateForRecipient(text,targetLanguage){
  if(!TRANSLATION_ENDPOINT){
    return {translatedText:null,reason:"not-configured"};
  }

  const token = await currentUser.getIdToken();

  const response = await fetch(TRANSLATION_ENDPOINT,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer "+token
    },
    body:JSON.stringify({
      text,
      targetLanguage,
      sourceLanguage:"auto"
    })
  });

  if(!response.ok) throw new Error("Translation service returned HTTP "+response.status);

  const data = await response.json();

  if(typeof data.translatedText !== "string" || !data.translatedText.trim()){
    throw new Error("Invalid translation response");
  }

  return {translatedText:data.translatedText,reason:null};
}

/* Send message */
async function sendMessage(){
  if(!currentUser || !selectedUser || !currentChatId){
    showToast("Select a person first.");
    return;
  }

  const text = messageInput.value.trim();
  if(!text) return;
  if(text.length > 5000) return showToast("Message is too long.");

  sendButton.disabled = true;
  const replyText = pendingReply?.text || null;

  try{
    await setDoc(doc(db,"chats",currentChatId),{
      members:[currentUser.uid,selectedUser.uid],
      updatedAt:serverTimestamp(),
      lastMessage:text.slice(0,300),
      lastSenderId:currentUser.uid
    },{merge:true});

    let translatedText = null;
    const targetLanguage = selectedUser.language || "en";

    try{
      const translated = await translateForRecipient(text,targetLanguage);
      translatedText = translated.translatedText;

      if(translated.reason === "not-configured"){
        console.info("Translation backend is not configured yet.");
      }
    }catch(error){
      console.error("Translation failed:",error);
      showToast("Translation unavailable; sending original message.");
    }

    await addDoc(collection(db,"chats",currentChatId,"messages"),{
      senderId:currentUser.uid,
      receiverId:selectedUser.uid,
      text,
      replyTo:null,
      replyText,
      sourceLanguage:"auto",
      targetLanguage:translatedText ? targetLanguage : null,
      translatedText,
      createdAt:serverTimestamp(),
      deliveredAt:null,
      readAt:null
    });

    messageInput.value = "";
    messageInput.placeholder = "Type a message...";
    pendingReply = null;
    setTyping(false);
    messageInput.focus();
  }catch(error){
    console.error("Send message error:",error);
    showToast("Message could not be sent. Check Firestore permissions.");
  }finally{
    sendButton.disabled = !selectedUser;
  }
}

sendButton.addEventListener("click",sendMessage);

messageInput.addEventListener("keydown",event=>{
  if(event.key === "Enter" && !event.shiftKey){
    event.preventDefault();
    sendMessage();
  }
});

/* Attachment menu */
$("attachButton").addEventListener("click",()=>{
  composerMenu.classList.toggle("open");
});

$("photoButton").addEventListener("click",()=>{
  composerMenu.classList.remove("open");
  photoInput.click();
});

$("cameraButton").addEventListener("click",()=>{
  composerMenu.classList.remove("open");
  cameraInput.click();
});

$("emojiButton").addEventListener("click",()=>{
  composerMenu.classList.remove("open");
  messageInput.value += " 😊";
  messageInput.focus();
});

$("voiceButton").addEventListener("click",()=>{
  composerMenu.classList.remove("open");
  showToast("Voice message upload is not connected yet.");
});

photoInput.addEventListener("change",()=>{
  if(photoInput.files.length){
    showToast("Photo selected. Secure upload connection is still needed.");
  }
});

cameraInput.addEventListener("change",()=>{
  if(cameraInput.files.length){
    showToast("Camera photo selected. Secure upload connection is still needed.");
  }
});

/* Back to user list */
backButton.addEventListener("click",()=>{
  setTyping(false);
  clearTimeout(typingTimer);
  clearChatListeners();

  appElement.classList.remove("chat-open");
  selectedUser = null;
  currentChatId = null;
  pendingReply = null;

  messageInput.disabled = true;
  sendButton.disabled = true;
  messageInput.value = "";
  messageInput.placeholder = "Type a message...";
  chatName.textContent = "Select a person";
  chatStatus.textContent = "Choose someone to start messaging";
  chatAvatar.textContent = "Z";
  chatAvatar.style.backgroundImage = "none";

  messagesElement.innerHTML =
    '<div class="empty-chat"><div><div style="font-size:42px">💬</div><div style="font-weight:800;margin-top:8px">Zemivo Messages</div><div style="margin-top:5px">Select a person to start a conversation.</div></div></div>';

  filterAndRenderUsers();
});

/* Clean up listeners */
window.addEventListener("beforeunload",()=>{
  clearChatListeners();

  if(unsubscribeUsers) unsubscribeUsers();
  if(unsubscribeConnection) unsubscribeConnection();

  if(currentUser && currentChatId){
    set(ref(rtdb,"typing/"+currentChatId+"/"+currentUser.uid),{
      typing:false,
      updatedAt:databaseServerTimestamp()
    }).catch(()=>{});
  }
});

/* Desktop-only subtle 3D movement */
if(window.matchMedia("(hover:hover) and (pointer:fine) and (min-width:701px)").matches){
  appElement.addEventListener("pointermove",event=>{
    const rect = appElement.getBoundingClientRect();
    if(!rect.width || !rect.height) return;

    const x = (event.clientX-rect.left)/rect.width-.5;
    const y = (event.clientY-rect.top)/rect.height-.5;

    appElement.style.transform =
      `translateX(-50%) perspective(1400px) rotateY(${(x*1.1).toFixed(2)}deg) rotateX(${(-y*.8).toFixed(2)}deg)`;
  });

  appElement.addEventListener("pointerleave",()=>{
    appElement.style.transform = "translateX(-50%)";
  });
}
</script>
