utton{border:1px solid #ffffff50;background:#ffffff18;color:inherit;border-radius:8px;padding:4px 7px;font-size:11px}.message-row.received .message-actions button{border-color:#dbe2f0;background:#f5f7fc;color:#334155}.composer{min-height:76px;padding:13px;border-top:1px solid var(--line);background:#ffffffd9;display:flex;gap:9px;align-items:center;flex-shrink:0;z-index:12}.attach{width:43px;height:43px;flex-shrink:0;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#fff,#e8edff);font-size:18px}.composer input{flex:1;min-width:0;height:44px;padding:11px 16px;border:1px solid var(--line);border-radius:16px;outline:none;font-size:16px;background:#fff}.send{height:44px;flex-shrink:0;border:0;border-radius:15px;padding:0 20px;background:linear-gradient(135deg,#356dff,#624fe6);color:#fff;font-weight:800;box-shadow:0 7px 17px #356dff30}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:12px;display:none;z-index:1000;max-width:90%;text-align:center;box-shadow:0 10px 30px #11182733}.toast.show{display:block}.loading,.error{padding:24px;text-align:center;color:var(--muted);font-size:14px}.error{color:#dc2626}.bottom-nav{display:none}

/* ZEMIVO MESSENGER FIX */
.chat-panel{
  min-height:0;
  overflow:hidden;
}

.messages{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  overscroll-behavior:contain;
  padding-bottom:15px;
}

.composer{
  position:relative;
  left:auto;
  right:auto;
  bottom:auto;
  width:100%;
  flex:0 0 auto;
  min-height:72px;
  z-index:30;
  background:rgba(255,255,255,.88);

    position:relative;
    left:auto;
    right:auto;

  }

    height:100%;
    min-height:0;
  }
}

.composer-menu{
  display:none;
  position:absolute;

  z-index:100;

  /* =========================================
   ZEMIVO 3D NATURE GLASS WORLD
   Visual layer only — does not change Firebase
========================================= */

:root {
  --world-sky-top: #8bd5ff;
  --world-sky-bottom: #e7f7ff;
  --world-sun: #fff2b0;
  --world-mountain-back: #799bb5;
  --world-mountain-front: #426f70;
  --world-forest: #244f49;
  --world-glass: rgba(255,255,255,.25);
  --world-glass-border: rgba(255,255,255,.62);
}

body {
  isolation: isolate;
  background: transparent;
}

/* Full-screen nature environment */
.zemivo-world {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
  pointer-events: none;
  background:
    linear-gradient(
      180deg,
      var(--world-sky-top) 0%,
      var(--world-sky-bottom) 58%,
      #b5d7c3 100%
    );
  perspective: 1000px;
  transform-style: preserve-3d;
}

/* Sun */
.world-sun {
  position: absolute;
  width: clamp(90px, 16vw, 180px);
  aspect-ratio: 1;
  border-radius: 50%;
  top: 12%;
  right: 15%;
  background: var(--world-sun);
  filter: blur(2px);
  box-shadow:
    0 0 45px 18px rgba(255,245,190,.35),
    0 0 100px 35px rgba(255,255,255,.2);
}

/* Soft moving clouds */
.world-cloud {
  position: absolute;
  width: 190px;
  height: 48px;
  border-radius: 50%;
  background: rgba(255,255,255,.48);
  filter: blur(9px);
  animation: cloudDrift 38s linear infinite;
}

.cloud-one {
  top: 20%;
  left: -220px;
}

.cloud-two {
  top: 34%;
  left: -280px;
  transform: scale(.7);
  animation-delay: -18s;
}

@keyframes cloudDrift {
  from { translate: 0 0; }
  to { translate: calc(100vw + 500px) 0; }
}

/* Layered mountain scenery */
.world-mountains {
  position: absolute;
  inset: 25% -5% 0;
  background:
    linear-gradient(
      145deg,
      transparent 0 22%,
      var(--world-mountain-back) 22.2% 43%,
      transparent 43.2%
    ),
    linear-gradient(
      35deg,
      transparent 0 30%,
      #9bb7c2 30.2% 51%,
      transparent 51.2%
    ),
    linear-gradient(
      145deg,
      transparent 0 42%,
      var(--world-mountain-front) 42.2% 68%,
      transparent 68.2%
    );
  background-size: 75% 100%, 85% 100%, 100% 100%;
  background-position: left bottom, center bottom, right bottom;
  background-repeat: no-repeat;
  transform: translateZ(-100px) scale(1.12);
  opacity: .82;
}

/* Deep forest foreground */
.world-forest {
  position: absolute;
  left: -5%;
  right: -5%;
  bottom: -2%;
  height: 36%;
  background:
    radial-gradient(ellipse at 8% 100%, #244b43 0 15%, transparent 15.5%),
    radial-gradient(ellipse at 22% 100%, #356b51 0 19%, transparent 19.5%),
    radial-gradient(ellipse at 39% 100%, #1f5144 0 17%, transparent 17.5%),
    radial-gradient(ellipse at 57% 100%, #39745a 0 20%, transparent 20.5%),
    radial-gradient(ellipse at 76% 100%, #245346 0 18%, transparent 18.5%),
    radial-gradient(ellipse at 94% 100%, #183f3b 0 20%, transparent 20.5%);
  filter: drop-shadow(0 -8px 15px rgba(20,65,50,.16));
  transform: translateZ(35px);
}

/* Atmospheric depth */
.world-haze {
  position: absolute;
  inset: 30% 0 0;
  background: linear-gradient(
    180deg,
    transparent,
    rgba(255,255,255,.18) 45%,
    rgba(221,245,233,.25)
  );
}

/* Make the app itself a transparent glass window */
.app {
  background: rgba(255,255,255,.22) !important;
  border: 1px solid var(--world-glass-border) !important;
  backdrop-filter: blur(13px) saturate(145%);
  -webkit-backdrop-filter: blur(13px) saturate(145%);
  box-shadow:
    0 25px 65px rgba(28,55,100,.20),
    inset 0 1px 0 rgba(255,255,255,.85),
    inset 0 -1px 0 rgba(255,255,255,.25);
}

/* Transparent glass panels */
.users-panel {
  background: rgba(255,255,255,.22) !important;
  backdrop-filter: blur(15px) saturate(140%);
  -webkit-backdrop-filter: blur(15px) saturate(140%);
}

.chat-person {
  background: rgba(255,255,255,.28) !important;
  backdrop-filter: blur(18px) saturate(150%);
  -webkit-backdrop-filter: blur(18px) saturate(150%);
}

.messages {
  background: rgba(235,245,255,.16) !important;
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
}

.composer {
  background: rgba(255,255,255,.32) !important;
  backdrop-filter: blur(22px) saturate(155%);
  -webkit-backdrop-filter: blur(22px) saturate(155%);
  border-top: 1px solid rgba(255,255,255,.65);
}

.bottom-nav {
  background: rgba(255,255,255,.32) !important;
  backdrop-filter: blur(20px) saturate(150%);
  -webkit-backdrop-filter: blur(20px) saturate(150%);
}

/* Glass effect on people and message controls */
.user-item {
  background: rgba(255,255,255,.18);
  border-color: rgba(255,255,255,.24);
}

.user-item.active {
  background: rgba(255,255,255,.42);
  border-color: rgba(255,255,255,.75);
}

.composer input,
.search-box input {
  background: rgba(255,255,255,.62);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.header-button,
.attach,
.back-button {
  background: rgba(255,255,255,.48);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

/* Keep message text readable over the scenery */
.message-row.received .message {
  background: rgba(255,255,255,.88);
  backdrop-filter: blur(12px);
}

.message-row.sent .message {
  background: linear-gradient(
    135deg,
    rgba(40,105,255,.94),
    rgba(100,75,230,.94)
  );
}

/* Responsive scenery */
@media(max-width:700px) {
  .zemivo-world {
    position: fixed;
  }

  .world-mountains {
    inset: 30% -30% 0;
    background-size: 100% 100%, 110% 100%, 125% 100%;
  }

  .world-forest {
    height: 30%;
  }

  .app {
    background: rgba(255,255,255,.22) !important;
  }

  .messages {
    background: rgba(235,245,255,.16) !important;
  }
}

@media(prefers-reduced-motion:reduce) {
  .world-cloud {
    animation: none !important;
  }
}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import { getFirestore, collection, query, orderBy, onSnapshot, addDoc, doc, getDoc, setDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
import { getDatabase, ref, set, onValue, onDisconnect, serverTimestamp as databaseServerTimestamp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

/*
 * IMPORTANT:
 * 1) Configure a secure translation HTTPS endpoint below to enable automatic translation.
 * 2) The endpoint must authenticate the caller and validate text/language values server-side.
 * 3) Never put a paid translation-provider secret/API key in this public HTML file.
 * 4) 193-country readiness means country/locale-aware architecture, not 193 different languages:

  const dayNumber = Math.floor(
    (today - startOfYear) / 86400000

  const root = document.documentElement;

  root.style.setProperty("--world-sky-top", theme.skyTop);
  root.style.setProperty("--world-sky-bottom", theme.skyBottom);
  root.style.setProperty("--world-sun", theme.sun);

/* Subtle pointer-based 3D tilt on desktop only; no touch-screen scroll interference. */
if (window.matchMedia("(hover: hover) and (pointer: fine) and (min-width: 701px)").matches) {
  appElement.addEventListener("pointermove", event => {
    const rect = appElement.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const x = (event.clientX - rect.left) / rect.width - 0.5;
    const y = (event.clientY - rect.top) / rect.height - 0.5;
    appElement.style.transform = `translateX(-50%) perspective(1400px) rotateY(${(x * 1.1).toFixed(2)}deg) rotateX(${(-y * 0.8).toFixed(2)}deg)`;
  });
  appElement.addEventListener("pointerleave", () => {
    appElement.style.transform = "translateX(-50%)";
  });
}


let currentUser = null;
let currentUserLanguage = localeBase(navigator.language) || "en";
let allUsers = [];
let selectedUser = null;
let unsubscribeUsers = null;
let unsubscribePresence = null;
let unsubscribeMessages = null;
let unsubscribeTyping = null;
let unsubscribeConnection = null;
let toastTimer = null;
let currentChatId = null;
let pendingReply = null;
let presenceSetupForUid = null;
let basePresenceStatus = "Offline";

function showToast(message) {
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2800);
}
function escapeHtml(value) {
  return String(value ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function createChatId(uid1, uid2) { return [uid1, uid2].sort().join("_"); }
function formatTime(timestamp) {
  if (!timestamp?.toDate) return "Sending…";
  try { return timestamp.toDate().toLocaleString(); } catch { return ""; }
}
function localeBase(value) {
  if (!value || typeof value !== "string") return "";
  try {
    // Accept valid BCP-47 language tags instead of restricting users to a short fixed list.
    const language = new Intl.Locale(value.trim().replaceAll("_", "-")).language.toLowerCase();
    return /^[a-z]{2,3}$/.test(language) ? language : "";
  } catch { return ""; }
}
function getUserLanguage(profile) {
  return localeBase(profile?.preferredLanguage) ||
    localeBase(profile?.preferred_language) ||
    localeBase(profile?.language) || localeBase(profile?.locale) || "en";
}
function initials(name) { return (String(name || "Z").trim().charAt(0) || "Z").toLocaleUpperCase(); }

onAuthStateChanged(auth, async user => {
  if (!user) {
    showToast("Please log in first.");
    setTimeout(() => { location.href = "login.html"; }, 900);
    return;
  }
  currentUser = user;
  try {
    const myProfile = await getDoc(doc(db, "profiles", user.uid));
    if (myProfile.exists()) currentUserLanguage = getUserLanguage(myProfile.data());
  } catch (error) {
    console.warn("Could not load your preferred language from profile; using device language.", error);
  }
  setupPresence();
  await loadUsers();
});

function setupPresence() {
  if (!currentUser || presenceSetupForUid === currentUser.uid) return;
  presenceSetupForUid = currentUser.uid;
  const connectedRef = ref(rtdb, ".info/connected");
  const myStatusRef = ref(rtdb, "status/" + currentUser.uid);
  unsubscribeConnection = onValue(connectedRef, async snapshot => {
    if (snapshot.val() !== true || !currentUser) return;
    try {
      await onDisconnect(myStatusRef).set({ state: "offline", lastChanged: databaseServerTimestamp() });
      await set(myStatusRef, { state: "online", lastChanged: databaseServerTimestamp() });
    } catch (error) {
      console.error("Presence setup error:", error);
    }
  });
}

async function loadUsers() {
  usersList.innerHTML = '<div class="loading">Loading users…</div>';
  try {
    const profilesQuery = query(collection(db, "profiles"));
    unsubscribeUsers = onSnapshot(profilesQuery, snapshot => {
      allUsers = [];
      snapshot.forEach(profileSnapshot => {
        const profile = profileSnapshot.data() || {};
        const uid = profileSnapshot.id;
        if (!currentUser || uid === currentUser.uid) return;
        allUsers.push({
          uid,
          displayName: profile.displayName || profile.fullName || profile.name || "Zemivo User",
          email: profile.email || "",
          photoURL: profile.photoURL || profile.photoUrl || "",
          language: getUserLanguage(profile),
          country: profile.country || "",
          countryName: profile.countryName || ""
        });
      });
      allUsers.sort((a,b) => a.displayName.localeCompare(b.displayName));
      filterAndRenderUsers();
    }, error => {
      console.error("Users listener error:", error);
      usersList.innerHTML = '<div class="error">Could not load users. Check Firestore permissions and profiles collection.</div>';
    });
  } catch (error) {
    console.error("Users load error:", error);
    usersList.innerHTML = '<div class="error">Could not load users.</div>';
  }
}

function filterAndRenderUsers() {
  const term = userSearch.value.trim().toLocaleLowerCase();
  const filtered = !term ? allUsers : allUsers.filter(user =>
    user.displayName.toLocaleLowerCase().includes(term) ||
user.countryName.toLocaleLowerCase().includes(term)
  );
  renderUsers(filtered);
}
function renderUsers(users) {
  usersList.innerHTML = "";
  if (!users.length) {
    usersList.innerHTML = '<div class="loading">No other Zemivo users found yet.</div>';
    return;
  }
  users.forEach(user => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "user-item" + (selectedUser?.uid === user.uid ? " active" : "");
    const avatar = user.photoURL
      ? `<img src="${escapeHtml(user.photoURL)}" class="user-avatar" alt="" loading="lazy">`
      : `<div class="user-avatar">${escapeHtml(initials(user.displayName))}</div>`;
     button.innerHTML = `${avatar}<div class="user-meta"><div class="user-name">${escapeHtml(user.displayName)}</div><div class="user-email">${escapeHtml(user.countryName || "Zemivo member")} · ${escapeHtml(user.language.toUpperCase())}</div></div>`;
    button.addEventListener("click", () => selectUser(user));
    usersList.appendChild(button);
  });
}
userSearch.addEventListener("input", filterAndRenderUsers);

function clearChatListeners() {
  if (unsubscribeMessages) { unsubscribeMessages(); unsubscribeMessages = null; }
  if (unsubscribePresence) { unsubscribePresence(); unsubscribePresence = null; }
  if (unsubscribeTyping) { unsubscribeTyping(); unsubscribeTyping = null; }
}
async function selectUser(user) {
  if (!currentUser || !user?.uid) return;
  setTyping(false);
  clearTimeout(typingTimer);
  clearChatListeners();
  selectedUser = user;
  currentChatId = createChatId(currentUser.uid, user.uid);
  pendingReply = null;
  chatName.textContent = user.displayName;
  chatStatus.textContent = "Checking status…";
  chatStatus.dataset.typing = "false";
  chatAvatar.textContent = user.photoURL ? "" : initials(user.displayName);
  chatAvatar.style.backgroundImage = user.photoURL ? `url("${user.photoURL.replaceAll('"', "%22")}")` : "none";
  chatAvatar.style.backgroundSize = "cover";
  chatAvatar.style.backgroundPosition = "center";
  appElement.classList.add("chat-open");
  messageInput.disabled = true;
  sendButton.disabled = true;
  messagesElement.innerHTML = '<div class="loading">Opening conversation…</div>';
  filterAndRenderUsers();

  const statusRef = ref(rtdb, "status/" + user.uid);
  unsubscribePresence = onValue(statusRef, snapshot => {
    const status = snapshot.val();
    if (status?.state === "online") basePresenceStatus = "🟢 Online";
    else if (status?.lastChanged) {
      const ms = typeof status.lastChanged === "number" ? status.lastChanged : Number(status.lastChanged);
      basePresenceStatus = ms ? "Last seen " + new Date(ms).toLocaleString() : "Offline";
    } else basePresenceStatus = "Offline";
    if (chatStatus.dataset.typing !== "true") chatStatus.textContent = basePresenceStatus;
  }, error => {
    console.warn("Presence read error:", error);
    basePresenceStatus = "Status unavailable";
    if (chatStatus.dataset.typing !== "true") chatStatus.textContent = basePresenceStatus;
  });

  const typingRef = ref(rtdb, "typing/" + currentChatId + "/" + user.uid);
  unsubscribeTyping = onValue(typingRef, snapshot => {
    const isTyping = snapshot.val()?.typing === true;
    chatStatus.dataset.typing = isTyping ? "true" : "false";
    chatStatus.textContent = isTyping ? "✍️ Typing…" : basePresenceStatus;
  }, error => console.warn("Typing listener error:", error));

  try {
    await setDoc(doc(db, "chats", currentChatId), {
      members: [currentUser.uid, user.uid],
      updatedAt: serverTimestamp()
    }, { merge: true });
    if (selectedUser?.uid !== user.uid) return;
    messageInput.disabled = false;
    sendButton.disabled = false;
    startMessageListener();
    messageInput.focus();
  } catch (error) {
    console.error("Chat setup error:", error);
    messagesElement.innerHTML = '<div class="error">Could not open this conversation. Check Firestore chat permissions.</div>';
    showToast("Could not open conversation.");
  }
}

function startMessageListener() {
  if (!selectedUser || !currentChatId) return;
  if (unsubscribeMessages) unsubscribeMessages();
  messagesElement.innerHTML = '<div class="loading">Loading messages…</div>';
  const messagesQuery = query(collection(db, "chats", currentChatId, "messages"), orderBy("createdAt", "asc"));
  unsubscribeMessages = onSnapshot(messagesQuery, snapshot => {
    if (!selectedUser || !currentChatId) return;
    messagesElement.innerHTML = "";
    if (snapshot.empty) {
      messagesElement.innerHTML = `<div class="empty-chat"><div><div style="font-size:38px">👋</div><div style="font-weight:800;margin-top:7px">Start the conversation</div><div style="margin-top:5px;color:#64748b">Send your first message to ${escapeHtml(selectedUser.displayName)}.</div></div></div>`;
      return;
    }
    snapshot.forEach(messageSnapshot => renderMessage(messageSnapshot.data(), messageSnapshot.id));
    messagesElement.scrollTop = messagesElement.scrollHeight;
    void updateMessageReceipts(snapshot);
  }, error => {
    console.error("Message listener error:", error);
    messagesElement.innerHTML = '<div class="error">Could not load messages. Check Firestore permissions.</div>';
  });
}

function renderMessage(message, messageId) {
  const isSent = message.senderId === currentUser?.uid;
  const row = document.createElement("div");
  row.className = "message-row " + (isSent ? "sent" : "received");
  const bubble = document.createElement("div");
  bubble.className = "message";

  if (message.replyText) {
    const quote = document.createElement("div");
    quote.className = "reply-quote";
    quote.textContent = "↩ " + message.replyText;
    bubble.appendChild(quote);
  }
  const original = document.createElement("div");
  original.textContent = message.text || "";
  bubble.appendChild(original);

  if (message.translatedText && message.targetLanguage === getUserLanguageForCurrentViewer()) {
    const translation = document.createElement("div");
    translation.className = "translation";
    translation.innerHTML = `<div class="translation-label">🌍 Translation · ${escapeHtml((message.targetLanguage || "").toUpperCase())}</div>${escapeHtml(message.translatedText)}`;
    bubble.appendChild(translation);
  } else if (message.translatedText && !isSent) {
    const translation = document.createElement("div");
    translation.className = "translation";
    translation.innerHTML = `<div class="translation-label">🌍 Translation</div>${escapeHtml(message.translatedText)}`;
    bubble.appendChild(translation);
  }

  const time = document.createElement("div");
  time.className = "message-time";
  time.textContent = formatTime(message.createdAt);
  if (isSent) {
    const status = document.createElement("span");
    status.style.marginLeft = "5px";
    status.style.fontWeight = "800";
    status.textContent = message.readAt ? "✓✓ Read" : message.deliveredAt ? "✓✓ Delivered" : "✓ Sent";
    time.appendChild(status);
  }
  if (message.edited === true) time.append(" · edited");
  bubble.appendChild(time);

  const actions = document.createElement("div");
  actions.className = "message-actions";
  const replyButton = document.createElement("button");
  replyButton.type = "button";
  replyButton.textContent = "↩ Reply";
  replyButton.addEventListener("click", () => replyToMessage(message));
  actions.appendChild(replyButton);

  if (isSent) {
    const editButton = document.createElement("button");
    editButton.type = "button";
    editButton.textContent = "✏️ Edit";
    editButton.addEventListener("click", () => editMessage(messageId, message.text || ""));
    const deleteButton = document.createElement("button");
    deleteButton.type = "button";
    deleteButton.textContent = "🗑 Delete";
    deleteButton.addEventListener("click", () => deleteMessage(messageId));
    actions.append(editButton, deleteButton);
  }
  bubble.appendChild(actions);
  row.appendChild(bubble);
  messagesElement.appendChild(row);
}

function getUserLanguageForCurrentViewer() {
  // The signed-in user's preferred language should be saved as language/preferredLanguage in profiles/{uid}.
  return currentUserLanguage || localeBase(navigator.language) || "en";
}

async function updateMessageReceipts(snapshot) {
  if (!currentUser || !selectedUser || !currentChatId) return;
  const tasks = [];
  snapshot.forEach(messageSnapshot => {
    const message = messageSnapshot.data();
    if (message.senderId === currentUser.uid) return;
    const patch = {};
    if (!message.deliveredAt) patch.deliveredAt = serverTimestamp();
    if (!message.readAt) patch.readAt = serverTimestamp();
    if (Object.keys(patch).length) {
      tasks.push(updateDoc(doc(db, "chats", currentChatId, "messages", messageSnapshot.id), patch));
    }
  });
  if (tasks.length) {
    try { await Promise.all(tasks); }
    catch (error) { console.warn("Receipt update failed; check Firestore rules.", error); }
  }
}

async function editMessage(messageId, oldText) {
  if (!currentUser || !selectedUser || !currentChatId) return;
  const value = prompt("Edit your message:", oldText);
  if (value === null) return;
  const cleaned = value.trim();
  if (!cleaned) return showToast("Message cannot be empty.");
  if (cleaned === oldText) return;
  try {
    await updateDoc(doc(db, "chats", currentChatId, "messages", messageId), {
      text: cleaned, edited: true, editedAt: serverTimestamp(),
      translatedText: null, targetLanguage: null
    });
    showToast("Message edited.");
  } catch (error) {
    console.error("Edit message error:", error);
    showToast("Message could not be edited. Check Firestore rules.");
  }
}
async function deleteMessage(messageId) {
  if (!currentUser || !selectedUser || !currentChatId) return;
  if (!confirm("Delete this message for everyone?")) return;
  try {
    await deleteDoc(doc(db, "chats", currentChatId, "messages", messageId));
    showToast("Message deleted.");
  } catch (error) {
    console.error("Delete message error:", error);
    showToast("Message could not be deleted. Check Firestore rules.");
  }
}
function replyToMessage(message) {
  pendingReply = { text: String(message.text || "").slice(0, 500) };
  messageInput.value = "";
  messageInput.placeholder = "Replying: " + pendingReply.text.slice(0, 60) + " — type reply…";
  messageInput.focus();
  showToast("Reply selected. Type your reply and press Send.");
}
function setTyping(value) {
  if (!currentUser || !selectedUser || !currentChatId) return;
  const typingRef = ref(rtdb, "typing/" + currentChatId + "/" + currentUser.uid);
  set(typingRef, { typing: value, updatedAt: databaseServerTimestamp() }).catch(error => console.warn("Typing status update failed:", error));
}
let typingTimer = null;
messageInput.addEventListener("input", () => {
  setTyping(true);
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => setTyping(false), 1000);
});

async function translateForRecipient(text, targetLanguage) {
  if (!TRANSLATION_ENDPOINT) return { translatedText: null, reason: "not-configured" };
  const token = await currentUser.getIdToken();
  const response = await fetch(TRANSLATION_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
    body: JSON.stringify({ text, targetLanguage, sourceLanguage: "auto" })
  });
  if (!response.ok) throw new Error("Translation service returned HTTP " + response.status);
  const data = await response.json();
  if (typeof data.translatedText !== "string" || !data.translatedText.trim()) throw new Error("Invalid translation response");
  return { translatedText: data.translatedText, reason: null };
}

async function sendMessage() {
  if (!currentUser || !selectedUser || !currentChatId) {
    showToast("Select a person first.");
    return;
  }
  const text = messageInput.value.trim();
  if (!text) return;
  if (text.length > 5000) return showToast("Message is too long.");
  sendButton.disabled = true;
  const replyText = pendingReply?.text || null;
  try {
    await setDoc(doc(db, "chats", currentChatId), {
      members: [currentUser.uid, selectedUser.uid],
      updatedAt: serverTimestamp(),
      lastMessage: text.slice(0, 300),
      lastSenderId: currentUser.uid
    }, { merge: true });

    let translatedText = null;
    let targetLanguage = selectedUser.language || "en";
    try {
      const translated = await translateForRecipient(text, targetLanguage);
      translatedText = translated.translatedText;
      if (translated.reason === "not-configured") {
        // Keep sending functional while translation service is not yet connected.
        console.info("Translation is not enabled: configure TRANSLATION_ENDPOINT and deploy a secure backend.");
      }
    } catch (translationError) {
      console.error("Translation failed; original message will still be sent:", translationError);
      showToast("Translation unavailable; sending original message.");
    }

    await addDoc(collection(db, "chats", currentChatId, "messages"), {
      senderId: currentUser.uid,
      receiverId: selectedUser.uid,
      text,
      replyTo: null,
      replyText,
      sourceLanguage: "auto",
      targetLanguage: translatedText ? targetLanguage : null,
      translatedText,
      createdAt: serverTimestamp(),
      deliveredAt: null,
      readAt: null
    });
    messageInput.value = "";
    messageInput.placeholder = "Type a message…";
    pendingReply = null;
    setTyping(false);
    messageInput.focus();
  } catch (error) {
    console.error("Send message error:", error);
    showToast("Message could not be sent. Check Firestore permissions.");
  } finally {
    sendButton.disabled = !selectedUser;
  }
}
sendButton.addEventListener("click", sendMessage);
messageInput.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

window.addEventListener("beforeunload", () => {
  clearChatListeners();
  if (unsubscribeUsers) unsubscribeUsers();

    set(ref(rtdb, "typing/" + currentChatId + "/" + currentUser.uid), {
      typing: false, updatedAt: databaseServerTimestamp()
    }).catch(() => {});
  }
});
