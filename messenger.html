<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zemivo Messages</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#f0f2f5;
  color:#17202a;
}

button,
input{
  font-family:inherit;
}

button{
  cursor:pointer;
}

/* HEADER */

.header{
  height:62px;
  background:#fff;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:500;
}

.logo{
  color:#2563eb;
  font-size:27px;
  font-weight:800;
}

.header-actions{
  display:flex;
  gap:8px;
}

.header-button{
  border:0;
  width:40px;
  height:40px;
  border-radius:50%;
  background:#f0f2f5;
  font-size:18px;
}

/* MAIN */

.app{
  position:fixed;
  top:62px;
  left:0;
  right:0;
  bottom:0;
  max-width:1100px;
  margin:auto;
  display:flex;
  background:#fff;
  overflow:hidden;
}

/* USERS */

.users-panel{
  width:320px;
  border-right:1px solid #ddd;
  display:flex;
  flex-direction:column;
  min-height:0;
}

.users-title{
  padding:18px;
  font-size:22px;
  font-weight:bold;
}

.search-box{
  padding:0 14px 14px;
}

.search-box input{
  width:100%;
  padding:12px 14px;
  border:1px solid #ddd;
  border-radius:22px;
  outline:none;
  font-size:15px;
}

.users-list{
  flex:1;
  min-height:0;
  overflow-y:auto;
}

.user-item{
  width:100%;
  border:0;
  background:#fff;
  padding:12px 14px;
  display:flex;
  align-items:center;
  gap:11px;
  text-align:left;
}

.user-item:hover{
  background:#f0f2f5;
}

.user-item.active{
  background:#e8f0ff;
}

.user-avatar{
  width:46px;
  height:46px;
  flex-shrink:0;
  border-radius:50%;
  background:#2563eb;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:17px;
  object-fit:cover;
}

.user-name{
  font-weight:bold;
  color:#17202a;
}

.user-email{
  font-size:12px;
  color:#777;
  margin-top:3px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* CHAT */

.chat-panel{
  flex:1;
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  position:relative;
}

.chat-person{
  height:70px;
  min-height:70px;
  padding:12px 16px;
  border-bottom:1px solid #eee;
  display:flex;
  align-items:center;
  gap:10px;
  background:#fff;
  z-index:20;
}

.chat-person-name{
  font-weight:bold;
}

.chat-person-status{
  color:#777;
  font-size:12px;
  margin-top:3px;
}

.messages{
  flex:1;
  min-height:0;
  padding:18px;
  overflow-y:auto;
  background:#f8fafc;
}

.empty-chat{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#777;
  padding:30px;
}

.message-row{
  display:flex;
  margin-bottom:10px;
}

.message-row.sent{
  justify-content:flex-end;
}

.message-row.received{
  justify-content:flex-start;
}

.message{
  max-width:75%;
  padding:10px 13px;
  border-radius:16px;
  line-height:1.45;
  overflow-wrap:anywhere;
}

.message-row.sent .message{
  background:#2563eb;
  color:#fff;
  border-bottom-right-radius:5px;
}

.message-row.received .message{
  background:#e5e7eb;
  color:#17202a;
  border-bottom-left-radius:5px;
}

.message-time{
  font-size:10px;
  opacity:.7;
  margin-top:5px;
  text-align:right;
}

/* TRANSLATION */

.translation{
  margin-top:6px;
  padding-top:6px;
  border-top:1px solid rgba(0,0,0,.12);
  font-size:12px;
}

.translation-label{
  font-weight:bold;
  margin-bottom:3px;
}

/* COMPOSER */

.composer{
  min-height:66px;
  padding:12px;
  border-top:1px solid #ddd;
  background:#fff;
  display:flex;
  gap:8px;
  align-items:center;
  flex-shrink:0;
  position:relative;
  z-index:100;
}

.attach{
  width:42px;
  height:42px;
  flex-shrink:0;
  border:0;
  border-radius:50%;
  background:#f0f2f5;
  font-size:18px;
}

.composer input{
  flex:1;
  min-width:0;
  height:42px;
  padding:10px 15px;
  border:1px solid #ddd;
  border-radius:24px;
  outline:none;
  font-size:16px;
  background:#fff;
}

.send{
  height:42px;
  flex-shrink:0;
  border:0;
  border-radius:23px;
  padding:0 19px;
  background:#2563eb;
  color:#fff;
  font-weight:bold;
}

.send:disabled{
  opacity:.6;
}

/* STATUS */

.loading{
  text-align:center;
  color:#777;
  padding:25px;
}

.error{
  text-align:center;
  color:#dc2626;
  padding:20px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:80px;
  transform:translateX(-50%);
  background:#111827;
  color:#fff;
  padding:12px 18px;
  border-radius:10px;
  display:none;
  z-index:1000;
  max-width:90%;
  text-align:center;
}

.toast.show{
  display:block;
}

/* NAV */

.bottom-nav{
  display:none;
}

/* MOBILE */

@media(max-width:700px){

  .app{
    top:62px;
    bottom:58px;
    width:100%;
  }

  .users-panel{
    width:100%;
    border-right:0;
  }

  .chat-panel{
    width:100%;
    min-width:100%;
  }

  .app.chat-open .users-panel{
    display:none;
  }

  .app:not(.chat-open) .chat-panel{
    display:none;
  }

  .chat-person{
    height:70px;
    min-height:70px;
  }

  .messages{
    padding:15px;
    padding-bottom:15px;
  }

  .composer{
    position:fixed;
    left:0;
    right:0;
    bottom:58px;
    width:100%;
    min-height:66px;
    padding:10px;
    z-index:600;
  }

  .composer input{
    font-size:16px;
  }

  .send{
    padding:0 15px;
  }

  .attach{
    width:40px;
    height:40px;
  }

  .app.chat-open .messages{
    padding-bottom:82px;
  }

  .back-button{
    display:block;
    border:0;
    background:#f0f2f5;
    width:38px;
    height:38px;
    border-radius:50%;
    font-size:18px;
    flex-shrink:0;
  }

  .users-title{
    padding:14px;
  }

  .bottom-nav{
    display:flex;
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:58px;
    background:#fff;
    border-top:1px solid #ddd;
    z-index:700;
  }

  .bottom-nav a{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    color:#17202a;
    font-size:12px;
  }

  .bottom-nav a.active{
    color:#2563eb;
    font-weight:bold;
  }

}

@media(min-width:701px){

  .back-button{
    display:none;
  }

}

</style>
</head>

<body>

<header class="header">

  <div class="logo">
    Zemivo
  </div>

  <div class="header-actions">

    <button
      class="header-button"
      type="button"
      onclick="location.href='notifications.html'"
    >
      🔔
    </button>

    <button
      class="header-button"
      type="button"
      onclick="location.href='profile.html'"
    >
      👤
    </button>

  </div>

</header>


<main
  id="app"
  class="app"
>

  <section class="users-panel">

    <div class="users-title">
      Messages
    </div>

    <div class="search-box">

      <input
        id="userSearch"
        type="search"
        placeholder="Search people..."
      >

    </div>

    <div
      id="usersList"
      class="users-list"
    >

      <div class="loading">
        Loading Zemivo users...
      </div>

    </div>

  </section>


  <section class="chat-panel">

    <div class="chat-person">

      <button
        id="backButton"
        class="back-button"
        type="button"
      >
        ←
      </button>

      <div
        id="chatAvatar"
        class="user-avatar"
      >
        Z
      </div>

      <div>

        <div
          id="chatName"
          class="chat-person-name"
        >
          Select a person
        </div>

        <div
          id="chatStatus"
          class="chat-person-status"
        >
          Choose someone to start messaging
        </div>

      </div>

    </div>


    <div
      id="messages"
      class="messages"
    >

      <div class="empty-chat">

        <div>

          <div style="font-size:42px;">
            💬
          </div>

          <div style="font-weight:bold;margin-top:8px;">
            Zemivo Messages
          </div>

          <div style="margin-top:5px;">
            Select a person to start a conversation.
          </div>

        </div>

      </div>

    </div>


    <div class="composer">

      <button
        id="attachButton"
        class="attach"
        type="button"
        title="Media coming with Storage integration"
      >
        📎
      </button>

      <input
        id="messageInput"
        type="text"
        placeholder="Type a message..."
        disabled
      >

      <button
        id="sendButton"
        class="send"
        type="button"
        disabled
      >
        Send
      </button>

    </div>

  </section>

</main>


<nav class="bottom-nav">

  <a href="index.html">
    🏠<br>Home
  </a>

  <a href="feed.html">
    📰<br>Feed
  </a>

  <a
    href="messenger.html"
    class="active"
  >
    💬<br>Messages
  </a>

  <a href="profile.html">
    👤<br>Profile
  </a>

</nav>


<div
  id="toast"
  class="toast"
></div>


<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  query,
  orderBy,
  onSnapshot,
  addDoc,
  doc,
  setDoc,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
  getDatabase,
  ref,
  set,
  onValue,
  onDisconnect,
  serverTimestamp as databaseServerTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

/* FIREBASE CONFIG */

const firebaseConfig = {

  apiKey:
    "AIzaSyAxJUFBWm2fa0g3oxUWWqdfSTEAc-bRgfI",

  authDomain:
    "zemivo.firebaseapp.com",

  projectId:
    "zemivo",

  storageBucket:
    "zemivo.firebasestorage.app",

  messagingSenderId:
    "195335939691",

  appId:
    "1:195335939691:web:5fa5c62c53d0c0aefe732e",

  measurementId:
    "G-GNHH5S4H09"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);

const rtdb =
  getDatabase(
    app,
    "https://zemivo-default-rtdb.asia-southeast1.firebasedatabase.app"
  );


/* ELEMENTS */

const appElement =
  document.getElementById("app");

const usersList =
  document.getElementById("usersList");

const userSearch =
  document.getElementById("userSearch");

const messagesElement =
  document.getElementById("messages");

const messageInput =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const attachButton =
  document.getElementById("attachButton");

const chatName =
  document.getElementById("chatName");

const chatStatus =
  document.getElementById("chatStatus");

const chatAvatar =
  document.getElementById("chatAvatar");

const backButton =
  document.getElementById("backButton");

const toast =
  document.getElementById("toast");


/* STATE */

let currentUser = null;

let allUsers = [];

let selectedUser = null;

let unsubscribeMessages = null;

let unsubscribePresence = null;


/* TOAST */

function showToast(text){

  toast.textContent = text;

  toast.classList.add("show");

  setTimeout(function(){

    toast.classList.remove("show");

  },2500);

}


/* ESCAPE HTML */

function escapeHtml(value){

  if(
    value === undefined ||
    value === null
  ){

    return "";

  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* CHAT ID */

function createChatId(uid1,uid2){

  return [uid1,uid2]
    .sort()
    .join("_");

}


/* TIME */

function formatTime(timestamp){

  if(
    !timestamp ||
    !timestamp.toDate
  ){

    return "Sending...";

  }

  return timestamp
    .toDate()
    .toLocaleString();

}


/* AUTH */

onAuthStateChanged(
  auth,
  async function(user){

    if(!user){

      showToast(
        "Please log in first."
      );

      setTimeout(function(){

        location.href =
          "login.html";

      },1200);

      return;

    }

    currentUser =
  user;

setupPresence();

await loadUsers();

  }
);
/* ONLINE / OFFLINE PRESENCE */

function setupPresence(){

  const connectedRef =
    ref(
      rtdb,
      ".info/connected"
    );

  const myStatusRef =
    ref(
      rtdb,
      "status/" + currentUser.uid
    );

  onValue(
    connectedRef,
    function(snapshot){

      if(snapshot.val() !== true){

        return;

      }

      onDisconnect(
        myStatusRef
      ).set({

        state:
          "offline",

        lastChanged:
          databaseServerTimestamp()

      });

      set(
        myStatusRef,
        {

          state:
            "online",

          lastChanged:
            databaseServerTimestamp()

        }
      );

    }
  );

}

/* LOAD USERS */

async function loadUsers(){

  usersList.innerHTML = `

    <div class="loading">
      Loading users...
    </div>

  `;

  try{

    const profilesQuery =
      query(
        collection(
          db,
          "profiles"
        )
      );

    onSnapshot(
      profilesQuery,
      function(snapshot){

        allUsers = [];

        snapshot.forEach(
          function(profileSnapshot){

            const profile =
              profileSnapshot.data();

            const uid =
              profileSnapshot.id;

            if(
              currentUser &&
              uid === currentUser.uid
            ){

              return;

            }

          allUsers.push({

  uid:
    uid,

  displayName:
    profile.displayName ||
    profile.name ||
    "Zemivo User",

  email:
    profile.email ||
    "",

  photoURL:
    profile.photoURL ||
    profile.photoUrl ||
    ""

});

          }
        );

        renderUsers(
          allUsers
        );

      },
      function(error){

        console.error(
          "Users error:",
          error
        );

        usersList.innerHTML = `

          <div class="error">
            Could not load users.
          </div>

        `;

      }
    );

  }
  catch(error){

    console.error(error);

    usersList.innerHTML = `

      <div class="error">
        Could not load users.
      </div>

    `;

  }

}


/* RENDER USERS */

function renderUsers(users){

  usersList.innerHTML = "";

  if(users.length === 0){

    usersList.innerHTML = `

      <div class="loading">
        No other Zemivo users found yet.
      </div>

    `;

    return;

  }

  users.forEach(
    function(user){

      const button =
        document.createElement("button");

      button.className =
        "user-item";

      if(
        selectedUser &&
        selectedUser.uid ===
        user.uid
      ){

        button.classList.add(
          "active"
        );

      }

    const initial =
  user.displayName
    .charAt(0)
    .toUpperCase();

button.innerHTML = `

  ${
    user.photoURL
    ?
    `<img
      src="${escapeHtml(user.photoURL)}"
      class="user-avatar"
      alt=""
    >`
    :
    `<div class="user-avatar">
      ${escapeHtml(initial)}
    </div>`
  }

  <div style="min-width:0;">

    <div class="user-name">
      ${escapeHtml(
        user.displayName
      )}
    </div>

    <div class="user-email">
      ${escapeHtml(
        user.email
      )}
    </div>

  </div>

`;
      button.addEventListener(
        "click",
        function(){

          selectUser(
            user
          );

        }
      );

      usersList.appendChild(
        button
      );

    }
  );

}


/* SEARCH */

userSearch.addEventListener(
  "input",
  function(){

    const search =
      userSearch.value
        .trim()
        .toLowerCase();

    if(!search){

      renderUsers(
        allUsers
      );

      return;

    }

    const filtered =
      allUsers.filter(
        function(user){

          return (

            user.displayName
              .toLowerCase()
              .includes(search)

            ||

            user.email
              .toLowerCase()
              .includes(search)

          );

        }
      );

    renderUsers(
      filtered
    );

  }
);


/* SELECT USER */

async function selectUser(user){

  selectedUser =
    user;

  chatName.textContent =
    user.displayName;

  chatStatus.textContent =
  "Checking status...";

if(unsubscribePresence){

  unsubscribePresence();

  unsubscribePresence =
    null;

}

const selectedStatusRef =
  ref(
    rtdb,
    "status/" + user.uid
  );

unsubscribePresence =
  onValue(
    selectedStatusRef,
    function(snapshot){

      const status =
        snapshot.val();

      if(
        status &&
        status.state === "online"
      ){

        chatStatus.textContent =
          "🟢 Online";

        return;

      }

      if(
        status &&
        status.lastChanged
      ){

        const lastSeen =
          new Date(
            status.lastChanged
          );

        chatStatus.textContent =
          "Last seen " +
          lastSeen.toLocaleString();

        return;

      }

      chatStatus.textContent =
        "Offline";

    }
  );

if(user.photoURL){

  chatAvatar.textContent = "";

  chatAvatar.style.backgroundImage =
    `url("${escapeHtml(user.photoURL)}")`;

  chatAvatar.style.backgroundSize =
    "cover";

  chatAvatar.style.backgroundPosition =
    "center";

}
else{

  chatAvatar.style.backgroundImage =
    "none";

  chatAvatar.textContent =
    user.displayName
      .charAt(0)
      .toUpperCase();

}

  appElement.classList.add(
    "chat-open"
  );

  messageInput.disabled =
    true;

  sendButton.disabled =
    true;

  renderUsers(
    allUsers
  );

  const chatId =
    createChatId(
      currentUser.uid,
      selectedUser.uid
    );

  try{

    const chatRef =
      doc(
        db,
        "chats",
        chatId
      );

    await setDoc(
      chatRef,
      {
        members: [
          currentUser.uid,
          selectedUser.uid
        ],
        updatedAt:
          serverTimestamp()
      },
      {
        merge:true
      }
    );

    messageInput.disabled =
      false;

    sendButton.disabled =
      false;

    messageInput.focus();

    startMessageListener();

  }
  catch(error){

    console.error(
      "Chat setup error:",
      error
    );

    messageInput.disabled =
      true;

    sendButton.disabled =
      true;

    messagesElement.innerHTML = `

      <div class="error">
        Could not open this conversation.
      </div>

    `;

  }

}


/* MESSAGE LISTENER */

function startMessageListener(){

  if(!selectedUser){

    return;

  }

if(unsubscribePresence){

  unsubscribePresence();

  unsubscribePresence =
    null;

}

messagesElement.innerHTML = `

    <div class="loading">
      Loading conversation...
    </div>

  `;

  const chatId =
    createChatId(
      currentUser.uid,
      selectedUser.uid
    );

  const messagesQuery =
    query(
      collection(
        db,
        "chats",
        chatId,
        "messages"
      ),
      orderBy(
        "createdAt",
        "asc"
      )
    );

  unsubscribeMessages =
    onSnapshot(
      messagesQuery,
      function(snapshot){

        messagesElement.innerHTML =
          "";

        if(snapshot.empty){

          messagesElement.innerHTML = `

            <div class="empty-chat">

              <div>

                <div style="font-size:38px;">
                  👋
                </div>

                <div style="font-weight:bold;margin-top:7px;">
                  Start the conversation
                </div>

                <div style="margin-top:5px;color:#777;">
                  Send your first message to
                  ${escapeHtml(
                    selectedUser.displayName
                  )}.
                </div>

              </div>

            </div>

          `;

          return;

        }

        snapshot.forEach(
          function(messageSnapshot){

            const message =
              messageSnapshot.data();

            renderMessage(
              message
            );

          }
        );

        messagesElement.scrollTop =
          messagesElement.scrollHeight;

      },
      function(error){

        console.error(
          "Message listener error:",
          error
        );

        messagesElement.innerHTML = `

          <div class="error">
            Could not load messages.<br>
            Please check Firestore permissions.
          </div>

        `;

      }
    );

}


/* RENDER MESSAGE */

function renderMessage(message){

  const isSent =
    message.senderId ===
    currentUser.uid;

  const row =
    document.createElement("div");

  row.className =
    "message-row " +
    (
      isSent
      ?
      "sent"
      :
      "received"
    );

  const bubble =
    document.createElement("div");

  bubble.className =
    "message";

  const original =
    document.createElement("div");

  original.textContent =
    message.text || "";

  bubble.appendChild(
    original
  );


  if(
    message.translatedText
  ){

    const translation =
      document.createElement("div");

    translation.className =
      "translation";

    translation.innerHTML = `

      <div class="translation-label">
        🌍 Translation
      </div>

      ${escapeHtml(
        message.translatedText
      )}

    `;

    bubble.appendChild(
      translation
    );

  }


  const time =
    document.createElement("div");

  time.className =
    "message-time";

  time.textContent =
    formatTime(
      message.createdAt
    );

  bubble.appendChild(
    time
  );

  row.appendChild(
    bubble
  );

  messagesElement.appendChild(
    row
  );

}


/* SEND MESSAGE */

async function sendMessage(){

  if(
    !currentUser ||
    !selectedUser
  ){

    showToast(
      "Select a person first."
    );

    return;

  }

  const text =
    messageInput.value.trim();

  if(!text){

    return;

  }

  sendButton.disabled =
    true;

  const chatId =
    createChatId(
      currentUser.uid,
      selectedUser.uid
    );

  try{

    const chatRef =
      doc(
        db,
        "chats",
        chatId
      );

    await setDoc(
      chatRef,
      {
        members: [
          currentUser.uid,
          selectedUser.uid
        ],
        updatedAt:
          serverTimestamp()
      },
      {
        merge:true
      }
    );

    await addDoc(
      collection(
        db,
        "chats",
        chatId,
        "messages"
      ),
      {

        senderId:
          currentUser.uid,

        receiverId:
          selectedUser.uid,

        text:
          text,

        sourceLanguage:
          null,

        targetLanguage:
          null,

        translatedText:
          null,

        createdAt:
          serverTimestamp()

      }
    );

    messageInput.value =
      "";

    messageInput.focus();

  }
  catch(error){

    console.error(
      "Send message error:",
      error
    );

    showToast(
      "Message could not be sent."
    );

  }

  sendButton.disabled =
    false;

}


/* SEND BUTTON */

sendButton.addEventListener(
  "click",
  sendMessage
);


/* ENTER */

messageInput.addEventListener(
  "keydown",
  function(event){

    if(
      event.key ===
      "Enter"
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* ATTACHMENT */

attachButton.addEventListener(
  "click",
  function(){

    showToast(
      "Media messaging will be connected with Firebase Storage."
    );

  }
);


/* BACK */

backButton.addEventListener(
  "click",
  function(){

    appElement.classList.remove(
      "chat-open"
    );

    if(unsubscribeMessages){

      unsubscribeMessages();

      unsubscribeMessages =
        null;

    }

  }
);


/* CLEANUP */

window.addEventListener(
  "beforeunload",
  function(){

    if(unsubscribeMessages){

      unsubscribeMessages();

    }

  }
);

</script>

</body>
</html>
