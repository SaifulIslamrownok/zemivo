<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zemivo - Support</title>
<style>
body{font-family:Arial;background:#f4f6f8}.card{background:white;max-width:700px;margin:30px auto;padding:25px;border-radius:15px}textarea{width:100%;height:120px;padding:12px;border:1px solid #ddd;border-radius:10px}button{background:#2563eb;color:white;border:0;padding:10px 18px;border-radius:20px;margin-top:10px}
</style>
</head>
<body>
<div class="card">
<h1>🆘 Support</h1>
<p>Contact Zemivo Support.</p>
<textarea id="msg" placeholder="Describe your problem..."></textarea>
<br>
<button onclick="send()">Send Request</button>
</div>
<script>
function send(){
if(document.getElementById("msg").value.trim()===""){alert("Write your message first");return}
alert("Support request submitted");
}
</script>
</body>
</html>
