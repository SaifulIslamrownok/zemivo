<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zemivo Home</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
      padding-bottom: 80px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: white;
      padding: 13px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .logo {
      font-size: 27px;
      font-weight: bold;
      color: #2563eb;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .top-actions button {
      border: none;
      background: #eef2ff;
      padding: 9px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 16px;
    }

    .container {
      max-width: 850px;
      margin: 22px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    .welcome h2 {
      margin: 0 0 8px;
    }

    .welcome p {
      margin: 0;
      color: #666;
      line-height: 1.5;
    }

    .user-email {
      margin-top: 12px;
      color: #2563eb;
      font-size: 14px;
      word-break: break-word;
    }

    .post-input {
      width: 100%;
      min-height: 100px;
      resize: vertical;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      outline: none;
    }

    .post-input:focus {
      border-color: #2563eb;
    }

    .post-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    .post-button {
      border: none;
      background: #2563eb;
      color: white;
      padding: 12px 22px;
      border-radius: 24px;
      font-weight: bold;
      cursor: pointer;
    }

    .post-button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .status {
      margin-top: 10px;
      text-align: center;
      font-size: 14px;
    }

    .success {
      color: #15803d;
    }

    .error {
      color: #dc2626;
    }

    .section-title {
      font-size: 21px;
      font-weight: bold;
      margin: 20px 0 12px;
    }

    .post {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 20px;
    }

    .post-name {
      font-weight: bold;
    }

    .post-time {
      color: #777;
      font-size: 12px;
      margin-top: 3px;
    }

    .post-text {
      margin: 16px 0;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .post-buttons {
      border-top: 1px solid #eee;
      padding-top: 10px;
      display: flex;
      justify-content: space-around;
      gap: 4px;
    }

    .post-buttons button {
      border: none;
      background: transparent;
      padding: 9px 7px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      flex: 1;
    }

    .post-buttons button:hover {
      background: #f1f5f9;
    }

    .spark-button {
      color: #7c3aed;
    }

    .spark-button.sparked {
      color: #2563eb;
      background: #eef2ff;
    }

    .spark-count {
      display: block;
      text-align: center;
      margin-top: 8px;
      color: #7c3aed;
      font-size: 13px;
      font-weight: bold;
    }

    .loading {
      text-align: center;
      padding: 35px;
      color: #666;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 25px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 200;
      background: white;
      display: flex;
      justify-content: space-around;
      padding: 9px 4px;
      box-shadow: 0 -2px 10px rgba(0,0,0,.08);
    }

    .nav-item {
      text-decoration: none;
      color: #555;
      text-align: center;
      font-size: 11px;
      font-weight: bold;
    }

    .nav-item span {
      display: block;
      font-size: 20px;
      margin-bottom: 2px;
    }

    .nav-item.active {
      color: #2563eb;
    }

    @media (max-width: 600px) {

      .logo {
        font-size: 23px;
      }

      .container {
        margin-top: 15px;
      }

      .post-buttons button {
        font-size: 12px;
        padding: 8px 3px;
      }
    }
  </style>
</head>


<body>

  <header class="topbar">

    <div class="logo">
      Zemivo
    </div>

    <div class="top-actions">

      <button onclick="openPage('search.html')">
        🔍
      </button>

      <button onclick="openPage('notifications.html')">
        🔔
      </button>

    </div>

  </header>


  <main class="container">

    <section class="card welcome">

      <h2 id="welcomeTitle">
        Welcome to Zemivo 🌍
      </h2>

      <p>
        Connect, discover and share with people around the world.
      </p>

      <div
        class="user-email"
        id="userEmail"
      >
        Checking your account...
      </div>

    </section>


    <section class="card">

      <textarea
        id="postInput"
        class="post-input"
        placeholder="What's on your mind?"
      ></textarea>

      <div class="post-row">

        <button
          id="postButton"
          class="post-button"
        >
          Create Post
        </button>

      </div>

      <div
        id="status"
        class="status"
      ></div>

    </section>


    <div class="section-title">
      🌍 Zemivo Feed
    </div>


    <div id="feed">

      <div class="loading">
        Loading posts...
      </div>

    </div>

  </main>


  <nav class="bottom-nav">

    <a
      class="nav-item active"
      href="home.html"
    >
      <span>🏠</span>
      Home
    </a>

    <a
      class="nav-item"
      href="messenger.html"
    >
      <span>💬</span>
      Messenger
    </a>

    <a
      class="nav-item"
      href="notifications.html"
    >
      <span>🔔</span>
      Alerts
    </a>

    <a
      class="nav-item"
      href="profile.html"
    >
      <span>👤</span>
      Profile
    </a>

    <a
      class="nav-item"
      href="settings.html"
    >
      <span>⚙️</span>
      Settings
    </a>

  </nav>


  <script type="module">

    /* =====================================
       FIREBASE IMPORTS
       ===================================== */

    import {
      initializeApp
    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
      getAuth,
      onAuthStateChanged
    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    import {
      getFirestore,
      collection,
      addDoc,
      doc,
      updateDoc,
      getDoc,
      query,
      orderBy,
      onSnapshot,
      serverTimestamp,
      increment,
      setDoc
    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* =====================================
       FIREBASE CONFIG
       ===================================== */

    const firebaseConfig = {

      apiKey:
        "AIzaSyAxJUFBWm2fa0g3oxUWWqdfSTEAc-bRgfI",

      authDomain:
        "zemivo.firebaseapp.com",

      projectId:
        "zemivo",

      storageBucket:
        "zemivo.firebasestorage.app",

      messagingSenderId:
        "195335939691",

      appId:
        "1:195335939691:web:5fa5c62c53d0c0aefe732e",

      measurementId:
        "G-GNHH5S4H09"

    };


    /* =====================================
       INITIALIZE
       ===================================== */

    const app =
      initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    const db =
      getFirestore(app);


    /* =====================================
       ELEMENTS
       ===================================== */

    const userEmail =
      document.getElementById(
        "userEmail"
      );


    const welcomeTitle =
      document.getElementById(
        "welcomeTitle"
      );


    const postInput =
      document.getElementById(
        "postInput"
      );


    const postButton =
      document.getElementById(
        "postButton"
      );


    const feed =
      document.getElementById(
        "feed"
      );


    const status =
      document.getElementById(
        "status"
      );


    let currentUser = null;


    /* =====================================
       AUTHENTICATION
       ===================================== */

    onAuthStateChanged(
      auth,
      function(user) {

        if (!user) {

          window.location.href =
            "login.html";

          return;

        }


        currentUser = user;


        const email =
          user.email || "Zemivo User";


        userEmail.textContent =
          "Logged in as: " + email;


        let name =
          email.split("@")[0];


        name =
          name.replace(
            /[._-]/g,
            " "
          );


        name =
          name.replace(
            /\b\w/g,
            function(letter) {
              return letter.toUpperCase();
            }
          );


        welcomeTitle.textContent =
          "Welcome, " +
          name +
          " 🌍";


        loadPosts();

      }
    );


    /* =====================================
       CREATE POST
       ===================================== */

    postButton.addEventListener(
      "click",
      async function() {

        if (!currentUser) {

          showStatus(
            "Please login first.",
            "error"
          );

          return;

        }


        const text =
          postInput.value.trim();


        if (!text) {

          showStatus(
            "Please write something first.",
            "error"
          );

          return;

        }


        postButton.disabled = true;

        postButton.textContent =
          "Saving...";


        try {

          await addDoc(
            collection(
              db,
              "posts"
            ),
            {

              text: text,

              userId:
                currentUser.uid,

              email:
                currentUser.email || "",

              createdAt:
                serverTimestamp(),

              likes:
                0,

              comments:
                0,

              shares:
                0,

              sparks:
                0

            }
          );


          postInput.value = "";


          showStatus(
            "Post saved successfully! ✅",
            "success"
          );


        } catch (error) {

          console.error(
            "Post save error:",
            error
          );


          showStatus(
            "Post could not be saved.",
            "error"
          );

        }


        postButton.disabled = false;

        postButton.textContent =
          "Create Post";

      }
    );


    /* =====================================
       LOAD POSTS
       ===================================== */

    function loadPosts() {

      const postsQuery =
        query(
          collection(
            db,
            "posts"
          ),
          orderBy(
            "createdAt",
            "desc"
          )
        );


      onSnapshot(
        postsQuery,
        function(snapshot) {

          feed.innerHTML = "";


          if (
            snapshot.empty
          ) {

            feed.innerHTML =
              '<div class="empty">' +
              'No posts yet. Be the first to post! 🌍' +
              '</div>';

            return;

          }


          snapshot.forEach(
            function(postDoc) {

              const post =
                postDoc.data();


              displayPost(
                postDoc.id,
                post
              );

            }
          );

        },

        function(error) {

          console.error(
            "Feed error:",
            error
          );


          feed.innerHTML =
            '<div class="empty">' +
            'Unable to load posts. Please check Firestore rules.' +
            '</div>';

        }
      );

    }


    /* =====================================
       DISPLAY POST
       ===================================== */

    function displayPost(
      postId,
      post
    ) {

      const article =
        document.createElement(
          "article"
        );


      article.className =
        "post";


      let name =
        post.email
          ? post.email.split("@")[0]
          : "Zemivo User";


      name =
        name.replace(
          /[._-]/g,
          " "
        );


      name =
        name.replace(
          /\b\w/g,
          function(letter) {
            return letter.toUpperCase();
          }
        );


      const avatarLetter =
        name.charAt(0)
          .toUpperCase() || "Z";


      const sparkCount =
        Number(post.sparks || 0);


      article.innerHTML = `

        <div class="post-header">

          <div class="avatar">
            ${escapeHTML(avatarLetter)}
          </div>

          <div>

            <div class="post-name">
              ${escapeHTML(name)}
            </div>

            <div class="post-time">
              Zemivo User
            </div>

          </div>

        </div>


        <div class="post-text">
          ${escapeHTML(post.text || "")}
        </div>


        <div class="post-buttons">

          <button
            onclick="likePost(this)"
          >
            👍 Like
          </button>


          <button
            onclick="commentPost()"
          >
            💬 Comment
          </button>


          <button
            onclick="sharePost()"
          >
            🔗 Share
          </button>


          <button
            class="spark-button"
            data-post-id="${postId}"
            onclick="sparkPost(this)"
          >
            ✨ Spark
          </button>

        </div>


        <div
          class="spark-count"
          id="spark-count-${postId}"
        >
          ✨ ${sparkCount} Sparks
        </div>

      `;


      feed.appendChild(
        article
      );

    }


    /* =====================================
       SPARK SYSTEM
       ===================================== */

    window.sparkPost =
      async function(button) {

        if (!currentUser) {

          showStatus(
            "Please login first.",
            "error"
          );

          return;

        }


        const postId =
          button.dataset.postId;


        if (!postId) {
          return;
        }


        button.disabled = true;


        try {

          const sparkId =
            currentUser.uid +
            "_" +
            postId;


          const sparkRef =
            doc(
              db,
              "postSparks",
              sparkId
            );


          const existingSpark =
            await getDoc(
              sparkRef
            );


          if (
            existingSpark.exists()
          ) {

            button.classList.add(
              "sparked"
            );

            button.textContent =
              "✨ Sparked";

            button.disabled = true;

            return;

          }


          await setDoc(
            sparkRef,
            {

              userId:
                currentUser.uid,

              postId:
                postId,

              createdAt:
                serverTimestamp()

            }
          );


          const postRef =
            doc(
              db,
              "posts",
              postId
            );


          await updateDoc(
            postRef,
            {

              sparks:
                increment(1)

            }
          );


          button.classList.add(
            "sparked"
          );


          button.textContent =
            "✨ Sparked";


          showStatus(
            "Spark added! ✨",
            "success"
          );


        } catch (error) {

          console.error(
            "Spark error:",
            error
          );


          showStatus(
            "Spark could not be added.",
            "error"
          );


          button.disabled = false;

        }

      };


    /* =====================================
       LIKE
       ===================================== */

    window.likePost =
      function(button) {

        button.textContent =
          "❤️ Liked";

      };


    /* =====================================
       COMMENT
       ===================================== */

    window.commentPost =
      function() {

        alert(
          "Comment system will be connected next."
        );

      };


    /* =====================================
       SHARE
       ===================================== */

    window.sharePost =
      function() {

        if (
          navigator.share
        ) {

          navigator.share({

            title:
              "Zemivo",

            text:
              "Check this post on Zemivo."

          });

        } else {

          alert(
            "Share system will be connected next."
          );

        }

      };


    /* =====================================
       SAFE HTML
       ===================================== */

    function escapeHTML(text) {

      const div =
        document.createElement(
          "div"
        );


      div.textContent =
        text;


      return div.innerHTML;

    }


    /* =====================================
       STATUS
       ===================================== */

    function showStatus(
      message,
      type
    ) {

      status.textContent =
        message;


      status.className =
        "status " + type;


      setTimeout(
        function() {

          status.textContent =
            "";

          status.className =
            "status";

        },
        4000
      );

    }


    /* =====================================
       NAVIGATION
       ===================================== */

    window.openPage =
      function(page) {

        window.location.href =
          page;

      };

  </script>

</body>
</html>
