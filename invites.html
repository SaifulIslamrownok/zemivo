<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zemivo - Invites</title>
<style>
body{font-family:Arial;background:#f4f6f8}.card{background:white;max-width:700px;margin:30px auto;padding:25px;border-radius:15px}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px}button{background:#2563eb;color:white;border:0;padding:10px 18px;border-radius:20px;margin-top:10px}
</style>
</head>
<body>
<div class="card">
<h1>👋 Invite Friends</h1>
<p>Invite people to join Zemivo.</p>
<input id="email" placeholder="Enter email or phone">
<button onclick="invite()">Send Invite</button>
</div>
<script>
function invite(){
let x=document.getElementById("email").value.trim();
if(!x){alert("Enter an email or phone");return}
alert("Invitation sent");
}
</script>
</body>
</html>
