<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">

  <title>Zemivo — Home</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --danger: #dc2626;
      --success: #15803d;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       HEADER
    ========================= */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      height: 62px;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
    }

    .brand {
      color: var(--primary);
      font-size: 28px;
      font-weight: 800;
      text-decoration: none;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .top-btn {
      border: 0;
      background: #f1f5f9;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 18px;
    }

    /* =========================
       PAGE
    ========================= */

    .page {
      width: 100%;
      max-width: 680px;
      margin: 24px auto;
      padding: 0 12px;
    }

    /* =========================
       COMPOSER
    ========================= */

    .composer {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
    }

    .composer-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #60a5fa);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
    }

    .mind-box {
      width: 100%;
      min-height: 95px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      outline: none;
      background: #f8fafc;
    }

    .mind-box:focus {
      border-color: var(--primary);
      background: white;
    }

    /* Everything related to creating a post stays INSIDE composer */

    .composer-tools {
      margin-top: 12px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      background: #fafafa;
    }

    .tool-btn {
      border: 0;
      background: white;
      border: 1px solid var(--border);
      padding: 9px 12px;
      border-radius: 10px;
      color: #334155;
      font-weight: 600;
    }

    .tool-btn:hover {
      background: #eff6ff;
      border-color: #bfdbfe;
    }

    .selected-file {
      margin-top: 10px;
      display: none;
      padding: 10px;
      border-radius: 10px;
      background: #eff6ff;
      color: #1e40af;
      font-size: 14px;
    }

    .preview {
      display: none;
      margin-top: 10px;
      border-radius: 12px;
      overflow: hidden;
      background: #f8fafc;
    }

    .preview img,
    .preview video {
      width: 100%;
      max-height: 420px;
      object-fit: contain;
      display: block;
    }

    .composer-bottom {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    .post-btn {
      border: 0;
      background: var(--primary);
      color: white;
      padding: 11px 28px;
      border-radius: 24px;
      font-weight: bold;
    }

    .post-btn:hover {
      background: var(--primary-dark);
    }

    .post-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* =========================
       FEED
    ========================= */

    .feed {
      margin-top: 18px;
    }

    .empty {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      text-align: center;
      color: var(--muted);
    }

    /* =========================
       POST CARD
    ========================= */

    .post {
      position: relative;
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .post-header {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .post-user {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .post-user-info {
      display: flex;
      flex-direction: column;
    }

    .post-name {
      font-weight: bold;
    }

    .post-time {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .more-btn {
      border: 0;
      background: transparent;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 22px;
      color: #475569;
    }

    .more-btn:hover {
      background: #f1f5f9;
    }

    .post-content {
      padding: 0 16px 14px;
      white-space: pre-wrap;
      word-wrap: break-word;
      line-height: 1.55;
    }

    .post-media {
      width: 100%;
      max-height: 520px;
      object-fit: contain;
      display: block;
      background: #f8fafc;
    }

    .post-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .post-action {
      border: 0;
      background: white;
      padding: 12px 5px;
      color: #475569;
      font-weight: 600;
    }

    .post-action:hover {
      background: #f8fafc;
    }

    /* =========================
       THREE DOT MENU
    ========================= */

    .menu {
      position: absolute;
      top: 56px;
      right: 12px;
      width: 210px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.16);
      display: none;
      z-index: 50;
      overflow: hidden;
    }

    .menu.open {
      display: block;
    }

    .menu button {
      width: 100%;
      text-align: left;
      border: 0;
      background: white;
      padding: 12px 14px;
      color: #334155;
    }

    .menu button:hover {
      background: #f8fafc;
    }

    .menu .danger {
      color: var(--danger);
    }

    /* =========================
       MODAL
    ========================= */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 2000;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 520px;
      background: white;
      border-radius: 16px;
      padding: 18px;
    }

    .modal h3 {
      margin-top: 0;
    }

    .edit-area {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
    }

    .cancel-btn,
    .save-btn {
      border: 0;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: bold;
    }

    .cancel-btn {
      background: #e2e8f0;
      color: #334155;
    }

    .save-btn {
      background: var(--primary);
      color: white;
    }

    /* =========================
       MESSAGE
    ========================= */

    #status {
      text-align: center;
      margin: 12px 0;
      font-size: 14px;
      min-height: 20px;
    }

    .status-success {
      color: var(--success);
    }

    .status-error {
      color: var(--danger);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .topbar {
        padding: 0 12px;
      }

      .brand {
        font-size: 24px;
      }

      .page {
        margin-top: 12px;
      }

      .composer,
      .post {
        border-radius: 12px;
      }

      .composer-tools {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .tool-btn {
        width: 100%;
      }

      .post-actions {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       ZEMIVO HEADER
  ========================= -->

  <header class="topbar">

    <a class="brand" href="index.html">
      Zemivo
    </a>

    <div class="top-actions">
      <button class="top-btn" title="Search">🔍</button>
      <button class="top-btn" title="Notifications">🔔</button>
      <button
        class="top-btn"
        title="Profile"
        onclick="window.location.href='profile.html'"
      >
        👤
      </button>
    </div>

  </header>


  <main class="page">

    <!-- =========================
         COMPOSER
    ========================= -->

    <section class="composer">

      <div class="composer-title">

        <div class="avatar">
          Z
        </div>

        <strong>
          Create a post
        </strong>

      </div>


      <textarea
        id="postText"
        class="mind-box"
        placeholder="What's on your mind?"
      ></textarea>


      <!--
        IMPORTANT:
        All post creation options are INSIDE
        the composer.
      -->

      <div class="composer-tools">

        <button
          type="button"
          class="tool-btn"
          id="photoButton"
        >
          🖼️ Photo
        </button>

        <button
          type="button"
          class="tool-btn"
          id="videoButton"
        >
          🎥 Video
        </button>

        <button
          type="button"
          class="tool-btn"
          id="feelingButton"
        >
          😊 Feeling
        </button>

        <button
          type="button"
          class="tool-btn"
          id="morePostButton"
        >
          ➕ More
        </button>

      </div>


      <input
        id="photoInput"
        type="file"
        accept="image/*"
        hidden
      >

      <input
        id="videoInput"
        type="file"
        accept="video/*"
        hidden
      >


      <div
        id="selectedFile"
        class="selected-file"
      ></div>


      <div
        id="preview"
        class="preview"
      ></div>


      <div class="composer-bottom">

        <button
          id="publishButton"
          class="post-btn"
          type="button"
        >
          Post
        </button>

      </div>

    </section>


    <div id="status"></div>


    <!-- =========================
         FEED
    ========================= -->

    <section
      id="feed"
      class="feed"
    >

      <div class="empty" id="emptyFeed">
        No posts yet. Create the first Zemivo post.
      </div>

    </section>

  </main>


  <!-- =========================
       EDIT MODAL
  ========================= -->

  <div
    id="editModalBackdrop"
    class="modal-backdrop"
  >

    <div class="modal">

      <h3>
        Edit your post
      </h3>

      <textarea
        id="editText"
        class="edit-area"
        placeholder="Edit your post..."
      ></textarea>

      <div class="modal-actions">

        <button
          id="cancelEdit"
          class="cancel-btn"
          type="button"
        >
          Cancel
        </button>

        <button
          id="saveEdit"
          class="save-btn"
          type="button"
        >
          Save Changes
        </button>

      </div>

    </div>

  </div>


  <script>

    /*
    ============================================================
      ZEMIVO POST ENGINE
      ------------------------------------------------------------
      This frontend structure is intentionally modular.

      Later we can replace the localStorage layer with:
      Firebase Authentication
      Firestore
      Firebase Storage
      Cloud Functions
      Security Rules

      The UI structure does not need to be rebuilt.
    ============================================================
    */


    const STORAGE_KEY = "zemivo_posts_v1";


    let posts = loadPosts();

    let selectedMedia = null;

    let selectedMediaType = null;

    let editingPostId = null;


    /* =========================
       ELEMENTS
    ========================= */

    const postText =
      document.getElementById("postText");

    const photoButton =
      document.getElementById("photoButton");

    const videoButton =
      document.getElementById("videoButton");

    const feelingButton =
      document.getElementById("feelingButton");

    const morePostButton =
      document.getElementById("morePostButton");

    const photoInput =
      document.getElementById("photoInput");

    const videoInput =
      document.getElementById("videoInput");

    const selectedFile =
      document.getElementById("selectedFile");

    const preview =
      document.getElementById("preview");

    const publishButton =
      document.getElementById("publishButton");

    const feed =
      document.getElementById("feed");

    const status =
      document.getElementById("status");

    const editModalBackdrop =
      document.getElementById("editModalBackdrop");

    const editText =
      document.getElementById("editText");

    const cancelEdit =
      document.getElementById("cancelEdit");

    const saveEdit =
      document.getElementById("saveEdit");


    /* =========================
       LOAD POSTS
    ========================= */

    function loadPosts() {

      try {

        const saved =
          localStorage.getItem(STORAGE_KEY);

        if (!saved) {
          return [];
        }

        return JSON.parse(saved);

      } catch (error) {

        console.error(error);

        return [];

      }

    }


    /* =========================
       SAVE POSTS
    ========================= */

    function savePosts() {

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(posts)
      );

    }


    /* =========================
       STATUS
    ========================= */

    function showStatus(
      text,
      type = ""
    ) {

      status.textContent = text;

      status.className =
        type === "success"
          ? "status-success"
          : type === "error"
            ? "status-error"
            : "";

      setTimeout(
        function() {

          status.textContent = "";

          status.className = "";

        },
        3000
      );

    }


    /* =========================
       FILE SELECTION
    ========================= */

    photoButton.addEventListener(
      "click",
      function() {

        photoInput.click();

      }
    );


    videoButton.addEventListener(
      "click",
      function() {

        videoInput.click();

      }
    );


    photoInput.addEventListener(
      "change",
      function() {

        handleMedia(
          photoInput.files[0],
          "image"
        );

      }
    );


    videoInput.addEventListener(
      "change",
      function() {

        handleMedia(
          videoInput.files[0],
          "video"
        );

      }
    );


    function handleMedia(
      file,
      type
    ) {

      if (!file) {
        return;
      }


      selectedMedia =
        file;

      selectedMediaType =
        type;


      selectedFile.style.display =
        "block";

      selectedFile.textContent =
        "Selected: " + file.name;


      preview.innerHTML = "";

      preview.style.display =
        "block";


      const reader =
        new FileReader();


      reader.onload =
        function(event) {

          if (type === "image") {

            const img =
              document.createElement("img");

            img.src =
              event.target.result;

            img.alt =
              "Selected image";

            preview.appendChild(img);

          }

          else {

            const video =
              document.createElement("video");

            video.src =
              event.target.result;

            video.controls =
              true;

            preview.appendChild(video);

          }

        };


      reader.readAsDataURL(file);

    }


    /* =========================
       FEELING
    ========================= */

    feelingButton.addEventListener(
      "click",
      function() {

        const feeling =
          prompt(
            "How are you feeling? Example: Happy, Excited, Grateful"
          );

        if (!feeling) {
          return;
        }

        postText.value +=
          " 😊 Feeling " +
          feeling;

        postText.focus();

      }
    );


    /* =========================
       MORE
    ========================= */

    morePostButton.addEventListener(
      "click",
      function() {

        alert(
          "More Zemivo post features will be added here later."
        );

      }
    );


    /* =========================
       CREATE POST
    ========================= */

    publishButton.addEventListener(
      "click",
      async function() {

        const text =
          postText.value.trim();


        if (
          text === "" &&
          !selectedMedia
        ) {

          showStatus(
            "Write something or add a photo/video first.",
            "error"
          );

          return;

        }


        publishButton.disabled =
          true;

        publishButton.textContent =
          "Posting...";


        try {

          let mediaData =
            null;


          /*
            NOTE:

            localStorage is only for this prototype.

            Later the file will go to secure
            Firebase Storage instead.
          */

          if (selectedMedia) {

            mediaData =
              await fileToDataURL(
                selectedMedia
              );

          }


          const post = {

            id:
              createId(),

            author: {

              uid:
                "demo-user",

              name:
                "Zemivo User"

            },

            text:
              text,

            media:
              mediaData,

            mediaType:
              selectedMediaType,

            createdAt:
              Date.now(),

            updatedAt:
              null

          };


          posts.unshift(post);

          savePosts();

          clearComposer();

          renderFeed();


          showStatus(
            "Post published successfully.",
            "success"
          );


        } catch (error) {

          console.error(error);

          showStatus(
            "Could not publish the post.",
            "error"
          );

        }


        publishButton.disabled =
          false;

        publishButton.textContent =
          "Post";

      }
    );


    /* =========================
       FILE -> DATA URL
    ========================= */

    function fileToDataURL(file) {

      return new Promise(
        function(resolve, reject) {

          const reader =
            new FileReader();


          reader.onload =
            function() {

              resolve(
                reader.result
              );

            };


          reader.onerror =
            function() {

              reject(
                new Error(
                  "File could not be read."
                )
              );

            };


          reader.readAsDataURL(file);

        }
      );

    }


    /* =========================
       CLEAR COMPOSER
    ========================= */

    function clearComposer() {

      postText.value =
        "";

      selectedMedia =
        null;

      selectedMediaType =
        null;

      selectedFile.style.display =
        "none";

      selectedFile.textContent =
        "";

      preview.innerHTML =
        "";

      preview.style.display =
        "none";

      photoInput.value =
        "";

      videoInput.value =
        "";

    }


    /* =========================
       CREATE ID
    ========================= */

    function createId() {

      return (
        Date.now().toString(36) +
        Math.random()
          .toString(36)
          .substring(2, 10)
      );

    }


    /* =========================
       RENDER FEED
    ========================= */

    function renderFeed() {

      feed.innerHTML =
        "";


      if (posts.length === 0) {

        const empty =
          document.createElement("div");

        empty.className =
          "empty";

        empty.textContent =
          "No posts yet. Create the first Zemivo post.";

        feed.appendChild(empty);

        return;

      }


      posts.forEach(
        function(post) {

          feed.appendChild(
            createPostElement(post)
          );

        }
      );

    }


    /* =========================
       CREATE POST ELEMENT
    ========================= */

    function createPostElement(post) {

      const article =
        document.createElement("article");

      article.className =
        "post";

      article.dataset.postId =
        post.id;


      /* HEADER */

      const header =
        document.createElement("div");

      header.className =
        "post-header";


      const user =
        document.createElement("div");

      user.className =
        "post-user";


      const avatar =
        document.createElement("div");

      avatar.className =
        "avatar";

      avatar.textContent =
        getInitial(
          post.author.name
        );


      const userInfo =
        document.createElement("div");

      userInfo.className =
        "post-user-info";


      const name =
        document.createElement("div");

      name.className =
        "post-name";

      name.textContent =
        post.author.name;


      const time =
        document.createElement("div");

      time.className =
        "post-time";

      time.textContent =
        formatTime(
          post.createdAt
        );


      userInfo.appendChild(name);

      userInfo.appendChild(time);

      user.appendChild(avatar);

      user.appendChild(userInfo);


      const more =
        document.createElement("button");

      more.className =
        "more-btn";

      more.textContent =
        "⋯";

      more.title =
        "Post options";


      header.appendChild(user);

      header.appendChild(more);


      /* MENU */

      const menu =
        document.createElement("div");

      menu.className =
        "menu";


      const edit =
        document.createElement("button");

      edit.textContent =
        "✏️ Edit post";


      const deleteBtn =
        document.createElement("button");

      deleteBtn.textContent =
        "🗑️ Delete post";

      deleteBtn.className =
        "danger";


      const save =
        document.createElement("button");

      save.textContent =
        "🔖 Save post";


      const copy =
        document.createElement("button");

      copy.textContent =
        "🔗 Copy link";


      const privacy =
        document.createElement("button");

      privacy.textContent =
        "🔒 Post privacy";


      menu.appendChild(edit);

      menu.appendChild(deleteBtn);

      menu.appendChild(save);

      menu.appendChild(copy);

      menu.appendChild(privacy);


      more.addEventListener(
        "click",
        function(event) {

          event.stopPropagation();

          closeAllMenus();

          menu.classList.toggle("open");

        }
      );


      edit.addEventListener(
        "click",
        function() {

          openEditModal(post);

          menu.classList.remove("open");

        }
      );


      deleteBtn.addEventListener(
        "click",
        function() {

          deletePost(post.id);

        }
      );


      save.addEventListener(
        "click",
        function() {

          showStatus(
            "Post saved.",
            "success"
          );

          menu.classList.remove("open");

        }
      );


      copy.addEventListener(
        "click",
        async function() {

          const link =
            window.location.href.split("#")[0] +
            "#post-" +
            post.id;


          try {

            await navigator.clipboard.writeText(
              link
            );

            showStatus(
              "Post link copied.",
              "success"
            );

          } catch (error) {

            showStatus(
              "Could not copy the link.",
              "error"
            );

          }


          menu.classList.remove("open");

        }
      );


      privacy.addEventListener(
        "click",
        function() {

          showStatus(
            "Privacy controls will be connected to the secure backend.",
            "success"
          );

          menu.classList.remove("open");

        }
      );


      /* CONTENT */

      const content =
        document.createElement("div");

      content.className =
        "post-content";

      content.textContent =
        post.text;


      /* MEDIA */

      let mediaElement =
        null;


      if (post.media) {

        if (
          post.mediaType ===
          "image"
        ) {

          mediaElement =
            document.createElement("img");

          mediaElement.src =
            post.media;

          mediaElement.alt =
            "Zemivo post image";

        }

        else if (
          post.mediaType ===
          "video"
        ) {

          mediaElement =
            document.createElement("video");

          mediaElement.src =
            post.media;

          mediaElement.controls =
            true;

        }


        if (mediaElement) {

          mediaElement.className =
            "post-media";

        }

      }


      /* ACTIONS */

      const actions =
        document.createElement("div");

      actions.className =
        "post-actions";


      const like =
        createActionButton(
          "👍 Like"
        );

      const comment =
        createActionButton(
          "💬 Comment"
        );

      const share =
        createActionButton(
          "↗️ Share"
        );


      like.addEventListener(
        "click",
        function() {

          like.textContent =
            like.textContent.includes("Liked")
              ? "👍 Like"
              : "👍 Liked";

        }
      );


      comment.addEventListener(
        "click",
        function() {

          showStatus(
            "Comment system will be connected next.",
            "success"
          );

        }
      );


      share.addEventListener(
        "click",
        async function() {

          const link =
            window.location.href.split("#")[0] +
            "#post-" +
            post.id;


          if (
            navigator.share
          ) {

            try {

              await navigator.share({
                title:
                  "Zemivo Post",
                text:
                  post.text,
                url:
                  link
              });

            } catch (error) {}

          }

          else {

            try {

              await navigator.clipboard.writeText(
                link
              );

              showStatus(
                "Post link copied for sharing.",
                "success"
              );

            } catch (error) {

              showStatus(
                "Sharing is not available on this device.",
                "error"
              );

            }

          }

        }
      );


      actions.appendChild(like);

      actions.appendChild(comment);

      actions.appendChild(share);


      /* BUILD POST */

      article.appendChild(header);

      article.appendChild(menu);

      if (post.text) {

        article.appendChild(content);

      }


      if (mediaElement) {

        article.appendChild(
          mediaElement
        );

      }


      article.appendChild(actions);


      return article;

    }


    /* =========================
       ACTION BUTTON
    ========================= */

    function createActionButton(
      text
    ) {

      const button =
        document.createElement("button");

      button.className =
        "post-action";

      button.textContent =
        text;

      return button;

    }


    /* =========================
       DELETE POST
    ========================= */

    function deletePost(
      postId
    ) {

      const confirmed =
        confirm(
          "Are you sure you want to delete this post?"
        );


      if (!confirmed) {
        return;
      }


      posts =
        posts.filter(
          function(post) {

            return post.id !== postId;

          }
        );


      savePosts();

      renderFeed();


      showStatus(
        "Post deleted successfully.",
        "success"
      );

    }


    /* =========================
       EDIT POST
    ========================= */

    function openEditModal(
      post
    ) {

      editingPostId =
        post.id;

      editText.value =
        post.text || "";

      editModalBackdrop.classList.add(
        "open"
      );

      editText.focus();

    }


    cancelEdit.addEventListener(
      "click",
      function() {

        closeEditModal();

      }
    );


    editModalBackdrop.addEventListener(
      "click",
      function(event) {

        if (
          event.target ===
          editModalBackdrop
        ) {

          closeEditModal();

        }

      }
    );


    saveEdit.addEventListener(
      "click",
      function() {

        if (!editingPostId) {
          return;
        }


        const newText =
          editText.value.trim();


        if (!newText) {

          showStatus(
            "Post text cannot be empty.",
            "error"
          );

          return;

        }


        const post =
          posts.find(
            function(item) {

              return item.id ===
                editingPostId;

            }
          );


        if (!post) {
          return;
        }


        post.text =
          newText;

        post.updatedAt =
          Date.now();


        savePosts();

        renderFeed();

        closeEditModal();


        showStatus(
          "Post updated successfully.",
          "success"
        );

      }
    );


    function closeEditModal() {

      editingPostId =
        null;

      editText.value =
        "";

      editModalBackdrop.classList.remove(
        "open"
      );

    }


    /* =========================
       CLOSE MENUS
    ========================= */

    document.addEventListener(
      "click",
      function() {

        closeAllMenus();

      }
    );


    function closeAllMenus() {

      document
        .querySelectorAll(".menu.open")
        .forEach(
          function(menu) {

            menu.classList.remove(
              "open"
            );

          }
        );

    }


    /* =========================
       HELPERS
    ========================= */

    function getInitial(
      name
    ) {

      if (!name) {
        return "Z";
      }

      return name
        .trim()
        .charAt(0)
        .toUpperCase();

    }


    function formatTime(
      timestamp
    ) {

      const date =
        new Date(timestamp);

      return date.toLocaleString();

    }


    /* =========================
       INITIALIZE
    ========================= */

    renderFeed();

  </script>

</body>
</html>
