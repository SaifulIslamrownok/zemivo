<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zemivo - Home</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f5f8;
  color:#172033;
}

button,input,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  height:64px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
}

.logo{
  color:#2563eb;
  font-size:27px;
  font-weight:800;
}

.nav{
  display:flex;
  gap:8px;
}

.nav button{
  border:0;
  background:#fff;
  font-size:22px;
  padding:9px 13px;
  border-radius:12px;
}

.nav button:hover{
  background:#eef3ff;
}

.container{
  width:100%;
  max-width:760px;
  margin:20px auto;
  padding:0 12px;
}

.card{
  background:#fff;
  border-radius:16px;
  margin-bottom:16px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
  overflow:hidden;
}

.composer{
  padding:18px;
}

.composer-top{
  display:flex;
  gap:12px;
  align-items:center;
}

.avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  background:#dbeafe;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  color:#2563eb;
  flex-shrink:0;
}

textarea{
  width:100%;
  min-height:78px;
  resize:none;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:13px;
  outline:none;
}

textarea:focus{
  border-color:#2563eb;
}

.tools{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}

.tool{
  border:1px solid #e5e7eb;
  background:#fff;
  border-radius:22px;
  padding:9px 13px;
}

.tool:hover{
  background:#f1f5ff;
}

.hashtag-box{
  display:none;
  margin-top:10px;
}

.hashtag-box input{
  width:100%;
  padding:11px;
  border:1px solid #ddd;
  border-radius:10px;
}

.publish-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:14px;
}

.publish{
  background:#2563eb;
  color:#fff;
  border:0;
  border-radius:22px;
  padding:10px 22px;
  font-weight:bold;
}

.preview{
  margin-top:10px;
}

.preview img{
  max-width:100%;
  max-height:360px;
  border-radius:12px;
}

.post{
  padding:0;
}

.post-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 16px 10px;
}

.user{
  display:flex;
  gap:10px;
  align-items:center;
}

.user-name{
  font-weight:bold;
}

.post-time{
  font-size:12px;
  color:#777;
  margin-top:3px;
}

.more{
  border:0;
  background:#fff;
  font-size:24px;
  border-radius:50%;
  width:40px;
  height:40px;
}

.more:hover{
  background:#f1f3f5;
}

.post-text{
  padding:0 16px 12px;
  white-space:pre-wrap;
  line-height:1.5;
}

.post-media{
  width:100%;
  max-height:600px;
  object-fit:cover;
}

.post-stats{
  display:flex;
  justify-content:space-between;
  padding:10px 16px;
  color:#667085;
  font-size:14px;
}

.actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-top:1px solid #eee;
}

.actions button{
  border:0;
  background:#fff;
  padding:12px 4px;
  font-weight:600;
}

.actions button:hover{
  background:#f5f7fa;
}

.actions .active{
  color:#2563eb;
}

.menu-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.25);
  z-index:500;
}

.menu{
  position:absolute;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:min(680px,100%);
  max-height:88vh;
  overflow:auto;
  background:#fff;
  border-radius:24px 24px 0 0;
  padding:12px;
}

.handle{
  width:44px;
  height:5px;
  border-radius:5px;
  background:#9ca3af;
  margin:4px auto 12px;
}

.menu-item{
  width:100%;
  border:0;
  background:#fff;
  text-align:left;
  padding:14px 15px;
  border-radius:12px;
  display:flex;
  gap:13px;
  align-items:center;
  font-weight:600;
}

.menu-item:hover{
  background:#f3f4f6;
}

.menu-item small{
  display:block;
  color:#777;
  font-weight:normal;
  margin-top:3px;
}

.menu-section{
  border-top:1px solid #eee;
  margin-top:8px;
  padding-top:8px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:700;
  background:rgba(0,0,0,.45);
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal-box{
  width:min(560px,100%);
  background:#fff;
  border-radius:18px;
  padding:20px;
}

.modal-box h3{
  margin-top:0;
}

.modal-box textarea,
.modal-box input{
  width:100%;
  margin:8px 0;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
}

.modal-actions{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  margin-top:12px;
}

.cancel{
  background:#e5e7eb;
  border:0;
  padding:10px 17px;
  border-radius:20px;
}

.primary{
  background:#2563eb;
  color:white;
  border:0;
  padding:10px 17px;
  border-radius:20px;
}

.danger{
  background:#dc2626;
  color:#fff;
}

.admin{
  display:none;
  border:2px solid #2563eb;
}

.admin-title{
  color:#2563eb;
  font-weight:bold;
}

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  background:#111827;
  color:#fff;
  padding:12px 18px;
  border-radius:20px;
  display:none;
  z-index:1000;
}

@media(max-width:600px){
  .topbar{
    padding:0 10px;
  }

  .nav button{
    padding:8px;
  }

  .container{
    margin-top:10px;
    padding:0 7px;
  }

  .card{
    border-radius:12px;
  }

  .actions button{
    font-size:13px;
  }
}
</style>
</head>

<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  addDoc,
  doc,
  updateDoc,
  deleteDoc,
  setDoc,
  getDoc,
  serverTimestamp,
  query,
  orderBy,
  onSnapshot
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyAxJUFBWm2fa0g3oxUWWqdfSTEAc-bRgfI",

  authDomain:
  "zemivo.firebaseapp.com",

  projectId:
  "zemivo",

  storageBucket:
  "zemivo.firebasestorage.app",

  messagingSenderId:
  "195335939691",

  appId:
  "1:195335939691:web:5fa5c62c53d0c0aefe732e",

  measurementId:
  "G-GNHH5S4H09"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


let currentUser = null;

let currentPostId = null;

let currentPostData = null;

let selectedImage = null;


/* --------------------------------
   AUTH
-------------------------------- */

onAuthStateChanged(
  auth,
  async user => {

    currentUser = user;

    if(user){

      document
        .getElementById("composerAvatar")
        .textContent =
        (
          user.displayName ||
          user.email ||
          "Z"
        )
        .charAt(0)
        .toUpperCase();

      await checkAdmin(user.uid);

    }

    loadPosts();

  }
);


/* --------------------------------
   ADMIN
-------------------------------- */

async function checkAdmin(uid){

  try{

    const adminRef =
      doc(db,"admins",uid);

    const snap =
      await getDoc(adminRef);

    if(
      snap.exists() &&
      snap.data().active === true
    ){

      document
        .getElementById("adminPanel")
        .style.display =
        "block";

    }

  }catch(error){

    console.error(
      "Admin check failed:",
      error
    );

  }

}


/* --------------------------------
   CREATE POST
-------------------------------- */

document
  .getElementById("galleryButton")
  .addEventListener(
    "click",
    () => {

      document
        .getElementById("imageInput")
        .click();

    }
  );


document
  .getElementById("imageInput")
  .addEventListener(
    "change",
    event => {

      const file =
        event.target.files[0];

      if(!file) return;

      selectedImage =
        file;

      const reader =
        new FileReader();

      reader.onload =
        e => {

          document
            .getElementById("imagePreview")
            .innerHTML =
            `<img src="${e.target.result}" alt="Post image">`;

        };

      reader.readAsDataURL(file);

    }
  );


document
  .getElementById("hashtagButton")
  .addEventListener(
    "click",
    () => {

      const box =
        document.getElementById(
          "hashtagBox"
        );

      box.style.display =
        box.style.display === "block"
        ? "none"
        : "block";

    }
  );


document
  .getElementById("mentionButton")
  .addEventListener(
    "click",
    () => {

      const textarea =
        document.getElementById(
          "postText"
        );

      textarea.value += " @";

      textarea.focus();

    }
  );


document
  .getElementById("groupButton")
  .addEventListener(
    "click",
    () => {

      showToast(
        "Group selector will connect to groups.html."
      );

    }
  );


document
  .getElementById("locationButton")
  .addEventListener(
    "click",
    () => {

      showToast(
        "Location option is ready for integration."
      );

    }
  );


document
  .getElementById("gifButton")
  .addEventListener(
    "click",
    () => {

      showToast(
        "GIF selector is ready for integration."
      );

    }
  );


document
  .getElementById("liveButton")
  .addEventListener(
    "click",
    () => {

      showToast(
        "Live video will open from the Live system."
      );

    }
  );


document
  .getElementById("productButton")
  .addEventListener(
    "click",
    () => {

      document
        .getElementById("productModal")
        .style.display =
        "flex";

    }
  );


document
  .getElementById("affiliateButton")
  .addEventListener(
    "click",
    () => {

      document
        .getElementById("productModal")
        .style.display =
        "flex";

    }
  );


document
  .getElementById("postButton")
  .addEventListener(
    "click",
    createPost
  );


async function createPost(){

  if(!currentUser){

    showToast(
      "Please log in first."
    );

    return;

  }


  const text =
    document
      .getElementById("postText")
      .value
      .trim();


  const hashtags =
    document
      .getElementById("hashtagInput")
      .value
      .trim();


  if(!text && !selectedImage){

    showToast(
      "Write something or add an image."
    );

    return;

  }


  try{

    await addDoc(
      collection(db,"posts"),
      {

        uid:
          currentUser.uid,

        displayName:
          currentUser.displayName ||
          "Zemivo User",

        text:
          text,

        hashtags:
          hashtags,

        imageData:
          selectedImage
          ? await fileToDataURL(
              selectedImage
            )
          : "",

        likes:
          0,

        comments:
          0,

        shares:
          0,

        sparks:
          0,

        status:
          "published",

        privacy:
          "public",

        createdAt:
          serverTimestamp()

      }
    );


    document
      .getElementById("postText")
      .value = "";

    document
      .getElementById("hashtagInput")
      .value = "";

    document
      .getElementById("imagePreview")
      .innerHTML = "";

    selectedImage =
      null;


    showToast(
      "Post published successfully."
    );


  }catch(error){

    console.error(error);

    showToast(
      "Post could not be published."
    );

  }

}


function fileToDataURL(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();

      reader.onload =
        () => resolve(
          reader.result
        );

      reader.onerror =
        reject;

      reader.readAsDataURL(file);

    }
  );

}


/* --------------------------------
   LOAD POSTS
-------------------------------- */

function loadPosts(){

  const feed =
    document.getElementById(
      "feed"
    );


  const q =
    query(
      collection(db,"posts"),
      orderBy(
        "createdAt",
        "desc"
      )
    );


  onSnapshot(
    q,
    snapshot => {

      feed.innerHTML = "";

      snapshot.forEach(
        item => {

          const data =
            item.data();

          if(
            data.status ===
            "deleted"
          ) return;

          feed.appendChild(
            createPostElement(
              item.id,
              data
            )
          );

        }
      );

    },
    error => {

      console.error(error);

      feed.innerHTML = `
        <div class="card" style="padding:20px;text-align:center">
          Feed could not be loaded.
        </div>
      `;

    }
  );

}


/* --------------------------------
   POST CARD
-------------------------------- */

function createPostElement(
  id,
  data
){

  const article =
    document.createElement(
      "article"
    );

  article.className =
    "card post";


  const initial =
    (
      data.displayName ||
      "Z"
    )
    .charAt(0)
    .toUpperCase();


  article.innerHTML = `

    <div class="post-head">

      <div class="user">

        <div class="avatar">
          ${escapeHTML(initial)}
        </div>

        <div>

          <div class="user-name">
            ${escapeHTML(
              data.displayName ||
              "Zemivo User"
            )}
          </div>

          <div class="post-time">
            ${formatTime(
              data.createdAt
            )}
          </div>

        </div>

      </div>


      <button
        class="more"
        data-menu="${id}"
      >
        ⋯
      </button>

    </div>


    <div class="post-text">

      ${escapeHTML(
        data.text || ""
      )}

      ${
        data.hashtags
        ? `<br><br>${escapeHTML(
            data.hashtags
          )}`
        : ""
      }

    </div>


    ${
      data.imageData
      ? `
        <img
          class="post-media"
          src="${data.imageData}"
          alt="Zemivo post"
        >
      `
      : ""
    }


    <div class="post-stats">

      <span>
        👍 ${data.likes || 0}
      </span>

      <span>
        💬 ${data.comments || 0}
        &nbsp;&nbsp;
        🔄 ${data.shares || 0}
        &nbsp;&nbsp;
        ✨ ${data.sparks || 0}
      </span>

    </div>


    <div class="actions">

      <button
        onclick="likePost('${id}')"
      >
        👍 Like
      </button>

      <button
        onclick="commentPost('${id}')"
      >
        💬 Comment
      </button>

      <button
        onclick="sharePost('${id}')"
      >
        ↗ Share
      </button>

      <button
        onclick="sparkPost('${id}')"
      >
        ✨ Spark
      </button>

    </div>

  `;


  article
    .querySelector(
      ".more"
    )
    .addEventListener(
      "click",
      () => {

        openPostMenu(
          id,
          data
        );

      }
    );


  return article;

}

window.sharePost =
async function(id){

  try{

    const link =
      location.origin +
      location.pathname +
      "?post=" +
      id;


    if(
      navigator.share
    ){

      await navigator.share({

        title:
          "Zemivo Post",

        url:
          link

      });

    }else{

      await navigator.clipboard.writeText(
        link
      );

      showToast(
        "Post link copied."
      );

    }


  }catch(error){

    console.log(
      "Share cancelled."
    );

  }

};

/* --------------------------------

-------------------------------- */

window.closeModal =
function(id){

  document
    .getElementById(id)
    .style.display =
    "none";

};


function showToast(text){

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    text;

  toast.style.display =
    "block";


  setTimeout(
    () => {

      toast.style.display =
        "none";

    },
    2500
  );

}


function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function formatTime(timestamp){

  if(!timestamp)
    return "Just now";

  try{

    return timestamp
      .toDate()
      .toLocaleString();

  }catch(error){

    return "Just now";

  }

}
