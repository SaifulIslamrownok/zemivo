<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zemivo - Home</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#172033;
}

.header{
  position:sticky;
  top:0;
  z-index:100;
  height:64px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
}

.logo{
  font-size:27px;
  font-weight:800;
  color:#2563eb;
}

.header-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#f1f5f9;
  cursor:pointer;
  font-size:19px;
}

.container{
  width:100%;
  max-width:760px;
  margin:20px auto;
  padding:0 12px;
}

.card{
  background:#fff;
  border-radius:16px;
  border:1px solid #e5e7eb;
  margin-bottom:16px;
  overflow:hidden;
}

.composer{
  padding:16px;
}

.composer-top{
  display:flex;
  gap:12px;
  align-items:center;
}

.avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  background:#2563eb;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  flex-shrink:0;
}

textarea{
  width:100%;
  min-height:70px;
  resize:none;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:12px;
  font-size:15px;
  outline:none;
}

textarea:focus{
  border-color:#2563eb;
}

.photo-preview{
  margin-top:12px;
  display:none;
}

.photo-preview img{
  width:100%;
  max-height:420px;
  object-fit:cover;
  border-radius:12px;
}

.composer-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:12px;
}

.photo-label{
  cursor:pointer;
  padding:9px 13px;
  border-radius:10px;
  background:#eff6ff;
  color:#2563eb;
  font-weight:bold;
}

#photoInput{
  display:none;
}

.post-btn{
  border:0;
  background:#2563eb;
  color:white;
  padding:10px 20px;
  border-radius:22px;
  font-weight:bold;
  cursor:pointer;
}

.post-header{
  padding:15px;
  display:flex;
  align-items:center;
  gap:10px;
}

.post-info{
  flex:1;
}

.post-name{
  font-weight:bold;
}

.post-time{
  font-size:12px;
  color:#64748b;
  margin-top:3px;
}

.more-btn{
  border:0;
  background:transparent;
  font-size:22px;
  cursor:pointer;
}

.post-text{
  padding:0 15px 15px;
  white-space:pre-wrap;
  line-height:1.5;
}

.post-image{
  width:100%;
  max-height:520px;
  object-fit:cover;
  display:block;
}

.stats{
  padding:10px 15px;
  display:flex;
  justify-content:space-between;
  color:#64748b;
  font-size:13px;
  border-bottom:1px solid #eef0f3;
}

.post-actions{
  display:flex;
  border-bottom:1px solid #eef0f3;
}

.post-actions button{
  flex:1;
  border:0;
  background:#fff;
  padding:12px 5px;
  cursor:pointer;
  font-weight:bold;
  color:#475569;
}

.post-actions button:hover{
  background:#f8fafc;
}

.post-actions .liked{
  color:#2563eb;
}

.comments{
  padding:12px 15px;
}

.comment-form{
  display:flex;
  gap:8px;
}

.comment-form input{
  flex:1;
  border:1px solid #e2e8f0;
  border-radius:20px;
  padding:10px 13px;
  outline:none;
}

.comment-form button{
  border:0;
  border-radius:20px;
  padding:0 15px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

.comment{
  margin-top:12px;
}

.comment-main{
  display:flex;
  gap:8px;
}

.comment-body{
  background:#f1f5f9;
  border-radius:14px;
  padding:9px 12px;
  flex:1;
}

.comment-author{
  font-size:13px;
  font-weight:bold;
}

.comment-text{
  margin-top:4px;
  line-height:1.4;
}

.comment-tools{
  display:flex;
  gap:14px;
  padding:5px 8px;
  font-size:12px;
  color:#64748b;
}

.comment-tools button{
  border:0;
  background:none;
  padding:0;
  cursor:pointer;
  color:#64748b;
  font-weight:bold;
}

.comment-tools .active{
  color:#2563eb;
}

.reply-area{
  margin-left:50px;
  margin-top:6px;
}

.reply-form{
  display:flex;
  gap:7px;
}

.reply-form input{
  flex:1;
  border:1px solid #e2e8f0;
  border-radius:18px;
  padding:8px 11px;
}

.reply-form button{
  border:0;
  border-radius:18px;
  background:#2563eb;
  color:white;
  padding:0 12px;
  cursor:pointer;
}

.replies{
  margin-left:50px;
}

.empty{
  text-align:center;
  color:#64748b;
  padding:30px 10px;
}

.hidden{
  display:none!important;
}

@media(max-width:600px){
  .header{
    padding:0 12px;
  }

  .container{
    margin-top:10px;
    padding:0 7px;
  }

  .card{
    border-radius:12px;
  }

  .logo{
    font-size:24px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">Zemivo</div>

  <div class="header-actions">
    <button class="icon-btn" title="Search">🔍</button>
    <button class="icon-btn" title="Messages">💬</button>
    <button class="icon-btn" title="Notifications">🔔</button>
  </div>
</header>

<main class="container">

  <section class="card composer">

    <div class="composer-top">
      <div class="avatar">Z</div>

      <textarea
        id="postText"
        placeholder="What's on your mind?"
      ></textarea>
    </div>

    <div class="photo-preview" id="photoPreview">
      <img id="previewImage" alt="Selected photo">
    </div>

    <div class="composer-actions">

      <label class="photo-label" for="photoInput">
        🖼️ Photo
      </label>

      <input
        id="photoInput"
        type="file"
        accept="image/*"
      >

      <button
        class="post-btn"
        id="postButton"
      >
        Post
      </button>

    </div>

  </section>

  <section id="feed"></section>

</main>

<script>

let posts = [];

let currentPhoto = "";

const postText =
  document.getElementById("postText");

const photoInput =
  document.getElementById("photoInput");

const photoPreview =
  document.getElementById("photoPreview");

const previewImage =
  document.getElementById("previewImage");

const postButton =
  document.getElementById("postButton");

const feed =
  document.getElementById("feed");


photoInput.addEventListener("change", function(){

  const file = this.files[0];

  if(!file){
    currentPhoto = "";
    photoPreview.style.display = "none";
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e){

    currentPhoto = e.target.result;

    previewImage.src = currentPhoto;

    photoPreview.style.display = "block";

  };

  reader.readAsDataURL(file);

});


postButton.addEventListener("click", function(){

  const text =
    postText.value.trim();

  if(!text && !currentPhoto){
    alert("Please write something or select a photo.");
    return;
  }

  const post = {

    id: Date.now(),

    name: "You",

    text: text,

    photo: currentPhoto,

    likes: 0,

    liked: false,

    views: 0,

    comments: []

  };

  posts.unshift(post);

  postText.value = "";

  photoInput.value = "";

  currentPhoto = "";

  photoPreview.style.display = "none";

  renderFeed();

});


function renderFeed(){

  feed.innerHTML = "";

  if(posts.length === 0){

    feed.innerHTML =
      '<div class="card empty">No posts yet. Create the first post.</div>';

    return;

  }

  posts.forEach(function(post){

    const card =
      document.createElement("article");

    card.className = "card";

    post.views++;

    card.innerHTML = `

      <div class="post-header">

        <div class="avatar">
          ${escapeHTML(post.name.charAt(0))}
        </div>

        <div class="post-info">

          <div class="post-name">
            ${escapeHTML(post.name)}
          </div>

          <div class="post-time">
            Just now
          </div>

        </div>

        <button
          class="more-btn"
          onclick="postMenu(${post.id})"
        >
          ⋯
        </button>

      </div>

      ${
        post.text
        ?
        `<div class="post-text">
          ${escapeHTML(post.text)}
        </div>`
        :
        ""
      }

      ${
        post.photo
        ?
        `<img
          class="post-image"
          src="${post.photo}"
          alt="Post image"
        >`
        :
        ""
      }

      <div class="stats">

        <span>
          ❤️ ${post.likes}
        </span>

        <span>
          💬 ${countAllComments(post)}
          &nbsp;&nbsp;
          👁️ ${post.views}
        </span>

      </div>

      <div class="post-actions">

        <button
          class="${post.liked ? "liked" : ""}"
          onclick="toggleLike(${post.id})"
        >
          ❤️ Like
        </button>

        <button
          onclick="focusComment(${post.id})"
        >
          💬 Comment
        </button>

        <button
          onclick="sharePost(${post.id})"
        >
          ↗ Share
        </button>

      </div>

      <div class="comments">

        <div class="comment-form">

          <input
            id="comment-${post.id}"
            placeholder="Write a comment..."
          >

          <button
            onclick="addComment(${post.id})"
          >
            Send
          </button>

        </div>

        <div id="comments-${post.id}">
          ${renderComments(post)}
        </div>

      </div>
    `;

    feed.appendChild(card);

  });

}


function toggleLike(postId){

  const post =
    posts.find(p => p.id === postId);

  if(!post) return;

  post.liked = !post.liked;

  post.likes +=
    post.liked ? 1 : -1;

  renderFeed();

}


function addComment(postId){

  const input =
    document.getElementById(
      `comment-${postId}`
    );

  if(!input) return;

  const text =
    input.value.trim();

  if(!text) return;

  const post =
    posts.find(p => p.id === postId);

  if(!post) return;

  post.comments.push({

    id: Date.now(),

    author: "You",

    text: text,

    likes: 0,

    liked: false,

    replies: []

  });

  renderFeed();

}


function addReply(postId, commentId){

  const input =
    document.getElementById(
      `reply-${commentId}`
    );

  if(!input) return;

  const text =
    input.value.trim();

  if(!text) return;

  const post =
    posts.find(p => p.id === postId);

  if(!post) return;

  const comment =
    findComment(post.comments, commentId);

  if(!comment) return;

  comment.replies.push({

    id: Date.now(),

    author: "You",

    text: text,

    likes: 0,

    liked: false,

    replies: []

  });

  renderFeed();

}


function findComment(comments, id){

  for(const comment of comments){

    if(comment.id === id){
      return comment;
    }

    const found =
      findComment(comment.replies || [], id);

    if(found){
      return found;
    }

  }

  return null;

}


function renderComments(post){

  return post.comments
    .map(function(comment){

      return renderComment(
        post.id,
        comment,
        0
      );

    })
    .join("");

}


function renderComment(
  postId,
  comment,
  level
){

  const replies =
    (comment.replies || [])
      .map(function(reply){

        return renderComment(
          postId,
          reply,
          level + 1
        );

      })
      .join("");

  return `

    <div
      class="comment"
      data-level="${level}"
    >

      <div class="comment-main">

        <div class="avatar">
          ${escapeHTML(comment.author.charAt(0))}
        </div>

        <div class="comment-body">

          <div class="comment-author">
            ${escapeHTML(comment.author)}
          </div>

          <div class="comment-text">
            ${escapeHTML(comment.text)}
          </div>

        </div>

      </div>

      <div class="comment-tools">

        <button
          class="${comment.liked ? "active" : ""}"
          onclick="likeComment(${postId}, ${comment.id})"
        >
          ❤️ ${comment.likes}
        </button>

        <button
          onclick="editComment(${postId}, ${comment.id})"
        >
          ✏️ Edit
        </button>

        <button
          onclick="deleteComment(${postId}, ${comment.id})"
        >
          🗑️ Delete
        </button>

        <button
          onclick="showReplyBox(${comment.id})"
        >
          ↩ Reply
        </button>

      </div>

      <div
        class="reply-area hidden"
        id="reply-box-${comment.id}"
      >

        <div class="reply-form">

          <input
            id="reply-${comment.id}"
            placeholder="Write a reply..."
          >

          <button
            onclick="addReply(${postId}, ${comment.id})"
          >
            Send
          </button>

        </div>

      </div>

      <div class="replies">
        ${replies}
      </div>

    </div>
  `;

}


function likeComment(
  postId,
  commentId
){

  const post =
    posts.find(p => p.id === postId);

  if(!post) return;

  const comment =
    findComment(post.comments, commentId);

  if(!comment) return;

  comment.liked =
    !comment.liked;

  comment.likes +=
    comment.liked ? 1 : -1;

  renderFeed();

}


function showReplyBox(commentId){

  const box =
    document.getElementById(
      `reply-box-${commentId}`
    );

  if(!box) return;

  box.classList.toggle("hidden");

}


function editComment(
  postId,
  commentId
){

  const post =
    posts.find(p => p.id === postId);

  if(!post) return;

  const comment =
    findComment(post.comments, commentId);

  if(!comment) return;

  const newText =
    prompt(
      "Edit your comment:",
      comment.text
    );

  if(
    newText === null ||
    !newText.trim()
  ){
    return;
  }

  comment.text =
    newText.trim();

  renderFeed();

}


function deleteComment(
  postId,
  commentId
){

  const post =
    posts.find(p => p.id === postId);

  if(!post) return;

  const deleted =
    removeComment(
      post.comments,
      commentId
    );

  if(deleted){
    renderFeed();
  }

}


function removeComment(
  comments,
  id
){

  const index =
    comments.findIndex(
      c => c.id === id
    );

  if(index !== -1){

    comments.splice(index,1);

    return true;

  }

  for(const comment of comments){

    if(
      removeComment(
        comment.replies || [],
        id
      )
    ){
      return true;
    }

  }

  return false;

}


function countAllComments(post){

  let total = 0;

  function count(list){

    list.forEach(function(item){

      total++;

      if(item.replies){
        count(item.replies);
      }

    });

  }

  count(post.comments);

  return total;

}


function postMenu(postId){

  const post =
    posts.find(p => p.id === postId);

  if(!post) return;

  const action =
    prompt(
      "Type EDIT to edit this post, or DELETE to delete it."
    );

  if(!action) return;

  if(
    action.toUpperCase() === "DELETE"
  ){

    if(
      confirm(
        "Delete this post?"
      )
    ){

      posts =
        posts.filter(
          p => p.id !== postId
        );

      renderFeed();

    }

  }

  else if(
    action.toUpperCase() === "EDIT"
  ){

    const newText =
      prompt(
        "Edit your post:",
        post.text
      );

    if(
      newText !== null
    ){

      post.text =
        newText.trim();

      renderFeed();

    }

  }

}


function focusComment(postId){

  const input =
    document.getElementById(
      `comment-${postId}`
    );

  if(input){

    input.focus();

  }

}


function sharePost(postId){

  const post =
    posts.find(p => p.id === postId);

  if(!post) return;

  const shareText =
    post.text ||
    "Check out this Zemivo post.";

  if(
    navigator.share
  ){

    navigator.share({

      title:"Zemivo",

      text:shareText

    }).catch(function(){});

  }

  else{

    alert(
      "Sharing will be connected to Zemivo's full sharing system later."
    );

  }

}


function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


renderFeed();

</script>

</body>
</html>
