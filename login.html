<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <title>Log In - Zemivo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      color: #172033;
      background: linear-gradient(135deg, #eaf0ff, #f5f3ff, #e0f7ff);
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      padding: 32px 25px;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 24px;
      background: rgba(255,255,255,.94);
      box-shadow: 0 18px 50px rgba(37,99,235,.13);
    }

    .logo {
      text-align: center;
      font-size: 36px;
      font-weight: 800;
      color: #2563eb;
      letter-spacing: -.8px;
      margin-bottom: 8px;
    }

    h2 {
      text-align: center;
      margin: 0 0 25px;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      margin: -15px 0 24px;
    }

    label {
      display: block;
      margin: 0 0 7px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      min-height: 49px;
      padding: 13px 14px;
      margin-bottom: 17px;
      border: 1px solid #dbe2ee;
      border-radius: 12px;
      background: #f9fbff;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 70px;
    }

    .toggle-password {
      position: absolute;
      top: 8px;
      right: 8px;
      border: 0;
      background: #eaf0ff;
      color: #2563eb;
      border-radius: 8px;
      padding: 8px;
      cursor: pointer;
    }

    .forgot {
      display: block;
      text-align: right;
      margin: -7px 0 20px;
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    .login-button {
      width: 100%;
      min-height: 49px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 7px 16px rgba(37,99,235,.22);
    }

    .login-button:disabled {
      opacity: .65;
      cursor: wait;
    }

    #message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #message.show {
      display: block;
    }

    #message.error {
      color: #b91c1c;
      background: #fef2f2;
    }

    #message.success {
      color: #166534;
      background: #f0fdf4;
    }

    .signup-link {
      text-align: center;
      margin-top: 24px;
      line-height: 1.8;
      color: #475569;
    }

    .signup-link a,
    .back {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 3px;
    }

    @media (max-width: 400px) {
      .login-box {
        padding: 27px 19px;
      }
    }
  </style>
</head>

<body>
  <main class="login-box">
    <div class="logo">Zemivo</div>
    <h2>Welcome Back</h2>
    <p class="subtitle">Log in to continue to your account.</p>

    <form id="loginForm">
      <label for="email">Email Address</label>
      <input
        id="email"
        name="email"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>
      <div class="password-wrap">
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >
        <button
          id="togglePassword"
          class="toggle-password"
          type="button"
          aria-label="Show password"
          aria-pressed="false"
        >Show</button>
      </div>

      <a id="forgotLink" class="forgot" href="#">Forgot password?</a>

      <button id="loginButton" class="login-button" type="submit">
        Log In
      </button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <div class="signup-link">
      Don't have an account?
      <a href="signup.html">Create Account</a>
    </div>

    <a class="back" href="index.html">← Back to Zemivo</a>
  </main>

  <script type="module">
    import { auth } from "./zemivo-security.js";

    import {
      signInWithEmailAndPassword,
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");
    const togglePassword = document.getElementById("togglePassword");
    const forgotLink = document.getElementById("forgotLink");

    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = "show " + type;
    }

    function getFriendlyError(error) {
      switch (error?.code) {
        case "auth/invalid-email":
          return "Please enter a valid email address.";

        case "auth/invalid-credential":
        case "auth/wrong-password":
        case "auth/user-not-found":
          return "Email or password is incorrect. Please check and try again.";

        case "auth/user-disabled":
          return "This account has been disabled. Please contact support.";

        case "auth/too-many-requests":
          return "Too many attempts. Please wait a while and try again.";

        case "auth/network-request-failed":
          return "Network error. Check your internet connection.";

        case "auth/operation-not-allowed":
          return "Email and password login is not enabled in Firebase Authentication.";

        case "auth/unauthorized-domain":
          return "This website domain is not authorized in Firebase Authentication.";

        case "auth/invalid-api-key":
          return "Firebase configuration is invalid. Please check the project setup.";

        default:
          return "Login failed. Please try again. If the problem continues, check the browser console.";
      }
    }

    togglePassword.addEventListener("click", () => {
      const show = passwordInput.type === "password";

      passwordInput.type = show ? "text" : "password";
      togglePassword.textContent = show ? "Hide" : "Show";
      togglePassword.setAttribute("aria-pressed", String(show));
      togglePassword.setAttribute(
        "aria-label",
        show ? "Hide password" : "Show password"
      );
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showMessage("Please enter your email and password.");
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";
      showMessage("", "success");

      try {
        await signInWithEmailAndPassword(auth, email, password);

        showMessage("Login successful! Opening your profile...", "success");

        window.setTimeout(() => {
          window.location.assign("profile.html");
        }, 700);

      } catch (error) {
        console.error("Zemivo login error:", error);
        showMessage(getFriendlyError(error));
        loginButton.disabled = false;
        loginButton.textContent = "Log In";
      }
    });

    forgotLink.addEventListener("click", async (event) => {
      event.preventDefault();

      const email = emailInput.value.trim();

      if (!email) {
        showMessage("Enter your email address first, then select Forgot password.");
        emailInput.focus();
        return;
      }

      forgotLink.textContent = "Sending...";

      try {
        await sendPasswordResetEmail(auth, email);
        showMessage(
          "If this email is registered, a password-reset email will be sent. Check your inbox and spam folder.",
          "success"
        );
      } catch (error) {
        console.error("Zemivo password reset error:", error);
        showMessage(getFriendlyError(error));
      } finally {
        forgotLink.textContent = "Forgot password?";
      }
    });
  </script>
</body>
</html>
