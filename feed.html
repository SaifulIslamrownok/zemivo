<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zemivo Feed</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f0f2f5;
  color:#17202a;
}

button,
input,
textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  height:62px;
  background:#fff;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
}

.logo{
  color:#2563eb;
  font-size:28px;
  font-weight:800;
}

.top-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#f0f2f5;
  font-size:19px;
}

.page{
  width:100%;
  max-width:760px;
  margin:22px auto;
  padding:0 12px;
}

/* COMPOSER */

.composer{
  background:#fff;
  border-radius:16px;
  padding:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.composer-top{
  display:flex;
  gap:12px;
  align-items:flex-start;
}

.avatar{
  width:46px;
  height:46px;
  border-radius:50%;
  background:#2563eb;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  flex-shrink:0;
}

.composer textarea{
  width:100%;
  min-height:90px;
  resize:none;
  border:0;
  outline:0;
  font-size:18px;
  padding:8px 4px;
}

.composer textarea::placeholder{
  color:#777;
}

.composer-extra{
  display:none;
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid #eee;
}

.composer-extra.show{
  display:block;
}

.field{
  margin-bottom:10px;
}

.field input,
.field select{
  width:100%;
  padding:11px 12px;
  border:1px solid #ddd;
  border-radius:10px;
  outline:none;
}

.media-preview{
  display:none;
  position:relative;
  margin-top:10px;
  border-radius:12px;
  overflow:hidden;
  background:#f3f4f6;
}

.media-preview.show{
  display:block;
}

.media-preview img,
.media-preview video{
  width:100%;
  max-height:380px;
  object-fit:cover;
  display:block;
}

.remove-media{
  position:absolute;
  top:8px;
  right:8px;
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.65);
  color:#fff;
  font-size:18px;
}

.composer-tools{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid #eee;
}

.tool-left{
  display:flex;
  gap:6px;
  align-items:center;
}

.tool{
  border:0;
  background:#f0f2f5;
  border-radius:20px;
  padding:9px 12px;
  font-size:14px;
}

.tool:hover{
  background:#e4e6e9;
}

.plus-btn{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#2563eb;
  color:white;
  font-size:25px;
  font-weight:bold;
}

.media-menu{
  display:none;
  position:absolute;
  left:0;
  bottom:54px;
  width:240px;
  background:#fff;
  border-radius:14px;
  box-shadow:0 5px 22px rgba(0,0,0,.18);
  padding:8px;
  z-index:50;
}

.media-menu.show{
  display:block;
}

.media-option{
  width:100%;
  border:0;
  background:#fff;
  padding:12px;
  text-align:left;
  border-radius:10px;
  font-size:15px;
}

.media-option:hover{
  background:#f0f2f5;
}

.publish-row{
  margin-top:12px;
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.audience{
  flex:1;
  padding:11px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
}

.publish{
  flex:1;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:bold;
}

.publish:disabled{
  opacity:.6;
}

/* ADMIN */

.admin-panel{
  display:none;
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin-bottom:16px;
  border:2px solid #2563eb;
}

.admin-panel.show{
  display:block;
}

.admin-title{
  font-weight:bold;
  color:#2563eb;
  margin-bottom:10px;
}

.admin-note{
  font-size:13px;
  color:#666;
  margin-bottom:10px;
}

/* FEED */

.feed{
  margin-top:18px;
}

.post{
  background:#fff;
  border-radius:16px;
  margin-bottom:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  overflow:hidden;
}

.post-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px 16px 10px;
}

.post-user{
  display:flex;
  align-items:center;
  gap:10px;
}

.post-name{
  font-weight:bold;
}

.post-meta{
  color:#777;
  font-size:12px;
  margin-top:3px;
}

.post-menu-wrap{
  position:relative;
}

.dots{
  width:38px;
  height:38px;
  border:0;
  background:#f0f2f5;
  border-radius:50%;
  font-size:20px;
}

.post-menu{
  display:none;
  position:absolute;
  right:0;
  top:44px;
  width:220px;
  background:#fff;
  border-radius:12px;
  box-shadow:0 5px 22px rgba(0,0,0,.2);
  padding:7px;
  z-index:80;
}

.post-menu.show{
  display:block;
}

.menu-item{
  width:100%;
  border:0;
  background:#fff;
  padding:11px;
  border-radius:9px;
  text-align:left;
  font-size:14px;
}

.menu-item:hover{
  background:#f0f2f5;
}

.menu-item.danger{
  color:#dc2626;
}

.post-content{
  padding:4px 16px 12px;
  font-size:16px;
  line-height:1.55;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.post-content .hashtag{
  color:#2563eb;
}

.post-content .mention{
  color:#2563eb;
}

.post-media{
  width:100%;
  max-height:550px;
  object-fit:cover;
  display:block;
}

.post-info{
  padding:9px 16px;
  display:flex;
  justify-content:space-between;
  color:#777;
  font-size:13px;
}

.post-actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-top:1px solid #eee;
  border-bottom:1px solid #eee;
}

.action{
  border:0;
  background:#fff;
  padding:12px 5px;
  font-size:14px;
  font-weight:600;
}

.action:hover{
  background:#f0f2f5;
}

.action.active{
  color:#2563eb;
}

.action.spark{
  color:#f59e0b;
}

/* COMMENTS */

.comments{
  padding:10px 16px 15px;
}

.comment{
  background:#f0f2f5;
  border-radius:12px;
  padding:8px 11px;
  margin-bottom:7px;
}

.comment-name{
  font-weight:bold;
  font-size:13px;
}

.comment-text{
  font-size:14px;
  margin-top:2px;
}

.comment-form{
  display:flex;
  gap:7px;
  margin-top:9px;
}

.comment-form input{
  flex:1;
  border:1px solid #ddd;
  border-radius:20px;
  padding:10px 13px;
  outline:none;
}

.comment-form button{
  border:0;
  background:#2563eb;
  color:#fff;
  border-radius:20px;
  padding:0 15px;
}

.empty{
  text-align:center;
  color:#777;
  padding:40px 10px;
}

.loading{
  text-align:center;
  padding:30px;
  color:#777;
}

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  background:#111827;
  color:#fff;
  padding:12px 18px;
  border-radius:10px;
  display:none;
  z-index:999;
  max-width:90%;
  text-align:center;
}

.toast.show{
  display:block;
}

.edit-area{
  width:100%;
  min-height:120px;
  border:1px solid #ddd;
  border-radius:10px;
  padding:12px;
  resize:vertical;
  outline:none;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:500;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:500px;
  background:#fff;
  border-radius:16px;
  padding:18px;
}

.modal-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:12px;
}

.modal-buttons{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.modal-buttons button{
  flex:1;
  padding:11px;
  border:0;
  border-radius:10px;
}

.cancel{
  background:#e5e7eb;
}

.confirm{
  background:#2563eb;
  color:#fff;
}

@media(max-width:600px){
  .page{
    margin-top:12px;
  }

  .topbar{
    padding:0 12px;
  }

  .logo{
    font-size:24px;
  }

  .tool{
    padding:8px 9px;
  }

  .post-actions{
    font-size:13px;
  }
}
</style>
</head>

<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  addDoc,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  deleteDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp,
  increment,
  arrayUnion,
  arrayRemove
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyAxJUFBWm2fa0g3oxUWWqdfSTEAc-bRgfI",

  authDomain:
    "zemivo.firebaseapp.com",

  projectId:
    "zemivo",

  storageBucket:
    "zemivo.firebasestorage.app",

  messagingSenderId:
    "195335939691",

  appId:
    "1:195335939691:web:5fa5c62c53d0c0aefe732e",

  measurementId:
    "G-GNHH5S4H09"

};


const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* ELEMENTS */

const postText =
  document.getElementById("postText");

const publishButton =
  document.getElementById("publishButton");

const feed =
  document.getElementById("feed");

const plusButton =
  document.getElementById("plusButton");

const mediaMenu =
  document.getElementById("mediaMenu");

const imageInput =
  document.getElementById("imageInput");

const videoInput =
  document.getElementById("videoInput");

const mediaPreview =
  document.getElementById("mediaPreview");

const imagePreview =
  document.getElementById("imagePreview");

const videoPreview =
  document.getElementById("videoPreview");

const removeMedia =
  document.getElementById("removeMedia");

const composerExtra =
  document.getElementById("composerExtra");

const detailsButton =
  document.getElementById("detailsButton");

const locationInput =
  document.getElementById("locationInput");

const groupInput =
  document.getElementById("groupInput");

const productInput =
  document.getElementById("productInput");

const quickAudience =
  document.getElementById("quickAudience");

const audienceSelect =
  document.getElementById("audienceSelect");

const currentAvatar =
  document.getElementById("currentAvatar");

const toast =
  document.getElementById("toast");

const editModal =
  document.getElementById("editModal");

const editText =
  document.getElementById("editText");

const cancelEdit =
  document.getElementById("cancelEdit");

const saveEdit =
  document.getElementById("saveEdit");

const adminPanel =
  document.getElementById("adminPanel");

const adminText =
  document.getElementById("adminText");

const adminPublish =
  document.getElementById("adminPublish");


/* STATE */

let currentUser = null;

let currentProfile = null;

let selectedFile = null;

let selectedFileType = null;

let editingPostId = null;

let unsubscribeFeed = null;


/* TOAST */

function showToast(text){

  toast.textContent = text;

  toast.classList.add("show");

  setTimeout(() => {

    toast.classList.remove("show");

  }, 2500);

}


/* ESCAPE HTML */

function escapeHtml(value){

  if(value === undefined || value === null){
    return "";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* FORMAT POST TEXT */

function formatPostText(text){

  let safe =
    escapeHtml(text);

  safe =
    safe.replace(
      /(^|\s)(#[a-zA-Z0-9_]+)/g,
      '$1<span class="hashtag">$2</span>'
    );

  safe =
    safe.replace(
      /(^|\s)(@[a-zA-Z0-9_]+)/g,
      '$1<span class="mention">$2</span>'
    );

  return safe;

}


/* CURRENT USER */

onAuthStateChanged(
  auth,
  async function(user){

    if(!user){

      showToast(
        "Please log in to use Zemivo."
      );

      setTimeout(() => {

        location.href =
          "login.html";

      },1200);

      return;

    }


    currentUser =
      user;


    const profileRef =
      doc(
        db,
        "profiles",
        user.uid
      );


    try{

      const profileSnap =
        await getDoc(profileRef);


      if(profileSnap.exists()){

        currentProfile =
          profileSnap.data();

      }
      else{

        currentProfile = {

          displayName:
            user.displayName ||
            "Zemivo User",

          role:
            "user"

        };

      }


      const name =
        currentProfile.displayName ||
        user.displayName ||
        "Zemivo User";


      currentAvatar.textContent =
        name.charAt(0).toUpperCase();


      /*
       ADMIN UI

       This is only the frontend visibility layer.
       Real administrator authorization MUST later
       be enforced by Firestore Security Rules / backend.
      */

      if(
        currentProfile.role ===
        "admin"
      ){

        adminPanel.classList.add(
          "show"
        );

      }


      startFeedListener();

    }
    catch(error){

      console.error(error);

      showToast(
        "Could not load your Zemivo profile."
      );

      startFeedListener();

    }

  }
);


/* FEED LISTENER */

function startFeedListener(){

  if(unsubscribeFeed){
    unsubscribeFeed();
  }


  const postsQuery =
    query(
      collection(
        db,
        "posts"
      ),
      orderBy(
        "createdAt",
        "desc"
      )
    );


  unsubscribeFeed =
    onSnapshot(
      postsQuery,
      function(snapshot){

        if(snapshot.empty){

          feed.innerHTML = `
            <div class="empty">
              No posts yet.<br>
              Be the first person to post on Zemivo.
            </div>
          `;

          return;

        }


        feed.innerHTML = "";


        snapshot.forEach(
          function(postSnapshot){

            const post =
              postSnapshot.data();

            const postId =
              postSnapshot.id;


            renderPost(
              postId,
              post
            );

          }
        );

      },
      function(error){

        console.error(error);

        feed.innerHTML = `
          <div class="empty">
            Could not load posts.<br>
            Please check Firestore permissions.
          </div>
        `;

      }
    );

}


/* RENDER POST */

function renderPost(
  postId,
  post
){

  const article =
    document.createElement("article");


  article.className =
    "post";


  const name =
    post.displayName ||
    "Zemivo User";


  const initial =
    name
      .charAt(0)
      .toUpperCase();


  const created =
    post.createdAt &&
    post.createdAt.toDate
      ? post.createdAt.toDate()
      : new Date();


  const dateText =
    created.toLocaleString();


  const isOwner =
    currentUser &&
    post.uid ===
    currentUser.uid;


  const isAdmin =
    currentProfile &&
    currentProfile.role ===
    "admin";


  const menuItems = `

    <button
      class="menu-item"
      data-action="save"
    >
      🔖 Save post
    </button>

    ${
      isOwner
      ?
      `
      <button
        class="menu-item"
        data-action="edit"
      >
        ✏️ Edit post
      </button>

      <button
        class="menu-item"
        data-action="archive"
      >
        📦 Move to archive
      </button>

      <button
        class="menu-item danger"
        data-action="delete"
      >
        🗑️ Move to trash
      </button>

function insertTextAtCursor(text){

  const start =
    postText.selectionStart;

  const end =
    postText.selectionEnd;

  const before =
    postText.value.substring(
      0,
      start
    );

  const after =
    postText.value.substring(
      end
    );

  postText.value =
    before +
    text +
    after;

  postText.selectionStart =
    postText.selectionEnd =
      start + text.length;

}

/* READ FILE */

function readFileAsDataURL(file){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();


      reader.onload =
        () =>
          resolve(
            reader.result
          );


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}

/* LIKE */

async function toggleLike(
  postId,
  post
){

  if(!currentUser){
    return;
  }


  const ref =
    doc(
      db,
      "posts",
      postId
    );


  const liked =
    Array.isArray(post.likedBy) &&
    post.likedBy.includes(
      currentUser.uid
    );


  try{

    if(liked){

      await updateDoc(
        ref,
        {
          likes:
            increment(-1),

          likedBy:
            arrayRemove(
              currentUser.uid
            )
        }
      );

    }
    else{

      await updateDoc(
        ref,
        {
          likes:
            increment(1),

          likedBy:
            arrayUnion(
              currentUser.uid
            )
        }
      );

    }

  }
  catch(error){

    console.error(error);

    showToast(
      "Could not update reaction."
    );

  }

}

/* SHARE */

async function sharePost(
  postId,
  post
){

  try{

    const shareUrl =
      location.origin +
      location.pathname +
      "?post=" +
      encodeURIComponent(
        postId
      );


    if(
      navigator.share
    ){

      await navigator.share({

        title:
          "Zemivo post",

        text:
          post.text ||
          "Check this post on Zemivo.",

        url:
          shareUrl

      });

    }
    else if(
      navigator.clipboard
    ){

      await navigator.clipboard.writeText(
        shareUrl
      );

      showToast(
        "Post link copied."
      );

    }


    await updateDoc(
      doc(
        db,
        "posts",
        postId
      ),
      {
        shares:
          increment(1)
      }
    );

  }
  catch(error){

    console.error(error);

  }

}

/* LOAD COMMENTS */

function loadComments(
  postId,
  article
){

  const commentsList =
    article.querySelector(
      "[data-comments]"
    );


  const commentsQuery =
    query(
      collection(
        db,
        "posts",
        postId,
        "comments"
      ),
      orderBy(
        "createdAt",
        "asc"
      )
    );


  onSnapshot(
    commentsQuery,
    function(snapshot){

      commentsList.innerHTML = "";


      snapshot.forEach(
        function(commentSnapshot){

          const comment =
            commentSnapshot.data();


          const div =
            document.createElement(
              "div"
            );


          div.className =
            "comment";


          div.innerHTML = `

            <div class="comment-name">
              ${escapeHtml(
                comment.displayName ||
                "Zemivo User"
              )}
            </div>

            <div class="comment-text">
              ${formatPostText(
                comment.text || ""
              )}
            </div>

          `;


          commentsList.appendChild(
            div
          );

        }
      );

    },
    function(error){

      console.error(
        "Comment listener error:",
        error
      );

    }
  );

}
