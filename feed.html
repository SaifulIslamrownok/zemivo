<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zemivo Feed</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f0f2f5;
  color:#17202a;
}

button,
input,
textarea,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  height:62px;
  background:#fff;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
}

.logo{
  color:#2563eb;
  font-size:28px;
  font-weight:800;
}

.top-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#f0f2f5;
  font-size:19px;
}

.page{
  width:100%;
  max-width:760px;
  margin:22px auto;
  padding:0 12px;
}

/* COMPOSER */

.composer{
  background:#fff;
  border-radius:16px;
  padding:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.composer-top{
  display:flex;
  gap:12px;
  align-items:flex-start;
}

.avatar{
  width:46px;
  height:46px;
  min-width:46px;
  border-radius:50%;
  background:#2563eb;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.composer textarea{
  width:100%;
  min-height:90px;
  resize:none;
  border:0;
  outline:0;
  font-size:18px;
  padding:8px 4px;
  background:#fff;
}

.composer textarea::placeholder{
  color:#777;
}

.composer-extra{
  display:none;
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid #eee;
}

.composer-extra.show{
  display:block;
}

.field{
  margin-bottom:10px;
}

.field input,
.field select{
  width:100%;
  padding:11px 12px;
  border:1px solid #ddd;
  border-radius:10px;
  outline:none;
  background:#fff;
}

.media-preview{
  display:none;
  position:relative;
  margin-top:10px;
  border-radius:12px;
  overflow:hidden;
  background:#f3f4f6;
}

.media-preview.show{
  display:block;
}

.media-preview img,
.media-preview video{
  width:100%;
  max-height:380px;
  object-fit:cover;
  display:block;
}

.remove-media{
  position:absolute;
  top:8px;
  right:8px;
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.65);
  color:#fff;
  font-size:18px;
  z-index:5;
}

.composer-tools{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid #eee;
}

.tool-left{
  display:flex;
  gap:6px;
  align-items:center;
}

.tool{
  border:0;
  background:#f0f2f5;
  border-radius:20px;
  padding:9px 12px;
  font-size:14px;
}

.tool:hover{
  background:#e4e6e9;
}

.plus-btn{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#2563eb;
  color:white;
  font-size:25px;
  font-weight:bold;
}

.media-menu{
  display:none;
  position:absolute;
  left:0;
  bottom:54px;
  width:240px;
  background:#fff;
  border-radius:14px;
  box-shadow:0 5px 22px rgba(0,0,0,.18);
  padding:8px;
  z-index:50;
}

.media-menu.show{
  display:block;
}

.media-option{
  width:100%;
  border:0;
  background:#fff;
  padding:12px;
  text-align:left;
  border-radius:10px;
  font-size:15px;
}

.media-option:hover{
  background:#f0f2f5;
}

.publish-row{
  margin-top:12px;
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.audience{
  flex:1;
  padding:11px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
}

.publish{
  flex:1;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  min-height:44px;
}

.publish:disabled{
  opacity:.6;
  cursor:not-allowed;
}

/* ADMIN */

.admin-panel{
  display:none;
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin-bottom:16px;
  border:2px solid #2563eb;
}

.admin-panel.show{
  display:block;
}

.admin-title{
  font-weight:bold;
  color:#2563eb;
  margin-bottom:10px;
}

.admin-note{
  font-size:13px;
  color:#666;
  margin-bottom:10px;
}

/* FEED */

.feed{
  margin-top:18px;
}

.post{
  background:#fff;
  border-radius:16px;
  margin-bottom:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  overflow:hidden;
}

.post-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px 16px 10px;
}

.post-user{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.post-name{
  font-weight:bold;
  overflow-wrap:anywhere;
}

.post-meta{
  color:#777;
  font-size:12px;
  margin-top:3px;
}

.post-menu-wrap{
  position:relative;
}

.dots{
  width:38px;
  height:38px;
  border:0;
  background:#f0f2f5;
  border-radius:50%;
  font-size:20px;
}

.post-menu{
  display:none;
  position:absolute;
  right:0;
  top:44px;
  width:220px;
  background:#fff;
  border-radius:12px;
  box-shadow:0 5px 22px rgba(0,0,0,.2);
  padding:7px;
  z-index:80;
}

.post-menu.show{
  display:block;
}

.menu-item{
  width:100%;
  border:0;
  background:#fff;
  padding:11px;
  border-radius:9px;
  text-align:left;
  font-size:14px;
}

.menu-item:hover{
  background:#f0f2f5;
}

.menu-item.danger{
  color:#dc2626;
}

.post-content{
  padding:4px 16px 12px;
  font-size:16px;
  line-height:1.55;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.post-content .hashtag{
  color:#2563eb;
}

.post-content .mention{
  color:#2563eb;
}

.post-media{
  width:100%;
  max-height:550px;
  object-fit:cover;
  display:block;
}

.post-info{
  padding:9px 16px;
  display:flex;
  justify-content:space-between;
  color:#777;
  font-size:13px;
}

.post-actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-top:1px solid #eee;
  border-bottom:1px solid #eee;
}

.action{
  border:0;
  background:#fff;
  padding:12px 5px;
  font-size:14px;
  font-weight:600;
}

.action:hover{
  background:#f0f2f5;
}

.action.active{
  color:#2563eb;
}

.action.spark{
  color:#f59e0b;
}

/* COMMENTS */

.comments{
  padding:10px 16px 15px;
}

.comment{
  background:#f0f2f5;
  border-radius:12px;
  padding:8px 11px;
  margin-bottom:7px;
}

.comment-name{
  font-weight:bold;
  font-size:13px;
}

.comment-text{
  font-size:14px;
  margin-top:2px;
}

.comment-form{
  display:flex;
  gap:7px;
  margin-top:9px;
}

.comment-form input{
  flex:1;
  border:1px solid #ddd;
  border-radius:20px;
  padding:10px 13px;
  outline:none;
}

.comment-form button{
  border:0;
  background:#2563eb;
  color:#fff;
  border-radius:20px;
  padding:0 15px;
}

.empty{
  text-align:center;
  color:#777;
  padding:40px 10px;
  background:#fff;
  border-radius:16px;
}

.loading{
  text-align:center;
  padding:30px;
  color:#777;
}

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  background:#111827;
  color:#fff;
  padding:12px 18px;
  border-radius:10px;
  display:none;
  z-index:999;
  max-width:90%;
  text-align:center;
}

.toast.show{
  display:block;
}

.edit-area{
  width:100%;
  min-height:120px;
  border:1px solid #ddd;
  border-radius:10px;
  padding:12px;
  resize:vertical;
  outline:none;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:500;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:500px;
  background:#fff;
  border-radius:16px;
  padding:18px;
}

.modal-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:12px;
}

.modal-buttons{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.modal-buttons button{
  flex:1;
  padding:11px;
  border:0;
  border-radius:10px;
}

.cancel{
  background:#e5e7eb;
}

.confirm{
  background:#2563eb;
  color:#fff;
}

@media(max-width:600px){

  .page{
    margin-top:12px;
  }

  .topbar{
    padding:0 12px;
  }

  .logo{
    font-size:24px;
  }

  .tool{
    padding:8px 9px;
  }

  .post-actions{
    font-size:13px;
  }

  .post-info{
    gap:10px;
  }

}
</style>
</head>

<body>

<header class="topbar">

  <div class="logo">Zemivo</div>

  <div class="top-actions">

    <button
      class="icon-btn"

      onclick="location.href='notifications.html'"
    >

    </button>

<main class="page">

  <!-- ADMIN -->

  <section

    <div class="admin-title">

  <!-- POST COMPOSER -->

<!-- FILE INPUTS -->

  type="file"

>

<!-- EDIT MODAL -->

>

<div
  id="toast"

<script type="module">

/* FIREBASE */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp,
  increment,
  arrayUnion,
  arrayRemove
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

  apiKey:
    "AIzaSyAxJUFBWm2fa0g3oxUWWqdfSTEAc-bRgfI",

  authDomain:
    "zemivo.firebaseapp.com",

  projectId:
    "zemivo",

  storageBucket:
    "zemivo.firebasestorage.app",

  messagingSenderId:
    "195335939691",

  appId:
    "1:195335939691:web:5fa5c62c53d0c0aefe732e",

  measurementId:
    "G-GNHH5S4H09"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* ELEMENTS */

const postText =
  document.getElementById("postText");

const publishButton =
  document.getElementById("publishButton");

const feed =
  document.getElementById("feed");

const plusButton =
  document.getElementById("plusButton");

const mediaMenu =
  document.getElementById("mediaMenu");

const imageInput =
  document.getElementById("imageInput");

const videoInput =
  document.getElementById("videoInput");

const mediaPreview =
  document.getElementById("mediaPreview");

const imagePreview =
  document.getElementById("imagePreview");

const videoPreview =
  document.getElementById("videoPreview");

const removeMedia =
  document.getElementById("removeMedia");

const composerExtra =
  document.getElementById("composerExtra");

const detailsButton =
  document.getElementById("detailsButton");

const locationInput =
  document.getElementById("locationInput");

const groupInput =
  document.getElementById("groupInput");

const productInput =
  document.getElementById("productInput");

const quickAudience =
  document.getElementById("quickAudience");

const audienceSelect =
  document.getElementById("audienceSelect");

const currentAvatar =
  document.getElementById("currentAvatar");

const toast =
  document.getElementById("toast");

const editModal =
  document.getElementById("editModal");

const editText =
  document.getElementById("editText");

const cancelEdit =
  document.getElementById("cancelEdit");

const saveEdit =
  document.getElementById("saveEdit");

const adminPanel =
  document.getElementById("adminPanel");

const adminText =
  document.getElementById("adminText");

const adminPublish =
  document.getElementById("adminPublish");


/* STATE */

let currentUser = null;

let currentProfile = null;

let selectedFile = null;

let selectedFileType = null;

let editingPostId = null;

let unsubscribeFeed = null;


/* TOAST */

function showToast(text){

  toast.textContent =
    text;

  toast.classList.add(
    "show"
  );

  setTimeout(
    function(){

      toast.classList.remove(
        "show"
      );

    },
    3000
  );

}


/* ESCAPE */

function escapeHtml(value){

  if(
    value === undefined ||
    value === null
  ){

    return "";

  }

  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


/* TEXT FORMAT */

function formatPostText(text){

  let safe =
    escapeHtml(text);

  safe =
    safe.replace(
      /(^|\s)(#[a-zA-Z0-9_]+)/g,
      '$1<span class="hashtag">$2</span>'
    );

  safe =
    safe.replace(
      /(^|\s)(@[a-zA-Z0-9_]+)/g,
      '$1<span class="mention">$2</span>'
    );

  return safe;

}


/* AUTH */

onAuthStateChanged(
  auth,
  async function(user){

    if(!user){

      currentUser =
        null;

      feed.innerHTML = `
        <div class="empty">
          Please log in to use Zemivo Feed.
        </div>
      `;

      showToast(
        "Please log in first."
      );

      setTimeout(
        function(){

          location.href =
            "login.html";

        },
        1500
      );

      return;

    }


    currentUser =
      user;


    const profileRef =
      doc(
        db,
        "profiles",
        user.uid
      );


    try{

      const profileSnap =
        await getDoc(
          profileRef
        );


      if(
        profileSnap.exists()
      ){

        currentProfile =
          profileSnap.data();

      }
      else{

        currentProfile = {

          displayName:
            user.displayName ||
            "Zemivo User",

          role:
            "user"

        };

      }


      const name =
        currentProfile.displayName ||
        user.displayName ||
        "Zemivo User";


      currentAvatar.textContent =
        name
          .charAt(0)
          .toUpperCase();


      if(
        currentProfile.role ===
        "admin"
      ){

        adminPanel.classList.add(
          "show"
        );

      }


    }
    catch(error){

      console.error(
        "Profile error:",
        error
      );


      currentProfile = {

        displayName:
          user.displayName ||
          "Zemivo User",

        role:
          "user"

      };


      currentAvatar.textContent =
        (
          currentProfile.displayName
        )
        .charAt(0)
        .toUpperCase();

    }


    startFeedListener();

  }
);


/* FEED */

function startFeedListener(){

  if(
    unsubscribeFeed
  ){

    unsubscribeFeed();

    unsubscribeFeed =
      null;

  }


  feed.innerHTML = `
    <div class="loading">
      Loading Zemivo feed...
    </div>
  `;


  let postsQuery;


  try{

    postsQuery =
      query(
        collection(
          db,
          "posts"
        ),
        orderBy(
          "createdAt",
          "desc"
        )
      );

  }
  catch(error){

    console.error(error);

    feed.innerHTML = `
      <div class="empty">
        Could not prepare Zemivo Feed.
      </div>
    `;

    return;

  }


  unsubscribeFeed =
    onSnapshot(
      postsQuery,

      function(snapshot){

        const posts = [];

        snapshot.forEach(
          function(postSnapshot){

            const post =
              postSnapshot.data();

            const postId =
              postSnapshot.id;


            /*
             Show published posts
             and old posts that do
             not have a status field.
            */

            if(
              post.status === "trash" ||
              post.status === "archived"
            ){

              return;

            }


            posts.push({
              id:postId,
              data:post
            });

          }
        );


        if(
          posts.length === 0
        ){

          feed.innerHTML = `
            <div class="empty">
              No posts yet.<br>
              Be the first person to post on Zemivo.
            </div>
          `;

          return;

        }


        feed.innerHTML = "";


        posts.forEach(
          function(item){

            renderPost(
              item.id,
              item.data
            );

          }
        );

      },

      function(error){

        console.error(
          "Feed listener error:",
          error
        );


        feed.innerHTML = `
          <div class="empty">
            <strong>
              Zemivo Feed could not load.
            </strong>
            <br><br>
            Please check Firebase Firestore permissions.
          </div>
        `;

      }
    );

}


/* RENDER */

function renderPost(
  postId,
  post
){

  const article =
    document.createElement(
      "article"
    );


  article.className =
    "post";


  const name =
    post.displayName ||
    "Zemivo User";


  const initial =
    name
      .charAt(0)
      .toUpperCase();


  let created =
    new Date();


  if(
    post.createdAt &&
    typeof post.createdAt.toDate ===
    "function"
  ){

    created =
      post.createdAt.toDate();

  }


  const dateText =
    created.toLocaleString();


  const isOwner =
    currentUser &&
    post.uid ===
    currentUser.uid;


  const isAdmin =
    currentProfile &&
    currentProfile.role ===
    "admin";


  let menuItems = `

    <button
      class="menu-item"
      data-action="save"
      type="button"
    >

    </button>

      class="menu-item"
      data-action="copy"
      type="button"
    >
      🔗 Copy link

        data-action="edit"
        type="button"
      >

      </button>

      <button
        class="menu-item"
        data-action="archive"
        type="button"
      >
        📦 Move to archive
      </button>

      <button
        class="menu-item danger"
        data-action="delete"
        type="button"
      >
        🗑️ Move to trash

  }


  if(isAdmin){

    menuItems += `

      <button
        class="menu-item"
        data-action="adminFeature"
        type="button"
      >
        🛡️ Admin control
      </button>

    `;

  }


  let mediaHTML =
    "";


  if(
    post.mediaPreview
  ){

    if(
      post.mediaType ===
      "video"
    ){

      mediaHTML = `
        <video
          class="post-media"
          src="${escapeHtml(post.mediaPreview)}"
          controls
          playsinline
        ></video>
      `;

    }
    else{

      mediaHTML = `
        <img
          class="post-media"
          src="${escapeHtml(post.mediaPreview)}"
          alt="Zemivo post"
        >
      `;

    }

  }


  const productHTML =
    post.productLink
    ?
    `
      <div style="padding:10px 16px;">
        <a
          href="${escapeHtml(post.productLink)}"
          target="_blank"
          rel="noopener noreferrer"
          style="
            color:#2563eb;
            font-weight:bold;
            text-decoration:none;
          "
        >
          🔗 View product / affiliate link
        </a>
      </div>
    `
    :
    "";


  const locationHTML =
    post.location
    ?
    `
      <div
        style="
          padding:0 16px 10px;
          color:#666;
          font-size:13px;
        "
      >
        📍 ${escapeHtml(post.location)}
      </div>
    `
    :
    "";


  const groupHTML =
    post.group
    ?
    `
      <div
        style="
          padding:0 16px 10px;
          color:#2563eb;
          font-size:13px;
        "
      >
        👥 ${escapeHtml(post.group)}
      </div>
    `
    :
    "";


  const liked =
    Array.isArray(post.likedBy) &&
    currentUser &&
    post.likedBy.includes(
      currentUser.uid
    );


  const likes =
    Number(post.likes || 0);


  const commentsCount =
    Number(
      post.commentsCount || 0
    );


  const shares =
    Number(
      post.shares || 0
    );


  const sparks =
    Number(
      post.sparks || 0
    );


  article.innerHTML = `

    <div class="post-head">

      <div class="post-user">

        <div class="avatar">
          ${escapeHtml(initial)}
        </div>

        <div>

          <div class="post-name">

    <div class="post-info">

      if(!actionButton){

      }


      const action =
        actionButton.dataset.action;


      try{

        if(
          action === "like"
        ){

          await toggleLike(
            postId,
            post
          );

        }


        if(
          action === "share"
        ){

          await sharePost(
            postId,
            post

        }


        if(
          action === "spark"

        if(

        }


        if(
          action === "copy"

    article.querySelector(
      "[data-comment-input]"

/* PREVIEW */

function previewSelectedFile(){

  if(!selectedFile){
    return;
  }


  const reader =
    new FileReader();


  reader.onload =
    function(event){

      mediaPreview.classList.add(
        "show"
      );


      if(
        selectedFileType ===
        "image"
      ){

        imagePreview.src =
          event.target.result;

        imagePreview.style.display =
          "block";

        videoPreview.style.display =
          "none";

      }
      else{

        videoPreview.src =
          event.target.result;

        videoPreview.style.display =
          "block";

        imagePreview.style.display =
          "none";

      }

    };


  reader.onerror =
    function(){

      showToast(
        "Could not preview this file."
      );

    };


  reader.readAsDataURL(
    selectedFile
  );

}

/* INSERT TEXT */

function insertTextAtCursor(
  text
){

  const start =
    postText.selectionStart;

  const end =
    postText.selectionEnd;


  const before =
    postText.value.substring(
      0,
      start
    );


  const after =
    postText.value.substring(
      end
    );


  postText.value =
    before +
    text +
    after;


  postText.selectionStart =
    postText.selectionEnd =
      start + text.length;

}

publishButton.addEventListener(
  "click",
  async function(){

    if(!currentUser){

      showToast(
        "Please log in first."
      );

      return;

    }


    const text =
      postText.value.trim();


    /*
     IMPORTANT:
     For this testing version,
     media is only previewed locally.
     Text post is saved normally.
    */

    if(
      !text &&
      !selectedFile
    ){

      showToast(
        "Write something or select media first."
      );

      return;

    }


    /*
     To keep Firestore safe,
     prevent large media from being
     saved directly as Base64.
    */

    if(
      selectedFile &&
      selectedFile.size >
      700000
    ){

      showToast(
        "For now use a small image/video. Firebase Storage will be connected later for large media."
      );

      return;

    }


    publishButton.disabled =
      true;

    publishButton.textContent =
      "Posting...";


    try{

      let mediaPreviewData =
        null;


      if(
        selectedFile
      ){

        mediaPreviewData =
          await readFileAsDataURL(
            selectedFile
          );

      }


      const postData = {

        uid:
          currentUser.uid,

        displayName:
          currentProfile?.displayName ||
          currentUser.displayName ||
          "Zemivo User",

        text:
          text,

        createdAt:
          serverTimestamp(),

        updatedAt:
          serverTimestamp(),

        audience:
          quickAudience.value,

        location:
          locationInput.value.trim(),

        group:
          groupInput.value.trim(),

        productLink:
          productInput.value.trim(),

        mediaType:
          selectedFileType ||
          null,

        mediaPreview:
          mediaPreviewData,

        likes:
          0,

        commentsCount:
          0,

        shares:
          0,

        sparks:
          0,

        likedBy:
          [],

        sparkBy:
          [],

        status:
          "published",

        isAdminAnnouncement:
          false

      };


      const postRef =
        await addDoc(
          collection(
            db,
            "posts"
          ),
          postData
        );


      console.log(
        "Post created:",
        postRef.id
      );


      clearComposer();


      showToast(
        "Post published successfully."
      );

    }
    catch(error){

      console.error(
        "POST ERROR:",
        error
      );


      if(
        error.code ===
        "permission-denied"
      ){

        showToast(
          "Firebase permission denied. Firestore Rules need to allow logged-in users to create posts."
        );

      }
      else{

        showToast(
          "Post could not be published. Check browser console/Firebase."
        );

      }

    }
    finally{

      publishButton.disabled =
        false;

      publishButton.textContent =
        "Post";

    }

  }
);


/* FILE READER */

function readFileAsDataURL(
  file
){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();


      reader.onload =
        function(){

          resolve(
            reader.result
          );

        };


      reader.onerror =
        function(error){

          reject(
            error
          );

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}

/* LIKE */

async function toggleLike(
  postId,
  post
){

  if(!currentUser){
    return;
  }


  const ref =
    doc(
      db,
      "posts",
      postId
    );


  const liked =
    Array.isArray(
      post.likedBy
    ) &&
    post.likedBy.includes(
      currentUser.uid
    );


  try{

    if(liked){

      await updateDoc(
        ref,
        {

          likes:
            increment(-1),

          likedBy:
            arrayRemove(
              currentUser.uid
            )

        }
      );

    }
    else{

      await updateDoc(
        ref,
        {

          likes:
            increment(1),

          likedBy:
            arrayUnion(
              currentUser.uid
            )

        }
      );

    }

  }
  catch(error){

    console.error(
      "Like error:",
      error
    );

    showToast(
      "Could not update reaction."
    );

  }

}

/* SHARE */

async function sharePost(
  postId,
  post
){

  try{

    const shareUrl =
      location.origin +
      location.pathname +
      "?post=" +
      encodeURIComponent(
        postId
      );


    if(
      navigator.share
    ){

      await navigator.share({

        title:
          "Zemivo post",

        text:
          post.text ||
          "Check this post on Zemivo.",

        url:
          shareUrl

      });

    }
    else if(
      navigator.clipboard
    ){

      await navigator.clipboard.writeText(
        shareUrl
      );

      showToast(
        "Post link copied."
      );

    }


    await updateDoc(
      doc(
        db,
        "posts",
        postId
      ),
      {

        shares:
          increment(1)

      }
    );

  }
  catch(error){

    console.error(
      "Share error:",
      error
    );

  }

}

      "Post moved to trash."
    );

  }
  catch(error){

    console.error(
      "Trash error:",
      error
    );

    showToast(
      "Could not move post to trash."
    );

  }

}

){

  try{

      ),
      {

    );

/* COMMENT */

async function submitComment(
  postId,
  input
){

  if(!currentUser){
    return;
  }


  const text =
    input.value.trim();


  if(!text){
    return;
  }


  try{

    await addDoc(
      collection(
        db,
        "posts",
        postId,
        "comments"
      ),
      {

        uid:
          currentUser.uid,

        displayName:
          currentProfile?.displayName ||
          currentUser.displayName ||
          "Zemivo User",

        text:
          text,

        createdAt:
          serverTimestamp()

      }
    );


    await updateDoc(
      doc(
        db,
        "posts",
        postId
      ),
      {

        commentsCount:
          increment(1)

      }
    );


    input.value =
      "";

  }
  catch(error){

    console.error(
      "Comment error:",
      error
    );

    showToast(
      "Could not send comment."
    );

  }

}


/* LOAD COMMENTS */

function loadComments(
  postId,
  article
){

  const commentsList =
    article.querySelector(
      "[data-comments]"
    );


  if(!commentsList){
    return;
  }


  const commentsQuery =
    query(
      collection(
        db,
        "posts",
        postId,
        "comments"
      ),
      orderBy(
        "createdAt",
        "asc"
      )
    );


  onSnapshot(
    commentsQuery,

    function(snapshot){

      commentsList.innerHTML =
        "";


      snapshot.forEach(
        function(commentSnapshot){

          const comment =
            commentSnapshot.data();


          const div =
            document.createElement(
              "div"
            );


          div.className =
            "comment";


          div.innerHTML = `

            <div class="comment-name">
              ${escapeHtml(
                comment.displayName ||
                "Zemivo User"
              )}
            </div>

            <div class="comment-text">
              ${formatPostText(
                comment.text ||
                ""
              )}
            </div>

          `;


          commentsList.appendChild(
            div
          );

        }
      );

    },

    function(error){

      console.error(
        "Comment listener error:",
        error
      );

    }
  );

}


/* ADMIN */

adminPublish.addEventListener(
  "click",
  async function(){

    if(
      !currentUser ||
      !currentProfile ||
      currentProfile.role !==
      "admin"
    ){

      showToast(
        "Administrator permission required."
      );

      return;

    }


    const text =
      adminText.value.trim();


    if(!text){

      showToast(
        "Write an announcement first."
      );

      return;

    }


    adminPublish.disabled =
      true;

    adminPublish.textContent =
      "Publishing...";


    try{

      await addDoc(
        collection(
          db,
          "posts"
        ),
        {

          uid:
            currentUser.uid,

          displayName:
            currentProfile.displayName ||
            "Zemivo Administration",

          text:
            text,

          createdAt:
            serverTimestamp(),

          updatedAt:
            serverTimestamp(),

          audience:
            "global",

          likes:
            0,

          commentsCount:
            0,

          shares:
            0,

          sparks:
            0,

          likedBy:
            [],

          sparkBy:
            [],

          status:
            "published",

          isAdminAnnouncement:
            true

        }
      );


      adminText.value =
        "";

      showToast(
        "Official announcement published."
      );

    }
    catch(error){

      console.error(
        "Admin post error:",
        error
      );

      showToast(
        "Announcement failed."
      );

    }
    finally{

      adminPublish.disabled =
        false;

      adminPublish.textContent =
        "Publish Global Announcement";

    }

  }
);

</script>
